manifest_version: 1
id: http_page_flag_generator
kind: flag-generator
name: HTTP Page Flag Generator
description: Generates an HTML page with embedded credentials and a deterministic
  flag.
version: 1.0
runtime:
  type: docker-compose
  compose_file: docker-compose.yml
  service: generator
inputs:
- name: seed
  type: string
  required: true
- name: username
  type: string
  required: false
  flow_supply_when_first: true
- name: password
  type: string
  required: false
  sensitive: true
  flow_supply_when_first: true
artifacts:
  requires:
  - Knowledge(ip)
  optional_requires:
  - Knowledge(hostname)
  produces:
  - Flag(flag_id)
  - File(path)
hint_templates:
- Web content and its source can expose operational secrets.
injects:
- File(path)
inject_candidate_paths:
- /var/www/html/docs
- /srv/http/public
- /opt/web/content
- /home/www-data/public
env:
  GENERATOR_TYPE: http_page
hint_levels:
  low:
  - Web content and its source can expose operational secrets.
  medium:
  - 'Artifact on {{THIS_NODE_NAME}}: {{OUTPUT.File(path):basename}}.'
  - Read the injected HTML, JSON, or robots-style file, including comments. This artifact does not create its own HTTPS listener.
  high:
  - 'Answer: {{OUTPUT.Flag(flag_id)}}'
  - |-
    On the target, or after copying the artifact locally, set artifact to its actual path; this example assumes the current directory.
    ```bash
    artifact="./{{OUTPUT.File(path):basename}}"
    cat "$artifact"
    ```
