manifest_version: 1
id: binary_magic_header_payload
kind: flag-generator
name: 'Binary: Magic Header Payload'
description: Generate a custom binary payload with a recognizable header and embedded
  flag bytes.
runtime:
  type: docker-compose
  compose_file: docker-compose.yml
  service: generator
env:
  ARTIFACT_VARIANT_ID: binary_magic_header_payload
inputs:
- name: seed
  type: string
  required: false
- name: flag_prefix
  type: string
  required: false
- name: File(path)
  type: string
  required: false
- name: Flag(flag_id)
  type: string
  required: false
  sensitive: true
artifacts:
  requires: []
  produces:
  - Flag(flag_id)
  - FlagDelivery(mode)
  - File(path)
  - Checksum(sha256)
  - Binary(format)
injects:
- File(path)
inject_candidate_paths:
- /usr/local/bin
- /opt/tools
- /var/tmp
hint_template: Human-readable data may survive inside a binary artifact.
hint_levels:
  low:
  - Human-readable data may survive inside a binary artifact.
  medium:
  - 'Artifact on {{THIS_NODE_NAME}}: {{OUTPUT.File(path):basename}}.'
  - After CTGPAYLOAD, a two-byte big-endian length describes the following text payload.
  high:
  - 'Answer: {{OUTPUT.Flag(flag_id)}}'
  - |-
    On the target, or after copying the artifact locally, set artifact to its actual path; this example assumes the current directory.
    ```bash
    artifact="./{{OUTPUT.File(path):basename}}"
    python3 - "$artifact" <<'PY'
    import sys
    from pathlib import Path
    p = Path(sys.argv[1])
    data = p.read_bytes()
    start = len(b"CTGPAYLOAD")
    size = int.from_bytes(data[start:start + 2], "big")
    print(data[start + 2:start + 2 + size].decode())
    PY
    ```
