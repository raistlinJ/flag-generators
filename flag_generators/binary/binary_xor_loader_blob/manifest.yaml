manifest_version: 1
id: binary_xor_loader_blob
kind: flag-generator
name: 'Binary: XOR Loader Blob'
description: Generate a loader-style binary blob with a XOR-encoded recovery flag.
runtime:
  type: docker-compose
  compose_file: docker-compose.yml
  service: generator
env:
  ARTIFACT_VARIANT_ID: binary_xor_loader_blob
inputs:
- name: seed
  type: string
  required: false
- name: flag_prefix
  type: string
  required: false
- name: File(path)
  type: string
  required: false
- name: Flag(flag_id)
  type: string
  required: false
  sensitive: true
artifacts:
  requires: []
  produces:
  - Flag(flag_id)
  - FlagDelivery(mode)
  - File(path)
  - Checksum(sha256)
  - Binary(architecture)
  - Encoding(name)
  - DecryptionKey(value)
injects:
- File(path)
inject_candidate_paths:
- /usr/local/bin
- /opt/tools
- /var/tmp
hint_template: Human-readable data may survive inside a binary artifact.
hint_levels:
  low:
  - Human-readable data may survive inside a binary artifact.
  medium:
  - 'Artifact on {{THIS_NODE_NAME}}: {{OUTPUT.File(path):basename}}.'
  - The CORETG-XOR header is followed by a one-byte XOR key and an encoded flag.
  high:
  - 'Answer: {{OUTPUT.Flag(flag_id)}}'
  - |-
    On the target, or after copying the artifact locally, set artifact to its actual path; this example assumes the current directory.
    ```bash
    artifact="./{{OUTPUT.File(path):basename}}"
    python3 - "$artifact" <<'PY'
    import sys
    from pathlib import Path
    p = Path(sys.argv[1])
    data = p.read_bytes()
    start = data.index(b"CORETG-XOR") + len(b"CORETG-XOR")
    key = data[start]
    end = data.index(b"\x00loader telemetry", start + 1)
    print(bytes(byte ^ key for byte in data[start + 1:end]).decode())
    PY
    ```
  - 'DecryptionKey(value): {{OUTPUT.DecryptionKey(value)}}'
