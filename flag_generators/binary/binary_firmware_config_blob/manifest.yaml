manifest_version: 1
id: binary_firmware_config_blob
kind: flag-generator
name: 'Binary: Firmware Config Blob'
description: Generate a firmware-like image that hides a recovery marker in device
  metadata.
runtime:
  type: docker-compose
  compose_file: docker-compose.yml
  service: generator
env:
  ARTIFACT_VARIANT_ID: binary_firmware_config_blob
inputs:
- name: seed
  type: string
  required: false
- name: flag_prefix
  type: string
  required: false
- name: File(path)
  type: string
  required: false
- name: Flag(flag_id)
  type: string
  required: false
  sensitive: true
artifacts:
  requires: []
  produces:
  - Flag(flag_id)
  - FlagDelivery(mode)
  - File(path)
  - Checksum(sha256)
  - Binary(format)
  - Version(service)
injects:
- File(path)
inject_candidate_paths:
- /usr/local/bin
- /opt/firmware
- /var/tmp
hint_template: Human-readable data may survive inside a binary artifact.
hint_levels:
  low:
  - Human-readable data may survive inside a binary artifact.
  medium:
  - 'Artifact on {{THIS_NODE_NAME}}: {{OUTPUT.File(path):basename}}.'
  - Inspect the file signature and printable strings before attempting to execute anything.
  high:
  - 'Answer: {{OUTPUT.Flag(flag_id)}}'
  - |-
    On the target, or after copying the artifact locally, set artifact to its actual path; this example assumes the current directory.
    ```bash
    artifact="./{{OUTPUT.File(path):basename}}"
    strings -a "$artifact"
    ```
