manifest_version: 1
id: '115'
kind: flag-generator
name: 'Archive: ZIP Support Bundle'
description: Generate a support bundle ZIP with diagnostics, logs, and a flagged escalation
  marker.
runtime:
  type: docker-compose
  compose_file: docker-compose.yml
  service: generator
env:
  ARTIFACT_VARIANT_ID: archive_zip_support_bundle
inputs:
- name: seed
  type: string
  required: false
- name: flag_prefix
  type: string
  required: false
- name: File(path)
  type: string
  required: false
- name: Flag(flag_id)
  type: string
  required: false
  sensitive: true
artifacts:
  requires: []
  produces:
  - Flag(flag_id)
  - FlagDelivery(mode)
  - File(path)
  - Checksum(sha256)
  - Archive(format)
  - Ticket(id)
injects:
- File(path)
inject_candidate_paths:
- /srv/support/bundles
- /var/tmp/support
- /opt/app/support
- /home/support/uploads
hint_template: The useful evidence is inside a backup or evidence bundle.
hint_levels:
  low:
  - The useful evidence is inside a backup or evidence bundle.
  medium:
  - 'Artifact on {{THIS_NODE_NAME}}: {{OUTPUT.File(path):basename}}.'
  - This is a ZIP archive; list its members and inspect nested evidence files.
  high:
  - 'Answer: {{OUTPUT.Flag(flag_id)}}'
  - The flag-bearing member is logs/escalation.log.
  - |-
    On the target, or after copying the artifact locally, set artifact to its actual path; this example assumes the current directory.
    ```bash
    artifact="./{{OUTPUT.File(path):basename}}"
    unzip -p "$artifact" logs/escalation.log
    ```
