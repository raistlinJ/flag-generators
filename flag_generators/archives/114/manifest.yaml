manifest_version: 1
id: '114'
kind: flag-generator
name: 'Archive: TAR SIEM Export'
description: Generate a tarred SIEM export where a correlation alert includes the
  generated flag.
runtime:
  type: docker-compose
  compose_file: docker-compose.yml
  service: generator
env:
  ARTIFACT_VARIANT_ID: archive_tar_siem_export
inputs:
- name: seed
  type: string
  required: false
- name: flag_prefix
  type: string
  required: false
- name: File(path)
  type: string
  required: false
- name: Flag(flag_id)
  type: string
  required: false
  sensitive: true
artifacts:
  requires: []
  produces:
  - Flag(flag_id)
  - FlagDelivery(mode)
  - File(path)
  - Checksum(sha256)
  - Archive(format)
  - Alert(id)
injects:
- File(path)
inject_candidate_paths:
- /srv/siem/exports
- /var/log/siem
- /opt/security/exports
- /tmp/siem_drop
hint_template: The useful evidence is inside a backup or evidence bundle.
hint_levels:
  low:
  - The useful evidence is inside a backup or evidence bundle.
  medium:
  - 'Artifact on {{THIS_NODE_NAME}}: {{OUTPUT.File(path):basename}}.'
  - This is a tar archive; list its members and inspect nested evidence files.
  high:
  - 'Answer: {{OUTPUT.Flag(flag_id)}}'
  - The flag-bearing member is alerts/correlation-17.json.
  - |-
    On the target, or after copying the artifact locally, set artifact to its actual path; this example assumes the current directory.
    ```bash
    artifact="./{{OUTPUT.File(path):basename}}"
    tar -xOf "$artifact" alerts/correlation-17.json
    ```
