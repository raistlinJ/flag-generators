manifest_version: 1
id: '114'
kind: flag-generator
name: 'Archive: TAR SIEM Export'
description: Generate a tarred SIEM export where a correlation alert includes the
  generated flag.
runtime:
  type: docker-compose
  compose_file: docker-compose.yml
  service: generator
env:
  ARTIFACT_VARIANT_ID: archive_tar_siem_export
inputs:
- name: seed
  type: string
  required: false
- name: flag_prefix
  type: string
  required: false
- name: File(path)
  type: string
  required: false
- name: Flag(flag_id)
  type: string
  required: false
  sensitive: true
artifacts:
  requires: []
  produces:
  - Flag(flag_id)
  - FlagDelivery(mode)
  - File(path)
  - Checksum(sha256)
  - Archive(format)
  - Alert(id)
injects:
- File(path)
inject_candidate_paths:
- /srv/siem/exports
- /var/log/siem
- /opt/security/exports
- /tmp/siem_drop
hint_template: Inspect the SIEM export alert details after extracting the archive.
hint_levels:
  low:
  - Inspect the SIEM export alert details after extracting the archive.
  medium:
  - 'File/artifact: {{OUTPUT.File(path):basename}}'
  high:
  - Inspect the generated artifact contents for the complete workflow.
