manifest_version: 1
id: archive_zip_nested_evidence
kind: flag-generator
name: 'Archive: ZIP Nested Evidence'
description: Generate a ZIP evidence bundle with the flag nested below realistic review
  folders.
runtime:
  type: docker-compose
  compose_file: docker-compose.yml
  service: generator
env:
  ARTIFACT_VARIANT_ID: archive_zip_nested_evidence
inputs:
- name: seed
  type: string
  required: false
- name: flag_prefix
  type: string
  required: false
- name: File(path)
  type: string
  required: false
- name: Flag(flag_id)
  type: string
  required: false
  sensitive: true
artifacts:
  requires: []
  produces:
  - Flag(flag_id)
  - FlagDelivery(mode)
  - File(path)
  - Checksum(sha256)
  - Archive(format)
injects:
- File(path)
inject_candidate_paths:
- /srv/backups
- /var/backups
- /opt/archive
hint_template: The useful evidence is inside a backup or evidence bundle.
hint_levels:
  low:
  - The useful evidence is inside a backup or evidence bundle.
  medium:
  - 'Artifact on {{THIS_NODE_NAME}}: {{OUTPUT.File(path):basename}}.'
  - This is a ZIP archive; list its members and inspect nested evidence files.
  high:
  - 'Answer: {{OUTPUT.Flag(flag_id)}}'
  - The flag-bearing member is nested/recovery/flag.txt.
  - |-
    On the target, or after copying the artifact locally, set artifact to its actual path; this example assumes the current directory.
    ```bash
    artifact="./{{OUTPUT.File(path):basename}}"
    unzip -p "$artifact" nested/recovery/flag.txt
    ```
