manifest_version: 1
id: '112'
kind: flag-generator
name: 'Archive: TGZ Config Backup'
description: Generate a gzipped tar configuration backup with a flagged recovery note
  nested among service files.
runtime:
  type: docker-compose
  compose_file: docker-compose.yml
  service: generator
env:
  ARTIFACT_VARIANT_ID: archive_tgz_config_backup
inputs:
- name: seed
  type: string
  required: false
- name: flag_prefix
  type: string
  required: false
- name: File(path)
  type: string
  required: false
- name: Flag(flag_id)
  type: string
  required: false
  sensitive: true
artifacts:
  requires: []
  produces:
  - Flag(flag_id)
  - FlagDelivery(mode)
  - File(path)
  - Checksum(sha256)
  - Archive(format)
  - Compression(format)
injects:
- File(path)
inject_candidate_paths:
- /srv/backups/config
- /var/backups/config
- /opt/archive/config
- /home/operator/backups
hint_template: Unpack the compressed config backup on {{NEXT_NODE_NAME}} before continuing.
hint_levels:
  low:
  - Unpack the compressed config backup on {{NEXT_NODE_NAME}} before continuing.
  medium:
  - 'File/artifact: {{OUTPUT.File(path):basename}}'
  high:
  - Inspect the generated artifact contents for the complete workflow.
