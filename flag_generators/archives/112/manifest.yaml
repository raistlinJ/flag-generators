manifest_version: 1
id: '112'
kind: flag-generator
name: 'Archive: TGZ Config Backup'
description: Generate a gzipped tar configuration backup with a flagged recovery note
  nested among service files.
runtime:
  type: docker-compose
  compose_file: docker-compose.yml
  service: generator
env:
  ARTIFACT_VARIANT_ID: archive_tgz_config_backup
inputs:
- name: seed
  type: string
  required: false
- name: flag_prefix
  type: string
  required: false
- name: File(path)
  type: string
  required: false
- name: Flag(flag_id)
  type: string
  required: false
  sensitive: true
artifacts:
  requires: []
  produces:
  - Flag(flag_id)
  - FlagDelivery(mode)
  - File(path)
  - Checksum(sha256)
  - Archive(format)
  - Compression(format)
injects:
- File(path)
inject_candidate_paths:
- /srv/backups/config
- /var/backups/config
- /opt/archive/config
- /home/operator/backups
hint_template: The useful evidence is inside a backup or evidence bundle.
hint_levels:
  low:
  - The useful evidence is inside a backup or evidence bundle.
  medium:
  - 'Artifact on {{THIS_NODE_NAME}}: {{OUTPUT.File(path):basename}}.'
  - This is a gzip-compressed tar archive; list its members and inspect nested evidence files.
  high:
  - 'Answer: {{OUTPUT.Flag(flag_id)}}'
  - The flag-bearing member is etc/app/recovery.flag.
  - |-
    On the target, or after copying the artifact locally, set artifact to its actual path; this example assumes the current directory.
    ```bash
    artifact="./{{OUTPUT.File(path):basename}}"
    tar -xzOf "$artifact" etc/app/recovery.flag
    ```
