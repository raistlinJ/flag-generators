manifest_version: 1
id: '74'
kind: flag-generator
name: 'Hash: MD5 Legacy Token'
description: Generate a legacy MD5 digest challenge tied to a deterministic service
  token and flag.
runtime:
  type: docker-compose
  compose_file: docker-compose.yml
  service: generator
env:
  ARTIFACT_VARIANT_ID: hash_md5_legacy_token
inputs:
- name: seed
  type: string
  required: false
- name: flag_prefix
  type: string
  required: false
- name: File(path)
  type: string
  required: false
- name: Flag(flag_id)
  type: string
  required: false
  sensitive: true
artifacts:
  requires: []
  produces:
  - Flag(flag_id)
  - FlagDelivery(mode)
  - File(path)
  - Checksum(sha256)
  - Token(service)
  - Hash(value)
injects:
- File(path)
inject_candidate_paths:
- /etc/security/legacy
- /opt/auth/legacy
- /var/lib/auth/digests
- /srv/identity/hashes
hint_template: The artifact uses a legacy digest and includes enough context to identify
  the token.
hint_levels:
  low:
  - The artifact uses a legacy digest and includes enough context to identify the
    token.
  medium:
  - 'File/artifact: {{OUTPUT.File(path):basename}}'
  high:
  - Inspect the generated artifact contents for the complete workflow.
