manifest_version: 1
id: hash_shadow_style_operator
kind: flag-generator
name: 'Hash: Shadow Style Operator'
description: Generate a shadow-file-style operator credential with a deterministic
  salted digest.
runtime:
  type: docker-compose
  compose_file: docker-compose.yml
  service: generator
env:
  ARTIFACT_VARIANT_ID: hash_shadow_style_operator
inputs:
- name: seed
  type: string
  required: true
- name: flag_prefix
  type: string
  required: false
- name: File(path)
  type: string
  required: false
  description: Optional output artifact filename.
- name: Flag(flag_id)
  type: string
  required: false
  sensitive: true
artifacts:
  requires:
  - Knowledge(ip)
  optional_requires: []
  produces:
  - Flag(flag_id)
  - FlagDelivery(mode)
  - File(path)
  - Credential(user,password)
  - Credential(user,hash)
  - Hash(value)
  - Checksum(sha256)
injects:
- File(path)
inject_candidate_paths:
- /etc/security
- /etc/auth.d
- /var/lib/accounts
- /srv/identity
hint_levels:
  low:
  - Treat the artifact like a small shadow-file fragment.
  medium:
  - 'Credential or token artifact: {{OUTPUT.File(path):basename}}'
  high:
  - Inspect the generated artifact contents for the complete workflow.
