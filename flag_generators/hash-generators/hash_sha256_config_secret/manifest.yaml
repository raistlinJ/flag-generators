manifest_version: 1
id: hash_sha256_config_secret
kind: flag-generator
name: 'Hash: SHA256 Config Secret'
description: Generate a SHA256 digest tied to a config backup secret and service account.
runtime:
  type: docker-compose
  compose_file: docker-compose.yml
  service: generator
env:
  ARTIFACT_VARIANT_ID: hash_sha256_config_secret
inputs:
- name: seed
  type: string
  required: true
- name: flag_prefix
  type: string
  required: false
- name: File(path)
  type: string
  required: false
  description: Optional output artifact filename.
- name: Flag(flag_id)
  type: string
  required: false
  sensitive: true
artifacts:
  requires:
  - Knowledge(ip)
  optional_requires: []
  produces:
  - Flag(flag_id)
  - FlagDelivery(mode)
  - File(path)
  - Credential(user,password)
  - Hash(value)
  - Checksum(sha256)
injects:
- File(path)
inject_candidate_paths:
- /etc/app
- /opt/service/config
- /var/backups/config
- /srv/config
hint_levels:
  low:
  - Separate the digest from the account or recovery information stored beside it.
  medium:
  - 'Artifact on {{THIS_NODE_NAME}}: {{OUTPUT.File(path):basename}}.'
  - Identify the digest input and any salt before testing a candidate. A hash is not a reversible text encoding.
  high:
  - 'Answer: {{OUTPUT.Flag(flag_id)}}'
  - The sha256 field hashes password:token. A password-only digest will not match.
  - |-
    On the target, or after copying the artifact locally, set artifact to its actual path; this example assumes the current directory.
    ```bash
    artifact="./{{OUTPUT.File(path):basename}}"
    cat "$artifact"
    ```
  - 'Credential(user,password): {{OUTPUT.Credential(user,password)}}'
