manifest_version: 1
id: hash_sha1_legacy_password
kind: flag-generator
name: 'Hash: SHA1 Legacy Password'
description: Generate a SHA1 digest for a deterministic legacy password recovery challenge.
runtime:
  type: docker-compose
  compose_file: docker-compose.yml
  service: generator
env:
  ARTIFACT_VARIANT_ID: hash_sha1_legacy_password
inputs:
- name: seed
  type: string
  required: true
- name: flag_prefix
  type: string
  required: false
- name: File(path)
  type: string
  required: false
  description: Optional output artifact filename.
- name: Flag(flag_id)
  type: string
  required: false
  sensitive: true
artifacts:
  requires:
  - Knowledge(ip)
  optional_requires: []
  produces:
  - Flag(flag_id)
  - FlagDelivery(mode)
  - File(path)
  - Credential(user,password)
  - Hash(value)
  - Checksum(sha256)
injects:
- File(path)
inject_candidate_paths:
- /etc/security
- /opt/auth
- /var/lib/auth
- /srv/config
hint_levels:
  low:
  - Separate the digest from the account or recovery information stored beside it.
  medium:
  - 'Artifact on {{THIS_NODE_NAME}}: {{OUTPUT.File(path):basename}}.'
  - Identify the digest input and any salt before testing a candidate. A hash is not a reversible text encoding.
  high:
  - 'Answer: {{OUTPUT.Flag(flag_id)}}'
  - The sha1 field hashes the service-account password. The username is printed beside it.
  - |-
    On the target, or after copying the artifact locally, set artifact to its actual path; this example assumes the current directory.
    ```bash
    artifact="./{{OUTPUT.File(path):basename}}"
    cat "$artifact"
    ```
  - 'Credential(user,password): {{OUTPUT.Credential(user,password)}}'
