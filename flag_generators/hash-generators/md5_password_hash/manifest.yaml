manifest_version: 1
id: md5_password_hash
kind: flag-generator
name: MD5 Password Hash
description: Generates an MD5 hash of a common 5-letter word for reverse lookup challenges.
version: 1.0
runtime:
  type: docker-compose
  compose_file: docker-compose.yml
  service: generator
inputs:
- name: seed
  type: string
  required: true
artifacts:
  requires:
  - Knowledge(ip)
  optional_requires:
  - Knowledge(hostname)
  produces:
  - Flag(flag_id)
  - Credential(user,password)
  - File(path)
hint_templates:
- A short password can be recognizable from its legacy digest.
injects:
- File(path)
inject_candidate_paths:
- /etc/security
- /opt/auth
- /var/lib/auth
- /srv/config
env:
  MD5_HASH: 'true'
hint_levels:
  low:
  - A short password can be recognizable from its legacy digest.
  medium:
  - 'Artifact on {{THIS_NODE_NAME}}: {{OUTPUT.File(path):basename}}.'
  - Read the MD5 Hash field and test a common five-letter greeting.
  high:
  - 'Answer: {{OUTPUT.Flag(flag_id)}}'
  - The password is hello. The submitted flag for this recipe is the MD5 digest itself, not the plaintext password.
  - |-
    On the target, or after copying the artifact locally, set artifact to its actual path; this example assumes the current directory.
    ```bash
    artifact="./{{OUTPUT.File(path):basename}}"
    printf %s hello | md5sum
    ```
  - 'Credential(user,password): {{OUTPUT.Credential(user,password)}}'
