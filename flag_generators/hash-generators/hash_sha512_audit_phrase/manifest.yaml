manifest_version: 1
id: hash_sha512_audit_phrase
kind: flag-generator
name: 'Hash: SHA512 Audit Phrase'
description: Generate a SHA512 digest for an audit phrase embedded in a review handoff.
runtime:
  type: docker-compose
  compose_file: docker-compose.yml
  service: generator
env:
  ARTIFACT_VARIANT_ID: hash_sha512_audit_phrase
inputs:
- name: seed
  type: string
  required: true
- name: flag_prefix
  type: string
  required: false
- name: File(path)
  type: string
  required: false
  description: Optional output artifact filename.
- name: Flag(flag_id)
  type: string
  required: false
  sensitive: true
artifacts:
  requires:
  - Knowledge(ip)
  optional_requires: []
  produces:
  - Flag(flag_id)
  - FlagDelivery(mode)
  - File(path)
  - Hash(value)
  - Checksum(sha256)
injects:
- File(path)
inject_candidate_paths:
- /srv/audit
- /opt/review
- /var/tmp/audit
- /home/auditor/drop
hint_levels:
  low:
  - Separate the digest from the account or recovery information stored beside it.
  medium:
  - 'Artifact on {{THIS_NODE_NAME}}: {{OUTPUT.File(path):basename}}.'
  - Identify the digest input and any salt before testing a candidate. A hash is not a reversible text encoding.
  high:
  - 'Answer: {{OUTPUT.Flag(flag_id)}}'
  - The audit phrase is hashed with SHA512, but the flag is also written directly in the flag field.
  - |-
    On the target, or after copying the artifact locally, set artifact to its actual path; this example assumes the current directory.
    ```bash
    artifact="./{{OUTPUT.File(path):basename}}"
    cat "$artifact"
    ```
