manifest_version: 1
id: '92'
kind: flag-generator
name: 'Encoding: Morse Ops Bulletin'
description: Generate a Morse-coded operations bulletin whose decoded text contains
  the flag.
runtime:
  type: docker-compose
  compose_file: docker-compose.yml
  service: generator
env:
  ARTIFACT_VARIANT_ID: encoding_morse_ops_bulletin
inputs:
- name: seed
  type: string
  required: true
- name: flag_prefix
  type: string
  required: false
- name: File(path)
  type: string
  required: false
  description: Optional output artifact filename.
- name: Flag(flag_id)
  type: string
  required: false
  sensitive: true
artifacts:
  requires:
  - Knowledge(ip)
  optional_requires: []
  produces:
  - Flag(flag_id)
  - FlagDelivery(mode)
  - File(path)
  - Encoding(name)
  - Encoded(value)
  - Checksum(sha256)
injects:
- File(path)
inject_candidate_paths:
- /opt/radio/logs
- /srv/comms
- /var/tmp/signals
- /home/operator/messages
hint_levels:
  low:
  - The bulletin uses a classic signal encoding.
  medium:
  - 'Encoded artifact: {{OUTPUT.File(path):basename}}'
  high:
  - Inspect the generated artifact contents for the complete workflow.
