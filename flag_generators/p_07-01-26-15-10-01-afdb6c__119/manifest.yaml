manifest_version: 1
id: '119'
kind: flag-generator
name: 'Encoded: URL Callback Secret'
description: Generate a URL-encoded callback containing a token and recovery marker.
runtime:
  type: docker-compose
  compose_file: docker-compose.yml
  service: generator
env:
  ARTIFACT_VARIANT_ID: encoded_url_callback
inputs:
- name: seed
  type: string
  required: false
- name: flag_prefix
  type: string
  required: false
- name: File(path)
  type: string
  required: false
- name: Flag(flag_id)
  type: string
  required: false
  sensitive: true
artifacts:
  requires: []
  produces:
  - Flag(flag_id)
  - FlagDelivery(mode)
  - File(path)
  - Checksum(sha256)
  - Encoding(name)
  - Encoded(value)
  - Endpoint(path)
injects:
- File(path)
inject_candidate_paths:
- /var/www/html/assets
- /opt/messages
- /tmp/encoded
hint_template: Decode /flow_injects/{{OUTPUT.File(path):basename}} on {{NEXT_NODE_NAME}}
  @ {{NEXT_NODE_IP}}.
hint_levels:
  low:
  - Decode /flow_injects/{{OUTPUT.File(path):basename}} on {{NEXT_NODE_NAME}} @ {{NEXT_NODE_IP}}.
  medium:
  - 'File/artifact: {{OUTPUT.File(path):basename}}'
  high:
  - Inspect the generated artifact contents for the complete workflow.
