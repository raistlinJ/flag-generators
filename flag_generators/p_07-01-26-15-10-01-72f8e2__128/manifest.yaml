manifest_version: 1
id: '128'
kind: flag-generator
name: 'Binary: Packet Capture Blob'
description: Generate a compact capture-like binary payload with the flag hidden in
  packet metadata.
runtime:
  type: docker-compose
  compose_file: docker-compose.yml
  service: generator
env:
  ARTIFACT_VARIANT_ID: binary_packet_capture_blob
inputs:
- name: seed
  type: string
  required: false
- name: flag_prefix
  type: string
  required: false
- name: File(path)
  type: string
  required: false
  description: Optional output artifact filename.
- name: Flag(flag_id)
  type: string
  required: false
  sensitive: true
artifacts:
  requires: []
  optional_requires: []
  produces:
  - Flag(flag_id)
  - FlagDelivery(mode)
  - File(path)
  - Binary(format)
  - Checksum(sha256)
injects:
- File(path)
inject_candidate_paths:
- /var/log/network
- /opt/captures
- /srv/pcap
- /tmp/netdumps
hint_levels:
  low:
  - Look for the injected capture payload before moving to {{NEXT_NODE_NAME}}.
  medium:
  - 'File/artifact: {{OUTPUT.File(path):basename}}'
  high:
  - Inspect the generated artifact contents for the complete workflow.
