manifest_version: 1
id: '125'
kind: flag-generator
name: 'Text: SSH Known Hosts Comment'
description: Generate a known_hosts-style text artifact where a comment preserves
  a flag-bearing host note.
runtime:
  type: docker-compose
  compose_file: docker-compose.yml
  service: generator
env:
  ARTIFACT_VARIANT_ID: text_ssh_known_hosts_comment
inputs:
- name: seed
  type: string
  required: false
- name: flag_prefix
  type: string
  required: false
- name: File(path)
  type: string
  required: false
- name: Flag(flag_id)
  type: string
  required: false
  sensitive: true
artifacts:
  requires: []
  produces:
  - Flag(flag_id)
  - FlagDelivery(mode)
  - FlagFile(path)
  - File(path)
  - Checksum(sha256)
  - Hostname(host)
injects:
- File(path)
inject_candidate_paths:
- /home/operator/.ssh
- /srv/admin/ssh
- /opt/bastion/config
- /var/backups/ssh
hint_template: Inspect comments and host aliases in the SSH note.
hint_levels:
  low:
  - Inspect comments and host aliases in the SSH note.
  medium:
  - 'File/artifact: {{OUTPUT.File(path):basename}}'
  high:
  - Inspect the generated artifact contents for the complete workflow.
