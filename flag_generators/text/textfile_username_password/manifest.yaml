manifest_version: 1
id: textfile_username_password
kind: flag-generator
name: 'Sample: Textfile Username/Password'
description: Emit a secrets text file and a deterministic flag.
hint_template: Operational files can disclose more than their intended purpose.
runtime:
  type: docker-compose
  compose_file: docker-compose.yml
  service: generator
inputs:
- name: seed
  type: text
  required: false
- name: flag_prefix
  type: text
  required: false
- name: Credential(user, password)
  type: text
  required: false
  flow_supply_when_first: true
artifacts:
  requires: []
  produces:
  - Flag(flag_id)
  - File(path)
injects:
- File(path)
inject_candidate_paths:
- /srv/docs
- /opt/notes
- /var/tmp
- /home/player/Desktop
hint_levels:
  low:
  - Operational files can disclose more than their intended purpose.
  medium:
  - 'Artifact on {{THIS_NODE_NAME}}: {{OUTPUT.File(path):basename}}.'
  - Inspect the Textfile Username/Password artifact as text and look for recovery, flag, marker, or credential fields.
  high:
  - 'Answer: {{OUTPUT.Flag(flag_id)}}'
  - |-
    On the target, or after copying the artifact locally, set artifact to its actual path; this example assumes the current directory.
    ```bash
    artifact="./{{OUTPUT.File(path):basename}}"
    cat "$artifact"
    ```
