manifest_version: 1
id: '122'
kind: flag-generator
name: 'Text: Runbook Escalation Note'
description: Generate a runbook note containing an escalation path, temporary credential,
  and flag.
runtime:
  type: docker-compose
  compose_file: docker-compose.yml
  service: generator
env:
  ARTIFACT_VARIANT_ID: text_runbook_escalation_note
inputs:
- name: seed
  type: string
  required: false
- name: flag_prefix
  type: string
  required: false
- name: File(path)
  type: string
  required: false
- name: Flag(flag_id)
  type: string
  required: false
  sensitive: true
artifacts:
  requires: []
  produces:
  - Flag(flag_id)
  - FlagDelivery(mode)
  - FlagFile(path)
  - File(path)
  - Checksum(sha256)
  - Credential(user,password)
  - Ticket(id)
injects:
- File(path)
inject_candidate_paths:
- /srv/docs/runbooks
- /var/www/html/runbooks
- /opt/ops/runbooks
- /home/operator/docs
hint_template: Operational files can disclose more than their intended purpose.
hint_levels:
  low:
  - Operational files can disclose more than their intended purpose.
  medium:
  - 'Artifact on {{THIS_NODE_NAME}}: {{OUTPUT.File(path):basename}}.'
  - 'Inspect the Text: Runbook Escalation Note artifact as text and look for recovery, flag, marker, or credential fields.'
  high:
  - 'Answer: {{OUTPUT.Flag(flag_id)}}'
  - |-
    On the target, or after copying the artifact locally, set artifact to its actual path; this example assumes the current directory.
    ```bash
    artifact="./{{OUTPUT.File(path):basename}}"
    cat "$artifact"
    ```
  - 'Credential(user,password): {{OUTPUT.Credential(user,password)}}'
