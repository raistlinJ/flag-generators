manifest_version: 1
id: '106'
kind: flag-generator
name: 'Text: Runbook Escalation Note'
description: Generate a runbook note containing an escalation path, temporary credential,
  and flag.
runtime:
  type: docker-compose
  compose_file: docker-compose.yml
  service: generator
env:
  ARTIFACT_VARIANT_ID: text_runbook_escalation_note
inputs:
- name: seed
  type: string
  required: false
- name: flag_prefix
  type: string
  required: false
- name: File(path)
  type: string
  required: false
- name: Flag(flag_id)
  type: string
  required: false
  sensitive: true
artifacts:
  requires: []
  produces:
  - Flag(flag_id)
  - FlagDelivery(mode)
  - FlagFile(path)
  - File(path)
  - Checksum(sha256)
  - Credential(user,password)
  - Ticket(id)
injects:
- File(path)
inject_candidate_paths:
- /srv/docs/runbooks
- /var/www/html/runbooks
- /opt/ops/runbooks
- /home/operator/docs
hint_template: Read the runbook escalation note on {{NEXT_NODE_NAME}}.
hint_levels:
  low:
  - Read the runbook escalation note on {{NEXT_NODE_NAME}}.
  medium:
  - 'File/artifact: {{OUTPUT.File(path):basename}}'
  high:
  - Inspect the generated artifact contents for the complete workflow.
