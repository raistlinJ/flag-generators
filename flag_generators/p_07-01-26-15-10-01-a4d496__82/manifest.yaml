manifest_version: 1
id: '82'
kind: flag-generator
name: 'Archive: ZIP Case Notes'
description: Generate a ZIP case note export with a flag-bearing review document in
  a nested evidence folder.
runtime:
  type: docker-compose
  compose_file: docker-compose.yml
  service: generator
env:
  ARTIFACT_VARIANT_ID: archive_zip_case_notes
inputs:
- name: seed
  type: string
  required: false
- name: flag_prefix
  type: string
  required: false
- name: File(path)
  type: string
  required: false
- name: Flag(flag_id)
  type: string
  required: false
  sensitive: true
artifacts:
  requires: []
  produces:
  - Flag(flag_id)
  - FlagDelivery(mode)
  - File(path)
  - Checksum(sha256)
  - Archive(format)
  - Case(id)
injects:
- File(path)
inject_candidate_paths:
- /srv/evidence/cases
- /var/casework/exports
- /opt/legal/archive
- /home/analyst/cases
hint_template: The case note archive has nested evidence folders worth reviewing.
hint_levels:
  low:
  - The case note archive has nested evidence folders worth reviewing.
  medium:
  - 'File/artifact: {{OUTPUT.File(path):basename}}'
  high:
  - Inspect the generated artifact contents for the complete workflow.
