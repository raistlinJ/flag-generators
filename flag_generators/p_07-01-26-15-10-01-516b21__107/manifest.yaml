manifest_version: 1
id: '107'
kind: flag-generator
name: 'Text: ChatOps Transcript'
description: Generate a ChatOps transcript with a deployment token and flagged approval
  line.
runtime:
  type: docker-compose
  compose_file: docker-compose.yml
  service: generator
env:
  ARTIFACT_VARIANT_ID: text_chatops_transcript
inputs:
- name: seed
  type: string
  required: false
- name: flag_prefix
  type: string
  required: false
- name: File(path)
  type: string
  required: false
- name: Flag(flag_id)
  type: string
  required: false
  sensitive: true
artifacts:
  requires: []
  produces:
  - Flag(flag_id)
  - FlagDelivery(mode)
  - FlagFile(path)
  - File(path)
  - Checksum(sha256)
  - Token(service)
  - Ticket(id)
injects:
- File(path)
inject_candidate_paths:
- /srv/chat/exports
- /opt/chatops/logs
- /var/tmp/chat_exports
- /home/support/transcripts
hint_template: The ChatOps export contains the approval line needed for the next step.
hint_levels:
  low:
  - The ChatOps export contains the approval line needed for the next step.
  medium:
  - 'File/artifact: {{OUTPUT.File(path):basename}}'
  high:
  - Inspect the generated artifact contents for the complete workflow.
