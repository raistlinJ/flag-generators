manifest_version: 1
id: formatted_json_profile_secret
kind: flag-generator
name: 'Formatted: JSON Profile Secret'
description: Generate a service profile JSON document containing a flag and API key.
runtime:
  type: docker-compose
  compose_file: docker-compose.yml
  service: generator
env:
  ARTIFACT_VARIANT_ID: formatted_json_profile_secret
inputs:
- name: seed
  type: string
  required: false
- name: flag_prefix
  type: string
  required: false
- name: File(path)
  type: string
  required: false
- name: Flag(flag_id)
  type: string
  required: false
  sensitive: true
artifacts:
  requires: []
  produces:
  - Flag(flag_id)
  - FlagDelivery(mode)
  - FlagFile(path)
  - File(path)
  - Checksum(sha256)
  - Format(name)
  - APIKey(service)
injects:
- File(path)
inject_candidate_paths:
- /etc/app
- /srv/config
- /opt/service/conf
hint_template: Structured exports can contain sensitive fields alongside ordinary records.
hint_levels:
  low:
  - Structured exports can contain sensitive fields alongside ordinary records.
  medium:
  - 'Artifact on {{THIS_NODE_NAME}}: {{OUTPUT.File(path):basename}}.'
  - Inspect the flag or recovery_flag field and adjacent account fields in the structured export.
  high:
  - 'Answer: {{OUTPUT.Flag(flag_id)}}'
  - |-
    On the target, or after copying the artifact locally, set artifact to its actual path; this example assumes the current directory.
    ```bash
    artifact="./{{OUTPUT.File(path):basename}}"
    cat "$artifact"
    ```
  - 'APIKey(service): {{OUTPUT.APIKey(service)}}'
