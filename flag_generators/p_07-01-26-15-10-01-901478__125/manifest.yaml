manifest_version: 1
id: '125'
kind: flag-generator
name: 'Hash: SHA512 Audit Phrase'
description: Generate a SHA512 digest for an audit phrase embedded in a review handoff.
runtime:
  type: docker-compose
  compose_file: docker-compose.yml
  service: generator
env:
  ARTIFACT_VARIANT_ID: hash_sha512_audit_phrase
inputs:
- name: seed
  type: string
  required: true
- name: flag_prefix
  type: string
  required: false
- name: File(path)
  type: string
  required: false
  description: Optional output artifact filename.
- name: Flag(flag_id)
  type: string
  required: false
  sensitive: true
artifacts:
  requires:
  - Knowledge(ip)
  optional_requires: []
  produces:
  - Flag(flag_id)
  - FlagDelivery(mode)
  - File(path)
  - Hash(value)
  - Checksum(sha256)
injects:
- File(path)
inject_candidate_paths:
- /srv/audit
- /opt/review
- /var/tmp/audit
- /home/auditor/drop
hint_levels:
  low:
  - The note points to a recoverable audit phrase digest.
  medium:
  - 'Credential or token artifact: {{OUTPUT.File(path):basename}}'
  high:
  - Inspect the generated artifact contents for the complete workflow.
