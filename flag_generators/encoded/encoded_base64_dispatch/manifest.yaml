manifest_version: 1
id: encoded_base64_dispatch
kind: flag-generator
name: 'Encoded: Base64 Dispatch Note'
description: Generate a dispatch note whose handoff details are base64 encoded.
runtime:
  type: docker-compose
  compose_file: docker-compose.yml
  service: generator
env:
  ARTIFACT_VARIANT_ID: encoded_base64_dispatch
inputs:
- name: seed
  type: string
  required: false
- name: flag_prefix
  type: string
  required: false
- name: File(path)
  type: string
  required: false
- name: Flag(flag_id)
  type: string
  required: false
  sensitive: true
artifacts:
  requires: []
  produces:
  - Flag(flag_id)
  - FlagDelivery(mode)
  - File(path)
  - Checksum(sha256)
  - Encoding(name)
  - Encoded(value)
injects:
- File(path)
inject_candidate_paths:
- /var/www/html/assets
- /opt/messages
- /tmp/encoded
hint_template: The message is encoded rather than encrypted.
hint_levels:
  low:
  - The message is encoded rather than encrypted.
  medium:
  - 'Artifact on {{THIS_NODE_NAME}}: {{OUTPUT.File(path):basename}}.'
  - The encoding is Base64; decode it to inspect the message fields.
  high:
  - 'Answer: {{OUTPUT.Flag(flag_id)}}'
  - |-
    On the target, or after copying the artifact locally, set artifact to its actual path; this example assumes the current directory.
    ```bash
    artifact="./{{OUTPUT.File(path):basename}}"
    python3 - "$artifact" <<'PY'
    import sys
    from pathlib import Path
    p = Path(sys.argv[1])
    import base64
    print(base64.b64decode(p.read_bytes()).decode())
    PY
    ```
