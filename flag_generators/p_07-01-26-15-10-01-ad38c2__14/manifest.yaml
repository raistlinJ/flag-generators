manifest_version: 1
id: '14'
kind: flag-generator
name: 'HTTPS: Client Config Leak'
description: Generate a leaked HTTPS client configuration JSON file with a token and
  flag marker.
runtime:
  type: docker-compose
  compose_file: docker-compose.yml
  service: generator
env:
  ARTIFACT_VARIANT_ID: https_client_config_leak
inputs:
- name: seed
  type: string
  required: true
- name: flag_prefix
  type: string
  required: false
- name: File(path)
  type: string
  required: false
  description: Optional output artifact filename.
- name: Flag(flag_id)
  type: string
  required: false
  sensitive: true
- name: username
  type: string
  required: false
  flow_supply_when_first: true
- name: password
  type: string
  required: false
  sensitive: true
  flow_supply_when_first: true
artifacts:
  requires:
  - Knowledge(ip)
  optional_requires:
  - Knowledge(hostname)
  produces:
  - Flag(flag_id)
  - FlagDelivery(mode)
  - File(path)
  - Token(service)
  - Endpoint(path)
  - Checksum(sha256)
  - FlagFile(path)
injects:
- File(path)
inject_candidate_paths:
- /var/www/html/config
- /srv/http/public/config
- /opt/web/static
- /srv/https/client
hint_levels:
  low:
  - Look for a client configuration file exposed over the web path.
  medium:
  - 'Credential or token artifact: {{OUTPUT.File(path):basename}}'
  high:
  - Inspect the generated artifact contents for the complete workflow.
