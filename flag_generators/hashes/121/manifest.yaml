manifest_version: 1
id: '121'
kind: flag-generator
name: 'Hash: Manifest Checksum Gate'
description: Generate a checksum manifest where one listed asset name points to the
  generated flag.
runtime:
  type: docker-compose
  compose_file: docker-compose.yml
  service: generator
env:
  ARTIFACT_VARIANT_ID: hash_manifest_checksum_gate
inputs:
- name: seed
  type: string
  required: false
- name: flag_prefix
  type: string
  required: false
- name: File(path)
  type: string
  required: false
- name: Flag(flag_id)
  type: string
  required: false
  sensitive: true
artifacts:
  requires: []
  produces:
  - Flag(flag_id)
  - FlagDelivery(mode)
  - File(path)
  - Checksum(sha256)
  - Hash(value)
injects:
- File(path)
inject_candidate_paths:
- /srv/releases/manifests
- /opt/app/checksums
- /var/lib/update/manifests
- /tmp/release_hashes
hint_template: Separate the digest from the account or recovery information stored beside it.
hint_levels:
  low:
  - Separate the digest from the account or recovery information stored beside it.
  medium:
  - 'Artifact on {{THIS_NODE_NAME}}: {{OUTPUT.File(path):basename}}.'
  - Identify the digest input and any salt before testing a candidate. A hash is not a reversible text encoding.
  high:
  - 'Answer: {{OUTPUT.Flag(flag_id)}}'
  - The recover.txt line contains SHA256(flag). It is a checksum entry; this artifact does not include recover.txt itself.
  - |-
    On the target, or after copying the artifact locally, set artifact to its actual path; this example assumes the current directory.
    ```bash
    artifact="./{{OUTPUT.File(path):basename}}"
    cat "$artifact"
    ```
