manifest_version: 1
id: '121'
kind: flag-generator
name: 'Hash: Manifest Checksum Gate'
description: Generate a checksum manifest where one listed asset name points to the
  generated flag.
runtime:
  type: docker-compose
  compose_file: docker-compose.yml
  service: generator
env:
  ARTIFACT_VARIANT_ID: hash_manifest_checksum_gate
inputs:
- name: seed
  type: string
  required: false
- name: flag_prefix
  type: string
  required: false
- name: File(path)
  type: string
  required: false
- name: Flag(flag_id)
  type: string
  required: false
  sensitive: true
artifacts:
  requires: []
  produces:
  - Flag(flag_id)
  - FlagDelivery(mode)
  - File(path)
  - Checksum(sha256)
  - Hash(value)
injects:
- File(path)
inject_candidate_paths:
- /srv/releases/manifests
- /opt/app/checksums
- /var/lib/update/manifests
- /tmp/release_hashes
hint_template: Read the checksum manifest and look for the recovery asset entry.
hint_levels:
  low:
  - Read the checksum manifest and look for the recovery asset entry.
  medium:
  - 'File/artifact: {{OUTPUT.File(path):basename}}'
  high:
  - Inspect the generated artifact contents for the complete workflow.
