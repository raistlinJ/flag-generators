manifest_version: 1
id: '119'
kind: flag-generator
name: 'Hash: PBKDF2 Recovery Phrase'
description: Generate a PBKDF2-HMAC digest for a recovery phrase used in a flagged
  handoff.
runtime:
  type: docker-compose
  compose_file: docker-compose.yml
  service: generator
env:
  ARTIFACT_VARIANT_ID: hash_pbkdf2_recovery_phrase
inputs:
- name: seed
  type: string
  required: false
- name: flag_prefix
  type: string
  required: false
- name: File(path)
  type: string
  required: false
- name: Flag(flag_id)
  type: string
  required: false
  sensitive: true
artifacts:
  requires: []
  produces:
  - Flag(flag_id)
  - FlagDelivery(mode)
  - File(path)
  - Checksum(sha256)
  - Hash(value)
  - Salt(value)
injects:
- File(path)
inject_candidate_paths:
- /etc/recovery
- /opt/crypto/recovery
- /srv/security/pbkdf2
- /var/lib/recovery
hint_template: The salt and iteration count are written beside the PBKDF2 digest.
hint_levels:
  low:
  - The salt and iteration count are written beside the PBKDF2 digest.
  medium:
  - 'File/artifact: {{OUTPUT.File(path):basename}}'
  high:
  - Inspect the generated artifact contents for the complete workflow.
