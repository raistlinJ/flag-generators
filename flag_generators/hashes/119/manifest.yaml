manifest_version: 1
id: '119'
kind: flag-generator
name: 'Hash: PBKDF2 Recovery Phrase'
description: Generate a PBKDF2-HMAC digest for a recovery phrase used in a flagged
  handoff.
runtime:
  type: docker-compose
  compose_file: docker-compose.yml
  service: generator
env:
  ARTIFACT_VARIANT_ID: hash_pbkdf2_recovery_phrase
inputs:
- name: seed
  type: string
  required: false
- name: flag_prefix
  type: string
  required: false
- name: File(path)
  type: string
  required: false
- name: Flag(flag_id)
  type: string
  required: false
  sensitive: true
artifacts:
  requires: []
  produces:
  - Flag(flag_id)
  - FlagDelivery(mode)
  - File(path)
  - Checksum(sha256)
  - Hash(value)
  - Salt(value)
injects:
- File(path)
inject_candidate_paths:
- /etc/recovery
- /opt/crypto/recovery
- /srv/security/pbkdf2
- /var/lib/recovery
hint_template: Separate the digest from the account or recovery information stored beside it.
hint_levels:
  low:
  - Separate the digest from the account or recovery information stored beside it.
  medium:
  - 'Artifact on {{THIS_NODE_NAME}}: {{OUTPUT.File(path):basename}}.'
  - Identify the digest input and any salt before testing a candidate. A hash is not a reversible text encoding.
  high:
  - 'Answer: {{OUTPUT.Flag(flag_id)}}'
  - The digest uses PBKDF2-HMAC-SHA256, 12,000 iterations, the printed salt, and the phrase recover- followed by the flag.
  - |-
    On the target, or after copying the artifact locally, set artifact to its actual path; this example assumes the current directory.
    ```bash
    artifact="./{{OUTPUT.File(path):basename}}"
    cat "$artifact"
    ```
