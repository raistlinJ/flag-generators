manifest_version: 1
id: '120'
kind: flag-generator
name: 'Hash: Salted PIN Digest'
description: Generate a salted PIN digest note with a deterministic operator identity
  and flag marker.
runtime:
  type: docker-compose
  compose_file: docker-compose.yml
  service: generator
env:
  ARTIFACT_VARIANT_ID: hash_salted_pin_digest
inputs:
- name: seed
  type: string
  required: false
- name: flag_prefix
  type: string
  required: false
- name: File(path)
  type: string
  required: false
- name: Flag(flag_id)
  type: string
  required: false
  sensitive: true
artifacts:
  requires: []
  produces:
  - Flag(flag_id)
  - FlagDelivery(mode)
  - File(path)
  - Checksum(sha256)
  - Credential(user,password)
  - Hash(value)
  - Salt(value)
injects:
- File(path)
inject_candidate_paths:
- /etc/pam.d/fragments
- /opt/badges/pins
- /srv/access/pin_digests
- /var/lib/doorctrl
hint_template: The PIN digest file includes its salt and operator context.
hint_levels:
  low:
  - The PIN digest file includes its salt and operator context.
  medium:
  - 'File/artifact: {{OUTPUT.File(path):basename}}'
  high:
  - Inspect the generated artifact contents for the complete workflow.
