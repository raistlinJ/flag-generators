manifest_version: 1
id: '120'
kind: flag-generator
name: 'Hash: Salted PIN Digest'
description: Generate a salted PIN digest note with a deterministic operator identity
  and flag marker.
runtime:
  type: docker-compose
  compose_file: docker-compose.yml
  service: generator
env:
  ARTIFACT_VARIANT_ID: hash_salted_pin_digest
inputs:
- name: seed
  type: string
  required: false
- name: flag_prefix
  type: string
  required: false
- name: File(path)
  type: string
  required: false
- name: Flag(flag_id)
  type: string
  required: false
  sensitive: true
artifacts:
  requires: []
  produces:
  - Flag(flag_id)
  - FlagDelivery(mode)
  - File(path)
  - Checksum(sha256)
  - Credential(user,password)
  - Hash(value)
  - Salt(value)
injects:
- File(path)
inject_candidate_paths:
- /etc/pam.d/fragments
- /opt/badges/pins
- /srv/access/pin_digests
- /var/lib/doorctrl
hint_template: Separate the digest from the account or recovery information stored beside it.
hint_levels:
  low:
  - Separate the digest from the account or recovery information stored beside it.
  medium:
  - 'Artifact on {{THIS_NODE_NAME}}: {{OUTPUT.File(path):basename}}.'
  - Identify the digest input and any salt before testing a candidate. A hash is not a reversible text encoding.
  high:
  - 'Answer: {{OUTPUT.Flag(flag_id)}}'
  - The digest is SHA256(salt + PIN + flag). Brute-forcing a PIN alone will not recover the flag.
  - |-
    On the target, or after copying the artifact locally, set artifact to its actual path; this example assumes the current directory.
    ```bash
    artifact="./{{OUTPUT.File(path):basename}}"
    cat "$artifact"
    ```
  - 'Credential(user,password): {{OUTPUT.Credential(user,password)}}'
