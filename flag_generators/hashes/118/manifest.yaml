manifest_version: 1
id: '118'
kind: flag-generator
name: 'Hash: SHA3 Audit Token'
description: Generate a SHA3 digest file for an audit token with the flag referenced
  in the note.
runtime:
  type: docker-compose
  compose_file: docker-compose.yml
  service: generator
env:
  ARTIFACT_VARIANT_ID: hash_sha3_audit_token
inputs:
- name: seed
  type: string
  required: false
- name: flag_prefix
  type: string
  required: false
- name: File(path)
  type: string
  required: false
- name: Flag(flag_id)
  type: string
  required: false
  sensitive: true
artifacts:
  requires: []
  produces:
  - Flag(flag_id)
  - FlagDelivery(mode)
  - File(path)
  - Checksum(sha256)
  - Token(service)
  - Hash(value)
injects:
- File(path)
inject_candidate_paths:
- /srv/audit/hashes
- /opt/review/digests
- /var/tmp/audit_hashes
- /home/auditor/digests
hint_template: Separate the digest from the account or recovery information stored beside it.
hint_levels:
  low:
  - Separate the digest from the account or recovery information stored beside it.
  medium:
  - 'Artifact on {{THIS_NODE_NAME}}: {{OUTPUT.File(path):basename}}.'
  - Identify the digest input and any salt before testing a candidate. A hash is not a reversible text encoding.
  high:
  - 'Answer: {{OUTPUT.Flag(flag_id)}}'
  - The SHA3-256 input is audit_token, a colon, and the flag. The short flag_hint is not a reversible encoding.
  - |-
    On the target, or after copying the artifact locally, set artifact to its actual path; this example assumes the current directory.
    ```bash
    artifact="./{{OUTPUT.File(path):basename}}"
    cat "$artifact"
    ```
  - 'Token(service): {{OUTPUT.Token(service)}}'
