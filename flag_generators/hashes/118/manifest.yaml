manifest_version: 1
id: '118'
kind: flag-generator
name: 'Hash: SHA3 Audit Token'
description: Generate a SHA3 digest file for an audit token with the flag referenced
  in the note.
runtime:
  type: docker-compose
  compose_file: docker-compose.yml
  service: generator
env:
  ARTIFACT_VARIANT_ID: hash_sha3_audit_token
inputs:
- name: seed
  type: string
  required: false
- name: flag_prefix
  type: string
  required: false
- name: File(path)
  type: string
  required: false
- name: Flag(flag_id)
  type: string
  required: false
  sensitive: true
artifacts:
  requires: []
  produces:
  - Flag(flag_id)
  - FlagDelivery(mode)
  - File(path)
  - Checksum(sha256)
  - Token(service)
  - Hash(value)
injects:
- File(path)
inject_candidate_paths:
- /srv/audit/hashes
- /opt/review/digests
- /var/tmp/audit_hashes
- /home/auditor/digests
hint_template: Compare the audit token note with the SHA3 digest.
hint_levels:
  low:
  - Compare the audit token note with the SHA3 digest.
  medium:
  - 'File/artifact: {{OUTPUT.File(path):basename}}'
  high:
  - Inspect the generated artifact contents for the complete workflow.
