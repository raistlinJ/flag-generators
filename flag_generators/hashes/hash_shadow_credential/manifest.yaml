manifest_version: 1
id: hash_shadow_credential
kind: flag-generator
name: 'Hash: Shadow Credential'
description: Generate a shadow-style credential fragment where the flag is the crack
  target.
runtime:
  type: docker-compose
  compose_file: docker-compose.yml
  service: generator
env:
  ARTIFACT_VARIANT_ID: hash_shadow_credential
inputs:
- name: seed
  type: string
  required: false
- name: flag_prefix
  type: string
  required: false
- name: File(path)
  type: string
  required: false
- name: Flag(flag_id)
  type: string
  required: false
  sensitive: true
artifacts:
  requires: []
  produces:
  - Flag(flag_id)
  - FlagDelivery(mode)
  - File(path)
  - Checksum(sha256)
  - Credential(user)
  - Credential(user, hash)
  - Hash(value)
injects:
- File(path)
inject_candidate_paths:
- /etc/security
- /opt/auth
- /var/lib/auth
hint_template: Separate the digest from the account or recovery information stored beside it.
hint_levels:
  low:
  - Separate the digest from the account or recovery information stored beside it.
  medium:
  - 'Artifact on {{THIS_NODE_NAME}}: {{OUTPUT.File(path):basename}}.'
  - Identify the digest input and any salt before testing a candidate. A hash is not a reversible text encoding.
  high:
  - 'Answer: {{OUTPUT.Flag(flag_id)}}'
  - This shadow-like record uses a custom SHA512(salt + value) hex digest, not standard SHA512-crypt despite its $6$ prefix.
    The value is the flag.
  - |-
    On the target, or after copying the artifact locally, set artifact to its actual path; this example assumes the current directory.
    ```bash
    artifact="./{{OUTPUT.File(path):basename}}"
    cat "$artifact"
    ```
