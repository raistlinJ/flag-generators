manifest_version: 1
id: '117'
kind: flag-generator
name: 'Hash: MD5 Legacy Token'
description: Generate a legacy MD5 digest challenge tied to a deterministic service
  token and flag.
runtime:
  type: docker-compose
  compose_file: docker-compose.yml
  service: generator
env:
  ARTIFACT_VARIANT_ID: hash_md5_legacy_token
inputs:
- name: seed
  type: string
  required: false
- name: flag_prefix
  type: string
  required: false
- name: File(path)
  type: string
  required: false
- name: Flag(flag_id)
  type: string
  required: false
  sensitive: true
artifacts:
  requires: []
  produces:
  - Flag(flag_id)
  - FlagDelivery(mode)
  - File(path)
  - Checksum(sha256)
  - Token(service)
  - Hash(value)
injects:
- File(path)
inject_candidate_paths:
- /etc/security/legacy
- /opt/auth/legacy
- /var/lib/auth/digests
- /srv/identity/hashes
hint_template: Separate the digest from the account or recovery information stored beside it.
hint_levels:
  low:
  - Separate the digest from the account or recovery information stored beside it.
  medium:
  - 'Artifact on {{THIS_NODE_NAME}}: {{OUTPUT.File(path):basename}}.'
  - Identify the digest input and any salt before testing a candidate. A hash is not a reversible text encoding.
  high:
  - 'Answer: {{OUTPUT.Flag(flag_id)}}'
  - The MD5 input is the token_id followed immediately by the flag; the token alone is not the answer.
  - |-
    On the target, or after copying the artifact locally, set artifact to its actual path; this example assumes the current directory.
    ```bash
    artifact="./{{OUTPUT.File(path):basename}}"
    cat "$artifact"
    ```
  - 'Token(service): {{OUTPUT.Token(service)}}'
