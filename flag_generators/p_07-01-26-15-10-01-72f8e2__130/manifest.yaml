manifest_version: 1
id: '130'
kind: flag-generator
name: 'Binary: Heap Snapshot Token'
description: Generate a heap snapshot style binary with token-like strings and one
  embedded flag.
runtime:
  type: docker-compose
  compose_file: docker-compose.yml
  service: generator
env:
  ARTIFACT_VARIANT_ID: binary_heap_snapshot_token
inputs:
- name: seed
  type: string
  required: false
- name: flag_prefix
  type: string
  required: false
- name: File(path)
  type: string
  required: false
  description: Optional output artifact filename.
- name: Flag(flag_id)
  type: string
  required: false
  sensitive: true
artifacts:
  requires: []
  optional_requires: []
  produces:
  - Flag(flag_id)
  - FlagDelivery(mode)
  - File(path)
  - Binary(format)
  - Checksum(sha256)
injects:
- File(path)
inject_candidate_paths:
- /var/tmp/snapshots
- /opt/app/debug
- /srv/support/dumps
- /tmp/heap
hint_levels:
  low:
  - Search memory-like strings in the snapshot on {{NEXT_NODE_NAME}}.
  medium:
  - 'File/artifact: {{OUTPUT.File(path):basename}}'
  high:
  - Inspect the generated artifact contents for the complete workflow.
