manifest_version: 1
id: '86'
kind: flag-generator
name: 'Archive: TAR Log Bundle'
description: Generate a TAR log bundle containing operational logs and a hidden recovery
  marker.
runtime:
  type: docker-compose
  compose_file: docker-compose.yml
  service: generator
env:
  ARTIFACT_VARIANT_ID: archive_tar_log_bundle
inputs:
- name: seed
  type: string
  required: false
- name: flag_prefix
  type: string
  required: false
- name: File(path)
  type: string
  required: false
- name: Flag(flag_id)
  type: string
  required: false
  sensitive: true
artifacts:
  requires: []
  produces:
  - Flag(flag_id)
  - FlagDelivery(mode)
  - File(path)
  - Checksum(sha256)
  - Archive(format)
  - Token(service)
injects:
- File(path)
inject_candidate_paths:
- /srv/backups
- /var/backups
- /opt/archive
hint_template: Unpack /flow_injects/{{OUTPUT.File(path):basename}} on {{NEXT_NODE_NAME}}
  @ {{NEXT_NODE_IP}}.
hint_levels:
  low:
  - Unpack /flow_injects/{{OUTPUT.File(path):basename}} on {{NEXT_NODE_NAME}} @ {{NEXT_NODE_IP}}.
  medium:
  - 'File/artifact: {{OUTPUT.File(path):basename}}'
  high:
  - Inspect the generated artifact contents for the complete workflow.
