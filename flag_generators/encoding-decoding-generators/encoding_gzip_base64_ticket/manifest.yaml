manifest_version: 1
id: encoding_gzip_base64_ticket
kind: flag-generator
name: 'Encoding: Gzip Base64 Ticket'
description: Generate a gzip-compressed ticket note wrapped in Base64 for layered
  decoding practice.
runtime:
  type: docker-compose
  compose_file: docker-compose.yml
  service: generator
env:
  ARTIFACT_VARIANT_ID: encoding_gzip_base64_ticket
inputs:
- name: seed
  type: string
  required: true
- name: flag_prefix
  type: string
  required: false
- name: File(path)
  type: string
  required: false
  description: Optional output artifact filename.
- name: Flag(flag_id)
  type: string
  required: false
  sensitive: true
artifacts:
  requires:
  - Knowledge(ip)
  optional_requires: []
  produces:
  - Flag(flag_id)
  - FlagDelivery(mode)
  - File(path)
  - Encoding(name)
  - Encoded(value)
  - Checksum(sha256)
injects:
- File(path)
inject_candidate_paths:
- /srv/tickets
- /opt/support/attachments
- /var/log/helpdesk
- /tmp/ticket_drop
hint_levels:
  low:
  - The message is encoded rather than encrypted.
  medium:
  - 'Artifact on {{THIS_NODE_NAME}}: {{OUTPUT.File(path):basename}}.'
  - The encoding is Base64 around gzip; decode it to inspect the message fields.
  high:
  - 'Answer: {{OUTPUT.Flag(flag_id)}}'
  - |-
    On the target, or after copying the artifact locally, set artifact to its actual path; this example assumes the current directory.
    ```bash
    artifact="./{{OUTPUT.File(path):basename}}"
    python3 - "$artifact" <<'PY'
    import sys
    from pathlib import Path
    p = Path(sys.argv[1])
    import base64, gzip
    print(gzip.decompress(base64.b64decode(p.read_bytes())).decode())
    PY
    ```
