manifest_version: 1
id: encoding_jwt_style_claims
kind: flag-generator
name: 'Encoding: JWT Style Claims'
description: Generate an unsigned JWT-style token where the flag appears in encoded
  claims.
runtime:
  type: docker-compose
  compose_file: docker-compose.yml
  service: generator
env:
  ARTIFACT_VARIANT_ID: encoding_jwt_style_claims
inputs:
- name: seed
  type: string
  required: true
- name: flag_prefix
  type: string
  required: false
- name: File(path)
  type: string
  required: false
  description: Optional output artifact filename.
- name: Flag(flag_id)
  type: string
  required: false
  sensitive: true
artifacts:
  requires:
  - Knowledge(ip)
  optional_requires: []
  produces:
  - Flag(flag_id)
  - FlagDelivery(mode)
  - File(path)
  - Encoding(name)
  - Encoded(value)
  - Checksum(sha256)
injects:
- File(path)
inject_candidate_paths:
- /srv/auth/tokens
- /opt/web/sessions
- /var/lib/app/cache
- /tmp/session_drop
hint_levels:
  low:
  - The message is encoded rather than encrypted.
  medium:
  - 'Artifact on {{THIS_NODE_NAME}}: {{OUTPUT.File(path):basename}}.'
  - The encoding is unsigned JWT with Base64URL claims; decode it to inspect the message fields.
  high:
  - 'Answer: {{OUTPUT.Flag(flag_id)}}'
  - |-
    On the target, or after copying the artifact locally, set artifact to its actual path; this example assumes the current directory.
    ```bash
    artifact="./{{OUTPUT.File(path):basename}}"
    python3 - "$artifact" <<'PY'
    import sys
    from pathlib import Path
    p = Path(sys.argv[1])
    import base64, json
    claims = p.read_text().split(".")[1]
    print(json.dumps(json.loads(base64.urlsafe_b64decode(claims + "=" * (-len(claims) % 4))), indent=2))
    PY
    ```
