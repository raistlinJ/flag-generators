manifest_version: 1
id: encoding_base32_field_note
kind: flag-generator
name: 'Encoding: Base32 Field Note'
description: Generate a Base32 encoded field note that carries the flag in a deterministic
  dispatch message.
runtime:
  type: docker-compose
  compose_file: docker-compose.yml
  service: generator
env:
  ARTIFACT_VARIANT_ID: encoding_base32_field_note
inputs:
- name: seed
  type: string
  required: true
- name: flag_prefix
  type: string
  required: false
- name: File(path)
  type: string
  required: false
  description: Optional output artifact filename.
- name: Flag(flag_id)
  type: string
  required: false
  sensitive: true
artifacts:
  requires:
  - Knowledge(ip)
  optional_requires: []
  produces:
  - Flag(flag_id)
  - FlagDelivery(mode)
  - File(path)
  - Encoding(name)
  - Encoded(value)
  - Checksum(sha256)
injects:
- File(path)
inject_candidate_paths:
- /var/www/html/assets
- /srv/media/uploads
- /opt/gallery/images
- /var/tmp/image_drop
hint_levels:
  low:
  - The message is encoded rather than encrypted.
  medium:
  - 'Artifact on {{THIS_NODE_NAME}}: {{OUTPUT.File(path):basename}}.'
  - The encoding is Base32; decode it to inspect the message fields.
  high:
  - 'Answer: {{OUTPUT.Flag(flag_id)}}'
  - |-
    On the target, or after copying the artifact locally, set artifact to its actual path; this example assumes the current directory.
    ```bash
    artifact="./{{OUTPUT.File(path):basename}}"
    python3 - "$artifact" <<'PY'
    import sys
    from pathlib import Path
    p = Path(sys.argv[1])
    import base64
    print(base64.b32decode(p.read_text().strip()).decode())
    PY
    ```
