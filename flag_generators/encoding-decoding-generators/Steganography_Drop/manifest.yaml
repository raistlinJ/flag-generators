manifest_version: 1
id: Steganography_Drop
kind: flag-generator
name: Steganography Drop
description: Embeds a username/password into an image using steganography and generates
  a flag.
version: 1.0
runtime:
  type: docker-compose
  compose_file: docker-compose.yml
  service: generator
inputs:
- name: seed
  type: string
  required: true
- name: flag_prefix
  type: string
  required: false
- name: image_path
  type: string
  required: false
artifacts:
  requires:
  - Knowledge(ip)
  optional_requires:
  - Knowledge(hostname)
  produces:
  - Flag(flag_id)
  - Credential(user,password)
  - File(path)
hint_templates:
- An ordinary-looking image may carry hidden account information.
injects:
- File(path)
inject_candidate_paths:
- /var/www/html/assets
- /srv/media/uploads
- /opt/gallery/images
- /var/tmp/image_drop
env:
  PYTHONUNBUFFERED: '1'
hint_levels:
  low:
  - An ordinary-looking image may carry hidden account information.
  medium:
  - 'Artifact on {{THIS_NODE_NAME}}: {{OUTPUT.File(path):basename}}.'
  - Read RGB least-significant bits in pixel order. The first 32 bits give the payload byte count in big-endian order.
  high:
  - 'Answer: {{OUTPUT.Flag(flag_id)}}'
  - Requires Pillow. The hidden payload is user|password; the flag is supplied separately below. If the artifact is plain
    text, read it directly.
  - |-
    On the target, or after copying the artifact locally, set artifact to its actual path; this example assumes the current directory.
    ```bash
    artifact="./{{OUTPUT.File(path):basename}}"
    python3 - "$artifact" <<'PY'
    import sys
    from pathlib import Path
    p = Path(sys.argv[1])
    from PIL import Image
    image = Image.open(p).convert("RGB")
    bits = "".join(str(channel & 1) for pixel in image.getdata() for channel in pixel)
    size = int(bits[:32], 2)
    print(bytes(int(bits[i:i+8], 2) for i in range(32, 32 + 8 * size, 8)).decode())
    PY
    ```
  - 'Credential(user,password): {{OUTPUT.Credential(user,password)}}'
