manifest_version: 1
id: '16'
kind: flag-generator
name: 'HTTPS: Backup Index Token'
description: Generate a backup index page containing a recovery token and flag-bearing
  manifest entry.
runtime:
  type: docker-compose
  compose_file: docker-compose.yml
  service: generator
env:
  ARTIFACT_VARIANT_ID: https_backup_index_token
inputs:
- name: seed
  type: string
  required: true
- name: flag_prefix
  type: string
  required: false
- name: File(path)
  type: string
  required: false
  description: Optional output artifact filename.
- name: Flag(flag_id)
  type: string
  required: false
  sensitive: true
- name: username
  type: string
  required: false
  flow_supply_when_first: true
- name: password
  type: string
  required: false
  sensitive: true
  flow_supply_when_first: true
artifacts:
  requires:
  - Knowledge(ip)
  optional_requires:
  - Knowledge(hostname)
  produces:
  - Flag(flag_id)
  - FlagDelivery(mode)
  - File(path)
  - Token(service)
  - Endpoint(path)
  - Checksum(sha256)
  - FlagFile(path)
injects:
- File(path)
inject_candidate_paths:
- /srv/https/backups
- /var/www/html/backups
- /opt/web/backups
- /srv/http/public/backups
hint_levels:
  low:
  - Check the backup index for hidden manifest details.
  medium:
  - 'Credential or token artifact: {{OUTPUT.File(path):basename}}'
  high:
  - Inspect the generated artifact contents for the complete workflow.
