manifest_version: 1
id: binary_embed_text
kind: flag-generator
name: 'Sample: Binary Embed Text'
description: Produce an x64 binary that contains an embedded flag string.
hint_template: Human-readable data may survive inside a binary artifact.
runtime:
  type: docker-compose
  compose_file: docker-compose.yml
  service: generator
inputs:
- name: seed
  type: text
  required: false
- name: File(path)
  type: string
  required: false
  description: Optional output binary filename.
- name: Flag(flag_id)
  type: text
  required: false
  sensitive: true
- name: flag_prefix
  type: text
  required: false
outputs:
- name: Flag(flag_id)
  type: text
- name: File(path)
  type: string
artifacts:
  requires: []
  produces:
  - Flag(flag_id)
  - File(path)
injects:
- File(path)
inject_candidate_paths:
- /usr/local/bin
- /opt/tools
- /opt/service/bin
- /var/tmp
hint_levels:
  low:
  - Human-readable data may survive inside a binary artifact.
  medium:
  - 'Artifact on {{THIS_NODE_NAME}}: {{OUTPUT.File(path):basename}}.'
  - Inspect the file signature and printable strings before attempting to execute anything.
  high:
  - 'Answer: {{OUTPUT.Flag(flag_id)}}'
  - |-
    On the target, or after copying the artifact locally, set artifact to its actual path; this example assumes the current directory.
    ```bash
    artifact="./{{OUTPUT.File(path):basename}}"
    strings -a "$artifact"
    ```
