manifest_version: 1
id: binary_bootloader_recovery
kind: flag-generator
name: 'Binary: Bootloader Recovery Image'
description: Generate a bootloader-style image that stores a recovery flag in device
  metadata.
runtime:
  type: docker-compose
  compose_file: docker-compose.yml
  service: generator
env:
  ARTIFACT_VARIANT_ID: binary_bootloader_recovery
inputs:
- name: seed
  type: string
  required: false
- name: flag_prefix
  type: string
  required: false
- name: File(path)
  type: string
  required: false
  description: Optional output artifact filename.
- name: Flag(flag_id)
  type: string
  required: false
  sensitive: true
artifacts:
  requires: []
  optional_requires: []
  produces:
  - Flag(flag_id)
  - FlagDelivery(mode)
  - File(path)
  - Binary(format)
  - Checksum(sha256)
injects:
- File(path)
inject_candidate_paths:
- /boot/recovery
- /opt/firmware
- /var/lib/device
- /srv/images
hint_levels:
  low:
  - The recovery image name is a useful starting point on {{NEXT_NODE_NAME}}.
  medium:
  - 'File/artifact: {{OUTPUT.File(path):basename}}'
  high:
  - Inspect the generated artifact contents for the complete workflow.
