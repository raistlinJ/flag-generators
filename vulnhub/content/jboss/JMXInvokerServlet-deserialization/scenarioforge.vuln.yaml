schema_version: 1
match: jboss/JMXInvokerServlet-deserialization
hint_levels:
  low:
  - Inspect the jboss service or application on {{NODE_NAME}} @ {{NODE_IP}}.
  medium:
  - |-
    Catalog TCP ports: 8080,9990. Identify the exposed services:

    ```bash
    nmap -Pn -sT -sV -p 8080,9990 {{NODE_IP}}
    ```
  - 'Catalog port mappings (published → container): jboss: 9990/tcp → container 9990/tcp; jboss: 8080/tcp → container
    8080/tcp. These are recipe defaults; use the deployed service port if the scenario remaps it.'
  - 'Documented target URL(s): `http://{{NODE_IP}}:8080/`.'
  high:
  - 'Vulnerability: JBoss JMXInvokerServlet Deserialization Remote Code Execution.'
  - |-
    Vulnerability Reproduce

    When JBoss processes the `/invoker/JMXInvokerServlet` request, it reads the object directly. Therefore, we can simply attach a POC generated by ysoserial: https://github.com/frohoff/ysoserial in the POST Body. The entire process is similar to jboss/CVE-2017-12149: https://github.com/vulhub/vulhub/tree/master/jboss/CVE-2017-12149, so I won't repeat it here.

    There are many existing exploits available online. For example, you can use DeserializeExploit.jar: https://download.vulhub.org/download/deserialization/DeserializeExploit.jar to directly execute commands and upload files:

    Documentation illustration: https://github.com/vulhub/vulhub/blob/3af973a39bd0988f288a53fa9ea4b82372774e58/jboss/JMXInvokerServlet-deserialization/1.png
  - 'Publicly available documentation: https://github.com/vulhub/vulhub/blob/3af973a39bd0988f288a53fa9ea4b82372774e58/jboss/JMXInvokerServlet-deserialization/README.md'
  - |-
    Additional public references:
    - https://foxglovesecurity.com/2015/11/06/what-do-weblogic-websphere-jboss-jenkins-opennms-and-your-application-have-in-common-this-vulnerability/
    - https://www.seebug.org/vuldb/ssvid-89723
    - http://www.freebuf.com/sectool/88908.html
    - https://paper.seebug.org/312/
access_instructions:
  title: JBoss JMXInvokerServlet Deserialization Remote Code Execution
  steps:
  - title: Locate the target service
    instructions: |-
      Catalog TCP ports: 8080,9990. Identify the exposed services:

      ```bash
      nmap -Pn -sT -sV -p 8080,9990 {{NODE_IP}}
      ```

      Catalog port mappings (published → container): jboss: 9990/tcp → container 9990/tcp; jboss: 8080/tcp → container 8080/tcp. These are recipe defaults; use the deployed service port if the scenario remaps it.

      Documented target URL(s): `http://{{NODE_IP}}:8080/`.
  - title: Vulnerability Reproduce
    instructions: |-
      When JBoss processes the `/invoker/JMXInvokerServlet` request, it reads the object directly. Therefore, we can simply attach a POC generated by ysoserial: https://github.com/frohoff/ysoserial in the POST Body. The entire process is similar to jboss/CVE-2017-12149: https://github.com/vulhub/vulhub/tree/master/jboss/CVE-2017-12149, so I won't repeat it here.

      There are many existing exploits available online. For example, you can use DeserializeExploit.jar: https://download.vulhub.org/download/deserialization/DeserializeExploit.jar to directly execute commands and upload files:

      Documentation illustration: https://github.com/vulhub/vulhub/blob/3af973a39bd0988f288a53fa9ea4b82372774e58/jboss/JMXInvokerServlet-deserialization/1.png
