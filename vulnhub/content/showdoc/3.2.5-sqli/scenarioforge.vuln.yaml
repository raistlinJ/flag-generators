schema_version: 1
match: showdoc/3.2.5-sqli
hint_levels:
  low:
  - Inspect the showdoc service or application on {{NODE_NAME}} @ {{NODE_IP}}.
  medium:
  - |-
    Catalog TCP ports: 8080. Identify the exposed services:

    ```bash
    nmap -Pn -sT -sV -p 8080 {{NODE_IP}}
    ```
  - 'Catalog port mappings (published → container): web: 8080/tcp → container 80/tcp. These are recipe defaults;
    use the deployed service port if the scenario remaps it.'
  - 'Documented target URL(s): `http://{{NODE_IP}}:8080`.'
  high:
  - 'Vulnerability: ShowDoc 3.2.5 SQL Injection.'
  - |-
    Exploit

    Once a user has logged into ShowDoc, a user token is generated in the SQLite database. Compared to stealing a user's hashed password through SQL injection，user token is a more useful target.

    Before exploiting the issue, a CAPTCHA recognition library is required:

    ```
    pip install onnxruntime ddddocr requests
    ```

    Then use this POC: https://github.com/vulhub/vulhub/blob/3af973a39bd0988f288a53fa9ea4b82372774e58/showdoc/3.2.5-sqli/poc.py to extract the token:

    ```
    python3 poc.py -u http://{{NODE_IP}}:8080
    ```

    Documentation illustration: https://github.com/vulhub/vulhub/blob/3af973a39bd0988f288a53fa9ea4b82372774e58/showdoc/3.2.5-sqli/1.png

    To test if the token is valid:

    Documentation illustration: https://github.com/vulhub/vulhub/blob/3af973a39bd0988f288a53fa9ea4b82372774e58/showdoc/3.2.5-sqli/2.png
  - 'Publicly available documentation: https://github.com/vulhub/vulhub/blob/3af973a39bd0988f288a53fa9ea4b82372774e58/showdoc/3.2.5-sqli/README.md'
  - |-
    Additional public references:
