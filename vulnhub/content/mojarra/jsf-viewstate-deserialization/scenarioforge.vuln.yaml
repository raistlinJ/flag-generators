match: mojarra/jsf-viewstate-deserialization
hint_levels:
  low:
  - Inspect the mojarra service or application on {{NODE_NAME}} @ {{NODE_IP}}.
  medium:
  - |-
    Catalog TCP ports: 8080. Identify the exposed services:

    ```bash
    nmap -Pn -sT -sV -p 8080 {{NODE_IP}}
    ```
  - 'Catalog port mappings (published → container): web: 8080/tcp → container 8080/tcp. These are recipe defaults;
    use the deployed service port if the scenario remaps it.'
  - 'Documented target URL(s): `http://{{NODE_IP}}:8080`.'
  high:
  - 'Vulnerability: Mojarra JSF ViewState Deserialization Vulnerability.'
  - |-
    Exploit

    Here is the structure of ViewState that encoding without a security layer:

    Documentation illustration: https://github.com/vulhub/vulhub/blob/3af973a39bd0988f288a53fa9ea4b82372774e58/mojarra/jsf-viewstate-deserialization/1.png

    According to this structure, we can use ysoserial's Jdk7u21 Gadget: https://github.com/frohoff/ysoserial to generate a payload:

    ```
    $ java -jar ysoserial-master-SNAPSHOT.jar Jdk7u21 "touch /tmp/success" | gzip | base64 -w 0
    
    ```

    Then, intercept and modify the http request from demo page, put the url-encoded payload into value of `javax.faces.ViewState` field:

    Documentation illustration: https://github.com/vulhub/vulhub/blob/3af973a39bd0988f288a53fa9ea4b82372774e58/mojarra/jsf-viewstate-deserialization/2.png

    `touch /tmp/success` has been successfully executed:

    Documentation illustration: https://github.com/vulhub/vulhub/blob/3af973a39bd0988f288a53fa9ea4b82372774e58/mojarra/jsf-viewstate-deserialization/3.png
  - 'Publicly available documentation: https://github.com/vulhub/vulhub/blob/3af973a39bd0988f288a53fa9ea4b82372774e58/mojarra/jsf-viewstate-deserialization/README.md'
  - |-
    Additional public references:
    - https://www.alphabot.com/security/blog/2017/java/Misconfigured-JSF-ViewStates-can-lead-to-severe-RCE-vulnerabilities.html
    - https://www.exploit-db.com/docs/48126
    - https://www.synacktiv.com/ressources/JSF_ViewState_InYourFace.pdf
