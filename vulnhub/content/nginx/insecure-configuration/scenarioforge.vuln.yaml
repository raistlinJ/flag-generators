      \  \n\nUsing techniques from the article \"Bottle HTTP Header Injection Vulnerability Analysis: https://www.leavesongs.com/PENETRATION/bottle-crlf-cve-2016-9964.html\"\
      , you can construct an XSS vulnerability:\n\nDocumentation illustration: https://github.com/vulhub/vulhub/blob/3af973a39bd0988f288a53fa9ea4b82372774e58/nginx/insecure-configuration/1.png"
  - title: Mistake 2. Directory Traversal Vulnerability
    instructions: |-
      When configuring aliases in Nginx, forgetting to add a `/` will create a directory traversal vulnerability.

      Example of incorrect configuration (originally intended to allow users to access files in the /home/ directory):

      ```
