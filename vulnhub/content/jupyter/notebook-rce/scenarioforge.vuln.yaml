# Optional ScenarioForge guide hints; derived from the adjacent public Vulhub documentation.
schema_version: 1
match: jupyter/notebook-rce
hint_levels:
  low:
  - Inspect the jupyter service or application on {{NODE_NAME}} @ {{NODE_IP}}.
  medium:
  - |-
    Catalog TCP ports: 8888. Identify the exposed services:

    ```bash
    nmap -Pn -sT -sV -p 8888 {{NODE_IP}}
    ```
  - 'Catalog port mappings (published → container): web: 8888/tcp → container 8888/tcp. These are recipe defaults;
    use the deployed service port if the scenario remaps it.'
  - 'Documented target URL(s): `http://{{NODE_IP}}:8888`.'
  high:
  - 'Vulnerability: Jupyter Notebook Unauthorized Access.'
  - |-
    Open an unauthenticated terminal

    Open http://{{NODE_IP}}:8888 and select New → Terminal without supplying a notebook token or password.
    In the resulting target terminal, run:

    ```bash
    id
    pwd
    ```

    The commands run under the notebook service account. Use that terminal to inspect the
    challenge artifact path supplied by the scenario.
  - 'Publicly available documentation: https://github.com/vulhub/vulhub/blob/3af973a39bd0988f288a53fa9ea4b82372774e58/jupyter/notebook-rce/README.md'
access_instructions:
  title: Jupyter Notebook Unauthorized Access
  steps:
  - title: Locate the target service
    instructions: |-
      Catalog TCP ports: 8888. Identify the exposed services:

      ```bash
      nmap -Pn -sT -sV -p 8888 {{NODE_IP}}
      ```

      Catalog port mappings (published → container): web: 8888/tcp → container 8888/tcp. These are recipe defaults; use the deployed service port if the scenario remaps it.

      Documented target URL(s): `http://{{NODE_IP}}:8888`.
  - title: Open an unauthenticated terminal
    instructions: |-
      Open http://{{NODE_IP}}:8888 and select New → Terminal without supplying a notebook token or password.
      In the resulting target terminal, run:

      ```bash
      id
      pwd
      ```

      The commands run under the notebook service account. Use that terminal to inspect the
      challenge artifact path supplied by the scenario.
