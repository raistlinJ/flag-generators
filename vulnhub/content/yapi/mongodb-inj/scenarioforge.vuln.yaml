schema_version: 1
match: yapi/mongodb-inj
hint_levels:
  low:
  - Inspect the yapi service or application on {{NODE_NAME}} @ {{NODE_IP}}.
  medium:
  - |-
    Catalog TCP ports: 3000. Identify the exposed services:

    ```bash
    nmap -Pn -sT -sV -p 3000 {{NODE_IP}}
    ```
  - 'Catalog port mappings (published → container): web: 3000/tcp → container 3000/tcp. These are recipe defaults;
    use the deployed service port if the scenario remaps it.'
  - 'Documented target URL(s): `http://{{NODE_IP}}:3000/`.'
  high:
  - 'Vulnerability: YApi NoSQL injection and remote code execution.'
  - |-
    Exploit

    The target in Vulhub is a ready-to-use server that contains some example data in MongoDB. So just use this POC: https://github.com/vulhub/vulhub/blob/3af973a39bd0988f288a53fa9ea4b82372774e58/yapi/mongodb-inj/poc.py to reproduce the issue:

    ```
    python poc.py --debug one4all -u http://{{NODE_IP}}:3000/
    ```

    Documentation illustration: https://github.com/vulhub/vulhub/blob/3af973a39bd0988f288a53fa9ea4b82372774e58/yapi/mongodb-inj/1.png
  - 'Publicly available documentation: https://github.com/vulhub/vulhub/blob/3af973a39bd0988f288a53fa9ea4b82372774e58/yapi/mongodb-inj/README.md'
  - |-
    Additional public references:
    - https://github.com/YMFE/yapi/commit/59bade3a8a43e7db077d38a4b0c7c584f30ddf8c
access_instructions:
  title: YApi NoSQL injection and remote code execution
  steps:
  - title: Locate the target service
    instructions: |-
      Catalog TCP ports: 3000. Identify the exposed services:

      ```bash
      nmap -Pn -sT -sV -p 3000 {{NODE_IP}}
      ```

      Catalog port mappings (published → container): web: 3000/tcp → container 3000/tcp. These are recipe defaults; use the deployed service port if the scenario remaps it.

      Documented target URL(s): `http://{{NODE_IP}}:3000/`.
  - title: Exploit
    instructions: |-
      The target in Vulhub is a ready-to-use server that contains some example data in MongoDB. So just use this POC: https://github.com/vulhub/vulhub/blob/3af973a39bd0988f288a53fa9ea4b82372774e58/yapi/mongodb-inj/poc.py to reproduce the issue:

      ```
      python poc.py --debug one4all -u http://{{NODE_IP}}:3000/
      ```

      Documentation illustration: https://github.com/vulhub/vulhub/blob/3af973a39bd0988f288a53fa9ea4b82372774e58/yapi/mongodb-inj/1.png
