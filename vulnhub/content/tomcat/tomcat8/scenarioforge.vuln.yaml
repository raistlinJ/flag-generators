    Environment and Test

    Commands that inspect files or logs inside the target require a shell or equivalent file/log access on that target. Run them there after gaining that access.


    Just run：



    Open the tomcat management page `http://{{NODE_IP}}:8080/manager/html`，enter the weak password `tomcat:tomcat`，then access the backend：

    Documentation illustration: https://github.com/vulhub/vulhub/blob/3af973a39bd0988f288a53fa9ea4b82372774e58/tomcat/tomcat8/1.png

    Upload war package and then get shell directly.
