manifest_version: 1
id: mysql_backup_table
kind: flag-node-generator
name: 'Database: MySQL Backup Table'
description: MySQL-style service with a backup table export and generated restore
  archive.
hint_template: Backup material can preserve sensitive information.
runtime:
  type: docker-compose
  compose_file: docker-compose.yml
  service: generator
env:
  SERVICE_VARIANT_ID: mysql_backup_table
inputs:
- name: seed
  type: string
  required: true
- name: node_name
  type: string
  required: true
- name: flag_prefix
  type: string
  required: false
- name: service_port
  type: number
  required: false
  default: 13306
- name: Credential(user, password)
  type: string
  required: false
  sensitive: true
  flow_supply_when_first: true
artifacts:
  requires:
  - Knowledge(ip)
  optional_requires:
  - Credential(user, password)
  produces:
  - Flag(flag_id)
  - FlagDelivery(mode)
  - FlagFile(path)
  - Credential(user, password)
  - File(path)
  - Directory(host, path)
  - PortForward(host, port)
  - Endpoint(path)
  - Version(service)
  - BackupArchive(file)
injects:
- service
inject_candidate_paths:
- /var/lib/mysql/backup
- /srv/db/mysql
- /opt/mysql/nightly
- /home/mysql/restore
access_instructions:
  title: MySQL-Style Backup
  steps:
  - step: 1
    title: Connect to the database-style service
    instructions: '```bash

      nc {{NODE}} {{PORT}}

      ```

      '
  - step: 2
    title: Authenticate and fetch the backup table
    instructions: '```text

      AUTH {{USERNAME}} {{PASSWORD}}

      LIST

      GET {{FLAG_FILE}}

      ```

      '
  - step: 3
    title: Record the backup marker
    instructions: Record the flag and note the backup archive output.
hint_levels:
  low:
  - Backup material can preserve sensitive information.
  medium:
  - 'Service: MySQL-Style Backup. Target: {{THIS_NODE_NAME}}; TCP port: {{OUTPUT.PortForward(host, port)}}.'
  - |-
    Check the assigned port:
    ```bash
    nmap -sT -sV -p {{OUTPUT.PortForward(host, port)}} {{THIS_NODE_NAME}}
    ```
  - This service accepts a line-oriented text protocol. Connect with nc, then enter the commands shown in the high hint in
    that same session.
  high:
  - 'Answer: {{OUTPUT.Flag(flag_id)}}'
  - 'Credential (user:password): {{OUTPUT.Credential(user, password)}}. Replace <username> and <password> in the commands
    with these two components.'
  - |-
    Connect to the database-style service:
    ```bash
    nc {{THIS_NODE_NAME}} {{OUTPUT.PortForward(host, port)}}
    ```
  - |-
    Authenticate and fetch the backup table:
    ```text
    AUTH <username> <password>
    LIST
    GET {{OUTPUT.FlagFile(path)}}
    ```
