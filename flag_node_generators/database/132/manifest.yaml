manifest_version: 1
id: '132'
kind: flag-node-generator
name: 'Database: Postgres Audit Schema'
description: Postgres-style database fixture requiring credentials and exposing an
  audit schema dump.
runtime:
  type: docker-compose
  compose_file: docker-compose.yml
  service: generator
env:
  SERVICE_VARIANT_ID: database_postgres_audit_schema
inputs:
- name: seed
  type: string
  required: true
- name: node_name
  type: string
  required: true
- name: flag_prefix
  type: string
  required: false
- name: service_port
  type: number
  required: false
  default: 15432
- name: Credential(user, password)
  type: string
  required: true
  sensitive: true
  flow_supply_when_first: true
artifacts:
  requires:
  - Knowledge(ip)
  produces:
  - Flag(flag_id)
  - FlagDelivery(mode)
  - FlagFile(path)
  - File(path)
  - Directory(host, path)
  - PortForward(host, port)
  - Endpoint(path)
  - Version(service)
  - Credential(user, password)
  - ExposedSecret(service)
injects:
- service
inject_candidate_paths:
- /var/lib/postgresql/audit
- /srv/db/postgres_audit
- /opt/postgres/exports
- /tmp/pg_audit
access_instructions:
  title: Postgres Audit Schema
  steps:
  - step: 1
    title: Connect to the generated service
    instructions: '```bash

      nc {{NODE}} {{PORT}}

      ```

      '
  - step: 2
    title: Enumerate and retrieve the marker
    instructions: '```text

      INFO

      AUTH {{USERNAME}} {{PASSWORD}}

      LIST

      GET {{FLAG_FILE}}

      ```

      '
  - step: 3
    title: Record the recovered marker
    instructions: Record the flag and any credential or service context before continuing.
hint_template: Authenticate to the database-style service and read the audit schema
  dump.
hint_levels:
  low:
  - Authenticate to the database-style service and read the audit schema dump.
  medium:
  - 'Credential artifact: {{OUTPUT.Credential(user,password)}}'
  high:
  - Connect to the generated service
  - Enumerate and retrieve the marker
  - 'Record the recovered marker: Record the flag and any credential or service context
    before continuing.'
