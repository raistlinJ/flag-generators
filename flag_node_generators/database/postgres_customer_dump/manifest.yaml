manifest_version: 1
id: postgres_customer_dump
kind: flag-node-generator
name: 'Database: Postgres Customer Dump'
description: Postgres-style service exposing a customer export dump through generated
  credentials.
hint_template: Exported records may expose information beyond the database login.
runtime:
  type: docker-compose
  compose_file: docker-compose.yml
  service: generator
env:
  SERVICE_VARIANT_ID: postgres_customer_dump
inputs:
- name: seed
  type: string
  required: true
- name: node_name
  type: string
  required: true
- name: flag_prefix
  type: string
  required: false
- name: service_port
  type: number
  required: false
  default: 15432
- name: Credential(user, password)
  type: string
  required: false
  sensitive: true
  flow_supply_when_first: true
artifacts:
  requires:
  - Knowledge(ip)
  optional_requires:
  - Credential(user, password)
  produces:
  - Flag(flag_id)
  - FlagDelivery(mode)
  - FlagFile(path)
  - Credential(user, password)
  - File(path)
  - Directory(host, path)
  - PortForward(host, port)
  - Endpoint(path)
  - Version(service)
  - ExposedSecret(service)
injects:
- service
inject_candidate_paths:
- /var/lib/postgresql/export
- /srv/db/postgres
- /opt/app/db/dumps
- /home/postgres/exports
access_instructions:
  title: Postgres-Style Export
  steps:
  - step: 1
    title: Connect to the database-style service
    instructions: '```bash

      nc {{NODE}} {{PORT}}

      ```

      '
  - step: 2
    title: Authenticate and fetch the dump
    instructions: '```text

      AUTH {{USERNAME}} {{PASSWORD}}

      LIST

      GET {{FLAG_FILE}}

      ```

      '
  - step: 3
    title: Record the database marker
    instructions: Record the flag from the exported SQL file.
hint_levels:
  low:
  - Exported records may expose information beyond the database login.
  medium:
  - 'Service: Postgres-Style Export. Target: {{THIS_NODE_NAME}}; TCP port: {{OUTPUT.PortForward(host, port)}}.'
  - |-
    Check the assigned port:
    ```bash
    nmap -sT -sV -p {{OUTPUT.PortForward(host, port)}} {{THIS_NODE_NAME}}
    ```
  - This service accepts a line-oriented text protocol. Connect with nc, then enter the commands shown in the high hint in
    that same session.
  high:
  - 'Answer: {{OUTPUT.Flag(flag_id)}}'
  - 'Credential (user:password): {{OUTPUT.Credential(user, password)}}. Replace <username> and <password> in the commands
    with these two components.'
  - |-
    Connect to the database-style service:
    ```bash
    nc {{THIS_NODE_NAME}} {{OUTPUT.PortForward(host, port)}}
    ```
  - |-
    Authenticate and fetch the dump:
    ```text
    AUTH <username> <password>
    LIST
    GET {{OUTPUT.FlagFile(path)}}
    ```
