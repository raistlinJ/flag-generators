manifest_version: 1
id: postgres_customer_dump
kind: flag-node-generator
name: 'Database: Postgres Customer Dump'
description: Postgres-style service exposing a customer export dump through generated
  credentials.
hint_template: Inspect the Postgres-style export before moving to {{NEXT_NODE_NAME}}.
runtime:
  type: docker-compose
  compose_file: docker-compose.yml
  service: generator
env:
  SERVICE_VARIANT_ID: postgres_customer_dump
inputs:
- name: seed
  type: string
  required: true
- name: node_name
  type: string
  required: true
- name: flag_prefix
  type: string
  required: false
- name: service_port
  type: number
  required: false
  default: 15432
- name: Credential(user, password)
  type: string
  required: false
  sensitive: true
  flow_supply_when_first: true
artifacts:
  requires:
  - Knowledge(ip)
  optional_requires:
  - Credential(user, password)
  produces:
  - Flag(flag_id)
  - FlagDelivery(mode)
  - FlagFile(path)
  - Credential(user, password)
  - File(path)
  - Directory(host, path)
  - PortForward(host, port)
  - Endpoint(path)
  - Version(service)
  - ExposedSecret(service)
injects:
- service
inject_candidate_paths:
- /var/lib/postgresql/export
- /srv/db/postgres
- /opt/app/db/dumps
- /home/postgres/exports
access_instructions:
  title: Postgres-Style Export
  steps:
  - step: 1
    title: Connect to the database-style service
    instructions: '```bash

      nc {{NODE}} {{PORT}}

      ```

      '
  - step: 2
    title: Authenticate and fetch the dump
    instructions: '```text

      AUTH {{USERNAME}} {{PASSWORD}}

      LIST

      GET {{FLAG_FILE}}

      ```

      '
  - step: 3
    title: Record the database marker
    instructions: Record the flag from the exported SQL file.
hint_levels:
  low:
  - Inspect the Postgres-style export before moving to {{NEXT_NODE_NAME}}.
  medium:
  - 'Credential artifact: {{OUTPUT.Credential(user,password)}}'
  high:
  - Connect to the database-style service
  - Authenticate and fetch the dump
  - 'Record the database marker: Record the flag from the exported SQL file.'
