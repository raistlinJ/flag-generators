manifest_version: 1
id: '134'
kind: flag-node-generator
name: 'Database: SQLite Backup File'
description: SQLite-style backup fixture with a text export of tables and a flagged
  row.
runtime:
  type: docker-compose
  compose_file: docker-compose.yml
  service: generator
env:
  SERVICE_VARIANT_ID: database_sqlite_backup_file
inputs:
- name: seed
  type: string
  required: true
- name: node_name
  type: string
  required: true
- name: flag_prefix
  type: string
  required: false
- name: service_port
  type: number
  required: false
  default: 19001
artifacts:
  requires:
  - Knowledge(ip)
  produces:
  - Flag(flag_id)
  - FlagDelivery(mode)
  - FlagFile(path)
  - File(path)
  - Directory(host, path)
  - PortForward(host, port)
  - Endpoint(path)
  - Version(service)
  - BackupArchive(file)
injects:
- service
inject_candidate_paths:
- /srv/db/sqlite
- /var/backups/sqlite
- /opt/app/backups
- /tmp/sqlite_backup
access_instructions:
  title: SQLite Backup File
  steps:
  - step: 1
    title: Connect to the generated service
    instructions: '```bash

      nc {{NODE}} {{PORT}}

      ```

      '
  - step: 2
    title: Enumerate and retrieve the marker
    instructions: '```text

      INFO

      LIST

      GET {{FLAG_FILE}}

      ```

      '
  - step: 3
    title: Record the recovered marker
    instructions: Record the flag and any credential or service context before continuing.
hint_template: Exported records may expose information beyond the database login.
hint_levels:
  low:
  - Exported records may expose information beyond the database login.
  medium:
  - 'Service: SQLite Backup File. Target: {{THIS_NODE_NAME}}; TCP port: {{OUTPUT.PortForward(host, port)}}.'
  - |-
    Check the assigned port:
    ```bash
    nmap -sT -sV -p {{OUTPUT.PortForward(host, port)}} {{THIS_NODE_NAME}}
    ```
  - This service accepts a line-oriented text protocol. Connect with nc, then enter the commands shown in the high hint in
    that same session.
  high:
  - 'Answer: {{OUTPUT.Flag(flag_id)}}'
  - |-
    Connect to the generated service:
    ```bash
    nc {{THIS_NODE_NAME}} {{OUTPUT.PortForward(host, port)}}
    ```
  - |-
    Enumerate and retrieve the marker:
    ```text
    INFO
    LIST
    GET {{OUTPUT.FlagFile(path)}}
    ```
