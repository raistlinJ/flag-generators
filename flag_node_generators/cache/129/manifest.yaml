manifest_version: 1
id: '129'
kind: flag-node-generator
name: 'Cache: Varnish Debug Objects'
description: HTTP cache fixture with cached debug objects exposing a flag-bearing
  header dump.
runtime:
  type: docker-compose
  compose_file: docker-compose.yml
  service: generator
env:
  SERVICE_VARIANT_ID: cache_varnish_debug_objects
inputs:
- name: seed
  type: string
  required: true
- name: node_name
  type: string
  required: true
- name: flag_prefix
  type: string
  required: false
- name: service_port
  type: number
  required: false
  default: 18080
artifacts:
  requires:
  - Knowledge(ip)
  produces:
  - Flag(flag_id)
  - FlagDelivery(mode)
  - FlagFile(path)
  - File(path)
  - Directory(host, path)
  - PortForward(host, port)
  - Endpoint(path)
  - Version(service)
  - ExposedSecret(service)
injects:
- service
inject_candidate_paths:
- /var/cache/varnish
- /srv/http/cache
- /opt/web/cache
- /tmp/varnish_objects
access_instructions:
  title: Varnish Debug Objects
  steps:
  - step: 1
    title: Connect to the generated service
    instructions: '```bash

      nc {{NODE}} {{PORT}}

      ```

      '
  - step: 2
    title: Enumerate and retrieve the marker
    instructions: '```text

      INFO

      LIST

      GET {{FLAG_FILE}}

      ```

      '
  - step: 3
    title: Record the recovered marker
    instructions: Record the flag and any credential or service context before continuing.
hint_template: Applications sometimes leave reusable secrets in cached records.
hint_levels:
  low:
  - Applications sometimes leave reusable secrets in cached records.
  medium:
  - 'Service: Varnish Debug Objects. Target: {{THIS_NODE_NAME}}; TCP port: {{OUTPUT.PortForward(host, port)}}.'
  - |-
    Check the assigned port:
    ```bash
    nmap -sT -sV -p {{OUTPUT.PortForward(host, port)}} {{THIS_NODE_NAME}}
    ```
  - This service accepts a line-oriented text protocol. Connect with nc, then enter the commands shown in the high hint in
    that same session.
  high:
  - 'Answer: {{OUTPUT.Flag(flag_id)}}'
  - |-
    Connect to the generated service:
    ```bash
    nc {{THIS_NODE_NAME}} {{OUTPUT.PortForward(host, port)}}
    ```
  - |-
    Enumerate and retrieve the marker:
    ```text
    INFO
    LIST
    GET {{OUTPUT.FlagFile(path)}}
    ```
