manifest_version: 1
id: '129'
kind: flag-node-generator
name: 'Cache: Varnish Debug Objects'
description: HTTP cache fixture with cached debug objects exposing a flag-bearing
  header dump.
runtime:
  type: docker-compose
  compose_file: docker-compose.yml
  service: generator
env:
  SERVICE_VARIANT_ID: cache_varnish_debug_objects
inputs:
- name: seed
  type: string
  required: true
- name: node_name
  type: string
  required: true
- name: flag_prefix
  type: string
  required: false
- name: service_port
  type: number
  required: false
  default: 18080
artifacts:
  requires:
  - Knowledge(ip)
  produces:
  - Flag(flag_id)
  - FlagDelivery(mode)
  - FlagFile(path)
  - File(path)
  - Directory(host, path)
  - PortForward(host, port)
  - Endpoint(path)
  - Version(service)
  - ExposedSecret(service)
injects:
- service
inject_candidate_paths:
- /var/cache/varnish
- /srv/http/cache
- /opt/web/cache
- /tmp/varnish_objects
access_instructions:
  title: Varnish Debug Objects
  steps:
  - step: 1
    title: Connect to the generated service
    instructions: '```bash

      nc {{NODE}} {{PORT}}

      ```

      '
  - step: 2
    title: Enumerate and retrieve the marker
    instructions: '```text

      INFO

      LIST

      GET {{FLAG_FILE}}

      ```

      '
  - step: 3
    title: Record the recovered marker
    instructions: Record the flag and any credential or service context before continuing.
hint_template: The cache object dump includes headers that were not meant to persist.
hint_levels:
  low:
  - The cache object dump includes headers that were not meant to persist.
  medium:
  - 'File/artifact: {{OUTPUT.File(path):basename}}'
  high:
  - Connect to the generated service
  - Enumerate and retrieve the marker
  - 'Record the recovered marker: Record the flag and any credential or service context
    before continuing.'
