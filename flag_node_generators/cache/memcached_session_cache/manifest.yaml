manifest_version: 1
id: memcached_session_cache
kind: flag-node-generator
name: 'Cache: Memcached Session Cache'
description: Memcached-style session cache leaking an administrative session value.
hint_template: Applications sometimes leave reusable secrets in cached records.
runtime:
  type: docker-compose
  compose_file: docker-compose.yml
  service: generator
env:
  SERVICE_VARIANT_ID: memcached_session_cache
inputs:
- name: seed
  type: string
  required: true
- name: node_name
  type: string
  required: true
- name: flag_prefix
  type: string
  required: false
- name: service_port
  type: number
  required: false
  default: 11211
artifacts:
  requires:
  - Knowledge(ip)
  produces:
  - Flag(flag_id)
  - FlagDelivery(mode)
  - FlagFile(path)
  - File(path)
  - Directory(host, path)
  - PortForward(host, port)
  - Endpoint(path)
  - Version(service)
  - ExposedSecret(service)
injects:
- service
inject_candidate_paths:
- /var/lib/memcached
- /srv/cache/memcached
- /opt/cache/sessions
- /tmp/memcache
access_instructions:
  title: Memcached-Style Session Cache
  steps:
  - step: 1
    title: Connect to the cache service
    instructions: '```bash

      nc {{NODE}} {{PORT}}

      ```

      '
  - step: 2
    title: Check stats and retrieve the session
    instructions: '```text

      STATS

      GET session_admin

      GET {{FLAG_FILE}}

      ```

      '
  - step: 3
    title: Record the cached marker
    instructions: Record the flag from the session cache value.
hint_levels:
  low:
  - Applications sometimes leave reusable secrets in cached records.
  medium:
  - 'Service: Memcached-Style Session Cache. Target: {{THIS_NODE_NAME}}; TCP port: {{OUTPUT.PortForward(host, port)}}.'
  - |-
    Check the assigned port:
    ```bash
    nmap -sT -sV -p {{OUTPUT.PortForward(host, port)}} {{THIS_NODE_NAME}}
    ```
  - This service accepts a line-oriented text protocol. Connect with nc, then enter the commands shown in the high hint in
    that same session.
  high:
  - 'Answer: {{OUTPUT.Flag(flag_id)}}'
  - |-
    Connect to the cache service:
    ```bash
    nc {{THIS_NODE_NAME}} {{OUTPUT.PortForward(host, port)}}
    ```
  - |-
    Check stats and retrieve the session:
    ```text
    STATS
    GET session_admin
    GET {{OUTPUT.FlagFile(path)}}
    ```
