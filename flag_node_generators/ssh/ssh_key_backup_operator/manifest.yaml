manifest_version: 1
id: ssh_key_backup_operator
kind: flag-node-generator
name: 'SSH: Key Backup Operator'
description: Key-only SSH node themed around backup operator restore files and indexes.
hint_template: Backup material can preserve sensitive information.
runtime:
  type: docker-compose
  compose_file: docker-compose.yml
  service: generator
env:
  SSH_VARIANT_ID: ssh_key_backup_operator
inputs:
- name: seed
  type: string
  required: true
- name: node_name
  type: string
  required: true
- name: flag_prefix
  type: string
  required: false
- name: ssh_port
  type: number
  required: false
  default: 2222
artifacts:
  requires:
  - Knowledge(ip)
  produces:
  - Flag(flag_id)
  - FlagDelivery(mode)
  - FlagFile(path)
  - Credential(user)
  - SSHPrivateKey(path)
  - File(path)
  - PortForward(host, port)
  - Directory(host, path)
injects:
- workspace
inject_candidate_paths:
- /home/backup/backups
- /opt/restore/drop
- /var/lib/backup-operator
- /srv/backups/staging
access_instructions:
  title: Key-Only SSH Backup Operator
  steps:
  - step: 1
    title: SSH with the backup key
    instructions: '```bash

      chmod 600 ./{{KEY_FILE}}

      ssh -i ./{{KEY_FILE}} -p {{PORT}} {{USERNAME}}@{{NODE}}

      ```

      '
  - step: 2
    title: Review restore notes
    instructions: '```bash

      find ~/backups -maxdepth 3 -type f -print

      cat ~/{{FLAG_FILE}}

      ```

      '
  - step: 3
    title: Record backup context
    instructions: Record the flag and restore batch.
hint_levels:
  low:
  - Backup material can preserve sensitive information.
  medium:
  - 'Service: Key-Only SSH Backup Operator. Target: {{THIS_NODE_NAME}}; TCP port: {{OUTPUT.PortForward(host, port)}}.'
  - |-
    Check the assigned port:
    ```bash
    nmap -sT -sV -p {{OUTPUT.PortForward(host, port)}} {{THIS_NODE_NAME}}
    ```
  high:
  - 'Answer: {{OUTPUT.Flag(flag_id)}}'
  - |-
    SSH with the backup key:
    ```bash
    chmod 600 ./{{OUTPUT.SSHPrivateKey(path)}}
    ssh -i ./{{OUTPUT.SSHPrivateKey(path)}} -p {{OUTPUT.PortForward(host, port)}} <username>@{{THIS_NODE_NAME}}
    ```
  - |-
    Review restore notes:
    ```bash
    find ~/backups -maxdepth 3 -type f -print
    cat ~/{{OUTPUT.FlagFile(path)}}
    ```
