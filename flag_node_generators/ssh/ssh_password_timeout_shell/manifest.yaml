manifest_version: 1
id: ssh_password_timeout_shell
kind: flag-node-generator
name: 'SSH: Password Timeout Shell'
description: Password-authenticated SSH node with shell and client-alive timeout behavior.
hint_template: The account home directory may contain useful operational records.
runtime:
  type: docker-compose
  compose_file: docker-compose.yml
  service: generator
env:
  SSH_VARIANT_ID: ssh_password_timeout_shell
inputs:
- name: seed
  type: string
  required: true
- name: node_name
  type: string
  required: true
- name: flag_prefix
  type: string
  required: false
- name: ssh_port
  type: number
  required: false
  default: 2222
- name: timeout_seconds
  type: number
  required: false
  default: 120
- name: Credential(user, password)
  type: string
  required: true
  flow_supply_when_first: true
artifacts:
  requires:
  - Knowledge(ip)
  - Credential(user, password)
  produces:
  - Flag(flag_id)
  - FlagDelivery(mode)
  - FlagFile(path)
  - Credential(user, password)
  - File(path)
  - PortForward(host, port)
  - TimeoutSeconds(seconds)
  - Directory(host, path)
injects:
- workspace
inject_candidate_paths:
- /home/tempops/session
- /run/user-session/drop
- /var/tmp/timeboxed
- /srv/temporary-access
access_instructions:
  title: Password SSH With Timeout
  steps:
  - step: 1
    title: Open the timeboxed shell
    instructions: '```bash

      ssh -p {{PORT}} {{USERNAME}}@{{NODE}}

      ```

      Use password `{{PASSWORD}}`. Idle sessions expire after about {{TIMEOUT_SECONDS}}
      seconds.

      '
  - step: 2
    title: Collect the window marker
    instructions: '```bash

      cat ~/{{FLAG_FILE}}

      ```

      '
  - step: 3
    title: Record timeout context
    instructions: Record the flag and the configured timeout.
hint_levels:
  low:
  - The account home directory may contain useful operational records.
  medium:
  - 'Service: Password SSH With Timeout. Target: {{THIS_NODE_NAME}}; TCP port: {{OUTPUT.PortForward(host, port)}}.'
  - |-
    Check the assigned port:
    ```bash
    nmap -sT -sV -p {{OUTPUT.PortForward(host, port)}} {{THIS_NODE_NAME}}
    ```
  high:
  - 'Answer: {{OUTPUT.Flag(flag_id)}}'
  - 'Credential (user:password): {{OUTPUT.Credential(user, password)}}. Replace <username> and <password> in the commands
    with these two components.'
  - |-
    Open the timeboxed shell:
    ```bash
    ssh -p {{OUTPUT.PortForward(host, port)}} <username>@{{THIS_NODE_NAME}}
    ```
    Use password `<password>`. The shell has an idle timeout; read the file promptly.
  - |-
    Collect the window marker:
    ```bash
    cat ~/{{OUTPUT.FlagFile(path)}}
    ```
