manifest_version: 1
id: ssh_password_audit_workstation
kind: flag-node-generator
name: 'SSH: Password Audit Workstation'
description: Password-authenticated SSH node with audit logs, review notes, and a
  themed home filesystem.
hint_template: The account home directory may contain useful operational records.
runtime:
  type: docker-compose
  compose_file: docker-compose.yml
  service: generator
env:
  SSH_VARIANT_ID: ssh_password_audit_workstation
inputs:
- name: seed
  type: string
  required: true
- name: node_name
  type: string
  required: true
- name: flag_prefix
  type: string
  required: false
- name: ssh_port
  type: number
  required: false
  default: 2222
- name: Credential(user, password)
  type: string
  required: true
  flow_supply_when_first: true
artifacts:
  requires:
  - Knowledge(ip)
  - Credential(user, password)
  produces:
  - Flag(flag_id)
  - FlagDelivery(mode)
  - FlagFile(path)
  - Credential(user, password)
  - File(path)
  - PortForward(host, port)
  - Directory(host, path)
injects:
- workspace
inject_candidate_paths:
- /home/auditor/review
- /opt/audit/drop
- /var/tmp/audit_export
- /srv/compliance/workstation
access_instructions:
  title: Password SSH Audit Workstation
  steps:
  - step: 1
    title: SSH with the assigned password
    instructions: 'Connect using the resolved credential password:

      ```bash

      ssh -p {{PORT}} {{USERNAME}}@{{NODE}}

      ```

      When prompted, enter `{{PASSWORD}}`.

      '
  - step: 2
    title: Review audit files
    instructions: '```bash

      find ~/audit -maxdepth 3 -type f -print

      cat ~/{{FLAG_FILE}}

      ```

      '
  - step: 3
    title: Record evidence
    instructions: Record the flag and the audit log path that led to it.
hint_levels:
  low:
  - The account home directory may contain useful operational records.
  medium:
  - 'Service: Password SSH Audit Workstation. Target: {{THIS_NODE_NAME}}; TCP port: {{OUTPUT.PortForward(host, port)}}.'
  - |-
    Check the assigned port:
    ```bash
    nmap -sT -sV -p {{OUTPUT.PortForward(host, port)}} {{THIS_NODE_NAME}}
    ```
  high:
  - 'Answer: {{OUTPUT.Flag(flag_id)}}'
  - 'Credential (user:password): {{OUTPUT.Credential(user, password)}}. Replace <username> and <password> in the commands
    with these two components.'
  - |-
    SSH with the assigned password:
    Connect using the resolved credential password:
    ```bash
    ssh -p {{OUTPUT.PortForward(host, port)}} <username>@{{THIS_NODE_NAME}}
    ```
    When prompted, enter `<password>`.
  - |-
    Review audit files:
    ```bash
    find ~/audit -maxdepth 3 -type f -print
    cat ~/{{OUTPUT.FlagFile(path)}}
    ```
