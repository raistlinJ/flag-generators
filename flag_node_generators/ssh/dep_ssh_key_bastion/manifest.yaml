manifest_version: 1
id: dep_ssh_key_bastion
kind: flag-node-generator
name: 'Dependency Consumer: SSH Key Bastion'
description: Consumes an SSHPrivateKey(path) artifact as a key-only bastion follow-up.
hint_template: A finding from an earlier challenge is the input to this service.
runtime:
  type: docker-compose
  compose_file: docker-compose.yml
  service: generator
env:
  DEPENDENCY_CONSUMER_VARIANT_ID: dep_ssh_key_bastion
inputs:
- name: seed
  type: string
  required: true
- name: node_name
  type: string
  required: true
- name: flag_prefix
  type: string
  required: false
- name: web_port
  type: number
  required: false
- name: SSHPrivateKey(path)
  type: file
  required: true
  sensitive: true
  flow_supply_when_first: true
artifacts:
  requires:
  - Knowledge(ip)
  - SSHPrivateKey(path)
  produces:
  - Flag(flag_id)
  - FlagDelivery(mode)
  - FlagFile(path)
  - File(path)
  - Checksum(sha256)
  - PortForward(host, port)
  - Directory(host, path)
  - Endpoint(path)
  - Version(service)
  - Credential(user)
injects:
- site
inject_candidate_paths:
- /opt/dependency-consumers/bastion
- /srv/bastion
- /var/www/bastion
access_instructions:
  title: SSH Key Bastion
  steps:
  - step: 1
    title: Use the prior private key path
    instructions: Provide the previous `SSHPrivateKey(path)` as `key_path` or `X-SSH-Key-Path`.
hint_levels:
  low:
  - A finding from an earlier challenge is the input to this service.
  medium:
  - 'Service: SSH Key Bastion. Target: {{THIS_NODE_NAME}}; TCP port: {{OUTPUT.PortForward(host, port)}}.'
  - |-
    Check the assigned port:
    ```bash
    nmap -sT -sV -p {{OUTPUT.PortForward(host, port)}} {{THIS_NODE_NAME}}
    ```
  - 'Required earlier finding: SSHPrivateKey(path). Use its exact value from the preceding challenge.'
  high:
  - 'Answer: {{OUTPUT.Flag(flag_id)}}'
  - "This gate uses HTTP. Replace <prior-value> with the earlier SSHPrivateKey(path). \n```bash\ncurl -H 'X-SSH-Key-Path:\
    \ <prior-value>' 'http://{{THIS_NODE_NAME}}:{{OUTPUT.PortForward(host, port)}}{{OUTPUT.Endpoint(path)}}'\n```"
