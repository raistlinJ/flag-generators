manifest_version: 1
id: dep_ssh_key_bastion
kind: flag-node-generator
name: 'Dependency Consumer: SSH Key Bastion'
description: Consumes an SSHPrivateKey(path) artifact as a key-only bastion follow-up.
hint_template: Use the prior SSH private key path against {{NODE}} @ {{NODE_IP}}.
runtime:
  type: docker-compose
  compose_file: docker-compose.yml
  service: generator
env:
  DEPENDENCY_CONSUMER_VARIANT_ID: dep_ssh_key_bastion
inputs:
- name: seed
  type: string
  required: true
- name: node_name
  type: string
  required: true
- name: flag_prefix
  type: string
  required: false
- name: web_port
  type: number
  required: false
- name: SSHPrivateKey(path)
  type: file
  required: true
  sensitive: true
  flow_supply_when_first: true
artifacts:
  requires:
  - Knowledge(ip)
  - SSHPrivateKey(path)
  produces:
  - Flag(flag_id)
  - FlagDelivery(mode)
  - FlagFile(path)
  - File(path)
  - Checksum(sha256)
  - PortForward(host, port)
  - Directory(host, path)
  - Endpoint(path)
  - Version(service)
  - Credential(user)
injects:
- site
inject_candidate_paths:
- /opt/dependency-consumers/bastion
- /srv/bastion
- /var/www/bastion
access_instructions:
  title: SSH Key Bastion
  steps:
  - step: 1
    title: Use the prior private key path
    instructions: Provide the previous `SSHPrivateKey(path)` as `key_path` or `X-SSH-Key-Path`.
hint_levels:
  low:
  - Use the prior SSH private key path against {{NODE}} @ {{NODE_IP}}.
  medium:
  - 'File/artifact: {{OUTPUT.File(path):basename}}'
  high:
  - 'Use the prior private key path: Provide the previous SSHPrivateKey(path) as key_path
    or X-SSH-Key-Path.'
