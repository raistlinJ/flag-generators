manifest_version: 1
id: ssh_password_helpdesk_home
kind: flag-node-generator
name: 'SSH: Password Helpdesk Home'
description: Password-authenticated SSH node themed as a helpdesk user home with tickets
  and runbooks.
hint_template: The account home directory may contain useful operational records.
runtime:
  type: docker-compose
  compose_file: docker-compose.yml
  service: generator
env:
  SSH_VARIANT_ID: ssh_password_helpdesk_home
inputs:
- name: seed
  type: string
  required: true
- name: node_name
  type: string
  required: true
- name: flag_prefix
  type: string
  required: false
- name: ssh_port
  type: number
  required: false
  default: 2222
- name: Credential(user, password)
  type: string
  required: true
  flow_supply_when_first: true
artifacts:
  requires:
  - Knowledge(ip)
  - Credential(user, password)
  produces:
  - Flag(flag_id)
  - FlagDelivery(mode)
  - FlagFile(path)
  - Credential(user, password)
  - File(path)
  - PortForward(host, port)
  - Directory(host, path)
injects:
- workspace
inject_candidate_paths:
- /home/helpdesk/support
- /opt/support/tickets
- /var/local/helpdesk_drop
- /srv/service-desk/files
access_instructions:
  title: Password SSH Helpdesk Home
  steps:
  - step: 1
    title: SSH into the helpdesk account
    instructions: '```bash

      ssh -p {{PORT}} {{USERNAME}}@{{NODE}}

      ```

      Use password `{{PASSWORD}}`.

      '
  - step: 2
    title: Inspect support tickets
    instructions: '```bash

      find ~/support -maxdepth 3 -type f -print

      cat ~/{{FLAG_FILE}}

      ```

      '
  - step: 3
    title: Capture the ticket marker
    instructions: Record the flag and ticket identifier.
hint_levels:
  low:
  - The account home directory may contain useful operational records.
  medium:
  - 'Service: Password SSH Helpdesk Home. Target: {{THIS_NODE_NAME}}; TCP port: {{OUTPUT.PortForward(host, port)}}.'
  - |-
    Check the assigned port:
    ```bash
    nmap -sT -sV -p {{OUTPUT.PortForward(host, port)}} {{THIS_NODE_NAME}}
    ```
  high:
  - 'Answer: {{OUTPUT.Flag(flag_id)}}'
  - 'Credential (user:password): {{OUTPUT.Credential(user, password)}}. Replace <username> and <password> in the commands
    with these two components.'
  - |-
    SSH into the helpdesk account:
    ```bash
    ssh -p {{OUTPUT.PortForward(host, port)}} <username>@{{THIS_NODE_NAME}}
    ```
    Use password `<password>`.
  - |-
    Inspect support tickets:
    ```bash
    find ~/support -maxdepth 3 -type f -print
    cat ~/{{OUTPUT.FlagFile(path)}}
    ```
  - |-
    Capture the ticket marker:
    Record the flag and ticket identifier.
