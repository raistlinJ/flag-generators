manifest_version: 1
id: ssh_password_finance_terminal
kind: flag-node-generator
name: 'SSH: Password Finance Terminal'
description: Password-authenticated SSH node with finance records, ledgers, and reconciliation
  exports.
hint_template: The account home directory may contain useful operational records.
runtime:
  type: docker-compose
  compose_file: docker-compose.yml
  service: generator
env:
  SSH_VARIANT_ID: ssh_password_finance_terminal
inputs:
- name: seed
  type: string
  required: true
- name: node_name
  type: string
  required: true
- name: flag_prefix
  type: string
  required: false
- name: ssh_port
  type: number
  required: false
  default: 2222
- name: Credential(user, password)
  type: string
  required: true
  flow_supply_when_first: true
artifacts:
  requires:
  - Knowledge(ip)
  - Credential(user, password)
  produces:
  - Flag(flag_id)
  - FlagDelivery(mode)
  - FlagFile(path)
  - Credential(user, password)
  - File(path)
  - PortForward(host, port)
  - Directory(host, path)
injects:
- workspace
inject_candidate_paths:
- /home/finance/reconciliations
- /opt/accounting/export
- /var/tmp/finance_drop
- /srv/finance-terminal
access_instructions:
  title: Password SSH Finance Terminal
  steps:
  - step: 1
    title: SSH into the finance account
    instructions: '```bash

      ssh -p {{PORT}} {{USERNAME}}@{{NODE}}

      ```

      Use password `{{PASSWORD}}`.

      '
  - step: 2
    title: Search reconciliation records
    instructions: '```bash

      find ~/finance -maxdepth 3 -type f -print

      cat ~/{{FLAG_FILE}}

      ```

      '
  - step: 3
    title: Record accounting evidence
    instructions: Record the flag and the reconciliation filename.
hint_levels:
  low:
  - The account home directory may contain useful operational records.
  medium:
  - 'Service: Password SSH Finance Terminal. Target: {{THIS_NODE_NAME}}; TCP port: {{OUTPUT.PortForward(host, port)}}.'
  - |-
    Check the assigned port:
    ```bash
    nmap -sT -sV -p {{OUTPUT.PortForward(host, port)}} {{THIS_NODE_NAME}}
    ```
  high:
  - 'Answer: {{OUTPUT.Flag(flag_id)}}'
  - 'Credential (user:password): {{OUTPUT.Credential(user, password)}}. Replace <username> and <password> in the commands
    with these two components.'
  - |-
    SSH into the finance account:
    ```bash
    ssh -p {{OUTPUT.PortForward(host, port)}} <username>@{{THIS_NODE_NAME}}
    ```
    Use password `<password>`.
  - |-
    Search reconciliation records:
    ```bash
    find ~/finance -maxdepth 3 -type f -print
    cat ~/{{OUTPUT.FlagFile(path)}}
    ```
