manifest_version: 1
id: http_login_staff_portal
kind: flag-node-generator
name: 'HTTP: Staff Login Portal'
description: Password-protected HTTP staff services portal with private onboarding
  notes.
hint_template: Use the staff portal credential before moving to {{NEXT_NODE_NAME}}.
runtime:
  type: docker-compose
  compose_file: docker-compose.yml
  service: generator
env:
  WEB_VARIANT_ID: http_login_staff_portal
inputs:
- name: seed
  type: string
  required: true
- name: node_name
  type: string
  required: true
- name: flag_prefix
  type: string
  required: false
- name: web_port
  type: number
  required: false
  default: 8080
- name: Credential(user, password)
  type: string
  required: true
  flow_supply_when_first: true
artifacts:
  requires:
  - Knowledge(ip)
  - Credential(user, password)
  produces:
  - Flag(flag_id)
  - FlagDelivery(mode)
  - FlagFile(path)
  - Credential(user, password)
  - File(path)
  - PortForward(host, port)
  - Directory(host, path)
  - Endpoint(path)
  - Version(service)
  - WebAuthBypass(app)
injects:
- site
inject_candidate_paths:
- /var/www/staff
- /srv/staff-portal
- /opt/hr/selfservice
- /home/www-data/staff
access_instructions:
  title: Staff Portal Login
  steps:
  - step: 1
    title: Authenticate to the portal
    instructions: '```bash

      curl -i -c cookies.txt -d ''username={{USERNAME}}&password={{PASSWORD}}'' http://{{NODE}}:{{PORT}}/login

      ```

      '
  - step: 2
    title: Open the dashboard
    instructions: '```bash

      curl -b cookies.txt http://{{NODE}}:{{PORT}}/dashboard

      ```

      '
  - step: 3
    title: Record the onboarding note
    instructions: Record the flag displayed on the dashboard.
hint_levels:
  low:
  - Use the staff portal credential before moving to {{NEXT_NODE_NAME}}.
  medium:
  - 'Credential artifact: {{OUTPUT.Credential(user,password)}}'
  high:
  - Authenticate to the portal
  - Open the dashboard
  - 'Record the onboarding note: Record the flag displayed on the dashboard.'
