manifest_version: 1
id: dep_port_forward_pivot
kind: flag-node-generator
name: 'Dependency Consumer: Port Forward Pivot'
description: Consumes a PortForward(host, port) artifact to unlock an internal pivot
  console.
hint_template: A finding from an earlier challenge is the input to this service.
runtime:
  type: docker-compose
  compose_file: docker-compose.yml
  service: generator
env:
  DEPENDENCY_CONSUMER_VARIANT_ID: dep_port_forward_pivot
inputs:
- name: seed
  type: string
  required: true
- name: node_name
  type: string
  required: true
- name: flag_prefix
  type: string
  required: false
- name: web_port
  type: number
  required: false
- name: PortForward(host, port)
  type: string
  required: true
  flow_supply_when_first: true
artifacts:
  requires:
  - Knowledge(ip)
  - PortForward(host, port)
  produces:
  - Flag(flag_id)
  - FlagDelivery(mode)
  - FlagFile(path)
  - File(path)
  - Checksum(sha256)
  - PortForward(host, port)
  - Directory(host, path)
  - Endpoint(path)
  - Version(service)
injects:
- site
inject_candidate_paths:
- /opt/dependency-consumers/pivot
- /srv/pivot
- /var/www/pivot
access_instructions:
  title: Port Forward Pivot
  steps:
  - step: 1
    title: Use the pivot mapping
    instructions: Provide the previous `PortForward(host, port)` as `pivot` or `X-Port-Forward`.
hint_levels:
  low:
  - A finding from an earlier challenge is the input to this service.
  medium:
  - 'Service: Port Forward Pivot. Target: {{THIS_NODE_NAME}}; TCP port: {{OUTPUT.PortForward(host, port)}}.'
  - |-
    Check the assigned port:
    ```bash
    nmap -sT -sV -p {{OUTPUT.PortForward(host, port)}} {{THIS_NODE_NAME}}
    ```
  - 'Required earlier finding: PortForward(host, port). Use its exact value from the preceding challenge.'
  high:
  - 'Answer: {{OUTPUT.Flag(flag_id)}}'
  - "This gate uses HTTP. Replace <prior-value> with the earlier PortForward(host, port). \n```bash\ncurl -H 'X-Port-Forward:\
    \ <prior-value>' 'http://{{THIS_NODE_NAME}}:{{OUTPUT.PortForward(host, port)}}{{OUTPUT.Endpoint(path)}}'\n```"
