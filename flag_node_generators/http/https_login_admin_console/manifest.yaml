manifest_version: 1
id: https_login_admin_console
kind: flag-node-generator
name: 'HTTPS: Admin Login Console'
description: TLS admin console with form login, private service-map files, and realistic
  operations content.
hint_template: Use the admin console credential before moving to {{NEXT_NODE_NAME}}.
runtime:
  type: docker-compose
  compose_file: docker-compose.yml
  service: generator
env:
  WEB_VARIANT_ID: https_login_admin_console
inputs:
- name: seed
  type: string
  required: true
- name: node_name
  type: string
  required: true
- name: flag_prefix
  type: string
  required: false
- name: web_port
  type: number
  required: false
  default: 8443
- name: Credential(user
  password): null
  type: string
  required: true
  flow_supply_when_first: true
artifacts:
  requires:
  - Knowledge(ip)
  - Credential(user
  - password)
  produces:
  - Flag(flag_id)
  - FlagDelivery(mode)
  - FlagFile(path)
  - Credential(user
  - password)
  - File(path)
  - PortForward(host
  - port)
  - Directory(host
  - path)
  - Endpoint(path)
  - Version(service)
  - WebAuthBypass(app)
injects:
- site
inject_candidate_paths:
- /var/www/admin
- /srv/https/admin-console
- /opt/platform/console
- /home/www-data/admin
access_instructions:
  title: TLS Admin Console Login
  steps:
  - step: 1
    title: Authenticate over HTTPS
    instructions: '```bash

      curl -k -i -c cookies.txt -d ''username={{USERNAME}}&password={{PASSWORD}}''
      https://{{NODE}}:{{PORT}}/login

      ```

      '
  - step: 2
    title: Read the admin dashboard
    instructions: '```bash

      curl -k -b cookies.txt https://{{NODE}}:{{PORT}}/dashboard

      ```

      '
  - step: 3
    title: Record the change ticket
    instructions: Record the flag from the admin change ticket.
hint_levels:
  low:
  - Use the admin console credential before moving to {{NEXT_NODE_NAME}}.
  medium:
  - 'Credential artifact: {{OUTPUT.Credential(user,password)}}'
  high:
  - Authenticate over HTTPS
  - Read the admin dashboard
  - 'Record the change ticket: Record the flag from the admin change ticket.'
