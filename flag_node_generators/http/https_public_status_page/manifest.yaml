manifest_version: 1
id: https_public_status_page
kind: flag-node-generator
name: 'HTTPS: Public Status Page'
description: No-login HTTPS status board with TLS and realistic maintenance/status
  files.
hint_template: Explore the portal and the operational records it makes available.
runtime:
  type: docker-compose
  compose_file: docker-compose.yml
  service: generator
env:
  WEB_VARIANT_ID: https_public_status_page
inputs:
- name: seed
  type: string
  required: true
- name: node_name
  type: string
  required: true
- name: flag_prefix
  type: string
  required: false
- name: web_port
  type: number
  required: false
  default: 8443
artifacts:
  requires:
  - Knowledge(ip)
  produces:
  - Flag(flag_id)
  - FlagDelivery(mode)
  - FlagFile(path)
  - File(path)
  - PortForward(host, port)
  - Directory(host, path)
  - Endpoint(path)
  - Version(service)
injects:
- site
inject_candidate_paths:
- /var/www/status
- /srv/https/status
- /opt/status-board
- /home/www-data/status
access_instructions:
  title: Public HTTPS Status Page
  steps:
  - step: 1
    title: Open the TLS status board
    instructions: 'The node uses a local self-signed certificate:

      ```bash

      curl -k https://{{NODE}}:{{PORT}}/status/maintenance

      ```

      '
  - step: 2
    title: Inspect maintenance metadata
    instructions: '```bash

      curl -k https://{{NODE}}:{{PORT}}/downloads/incidents.json

      ```

      '
  - step: 3
    title: Record the maintenance marker
    instructions: Record the flag from the maintenance note.
hint_levels:
  low:
  - Explore the portal and the operational records it makes available.
  medium:
  - 'Service: Public HTTPS Status Page. Target: {{THIS_NODE_NAME}}; TCP port: {{OUTPUT.PortForward(host, port)}}.'
  - |-
    Check the assigned port:
    ```bash
    nmap -sT -sV -p {{OUTPUT.PortForward(host, port)}} {{THIS_NODE_NAME}}
    ```
  high:
  - 'Answer: {{OUTPUT.Flag(flag_id)}}'
  - |-
    Open the TLS status board:
    The node uses a local self-signed certificate:
    ```bash
    curl -k https://{{THIS_NODE_NAME}}:{{OUTPUT.PortForward(host, port)}}/status/maintenance
    ```
  - |-
    Inspect maintenance metadata:
    ```bash
    curl -k https://{{THIS_NODE_NAME}}:{{OUTPUT.PortForward(host, port)}}/downloads/incidents.json
    ```
