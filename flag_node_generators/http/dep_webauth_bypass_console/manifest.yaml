manifest_version: 1
id: dep_webauth_bypass_console
kind: flag-node-generator
name: 'Dependency Consumer: WebAuth Bypass Console'
description: Consumes a WebAuthBypass(app) artifact to expose an admin console and
  API key.
hint_template: A finding from an earlier challenge is the input to this service.
runtime:
  type: docker-compose
  compose_file: docker-compose.yml
  service: generator
env:
  DEPENDENCY_CONSUMER_VARIANT_ID: dep_webauth_bypass_console
inputs:
- name: seed
  type: string
  required: true
- name: node_name
  type: string
  required: true
- name: flag_prefix
  type: string
  required: false
- name: web_port
  type: number
  required: false
- name: WebAuthBypass(app)
  type: string
  required: true
  flow_supply_when_first: true
artifacts:
  requires:
  - Knowledge(ip)
  - WebAuthBypass(app)
  produces:
  - Flag(flag_id)
  - FlagDelivery(mode)
  - FlagFile(path)
  - File(path)
  - Checksum(sha256)
  - PortForward(host, port)
  - Directory(host, path)
  - Endpoint(path)
  - Version(service)
  - APIKey(service)
injects:
- site
inject_candidate_paths:
- /opt/dependency-consumers/bypass
- /srv/admin-bypass
- /var/www/admin
access_instructions:
  title: WebAuth Bypass Console
  steps:
  - step: 1
    title: Apply the bypass marker
    instructions: Provide the previous `WebAuthBypass(app)` as `bypass` or `X-Auth-Bypass`.
hint_levels:
  low:
  - A finding from an earlier challenge is the input to this service.
  medium:
  - 'Service: WebAuth Bypass Console. Target: {{THIS_NODE_NAME}}; TCP port: {{OUTPUT.PortForward(host, port)}}.'
  - |-
    Check the assigned port:
    ```bash
    nmap -sT -sV -p {{OUTPUT.PortForward(host, port)}} {{THIS_NODE_NAME}}
    ```
  - 'Required earlier finding: WebAuthBypass(app). Use its exact value from the preceding challenge.'
  high:
  - 'Answer: {{OUTPUT.Flag(flag_id)}}'
  - "This gate uses HTTP. Replace <prior-value> with the earlier WebAuthBypass(app). \n```bash\ncurl -H 'X-Auth-Bypass: <prior-value>'\
    \ 'http://{{THIS_NODE_NAME}}:{{OUTPUT.PortForward(host, port)}}{{OUTPUT.Endpoint(path)}}'\n```"
