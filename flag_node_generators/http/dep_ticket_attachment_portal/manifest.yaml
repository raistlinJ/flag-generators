manifest_version: 1
id: dep_ticket_attachment_portal
kind: flag-node-generator
name: 'Dependency Consumer: Ticket Attachment Portal'
description: Consumes a Ticket(id) artifact to expose a support attachment and follow-up
  credential.
hint_template: A finding from an earlier challenge is the input to this service.
runtime:
  type: docker-compose
  compose_file: docker-compose.yml
  service: generator
env:
  DEPENDENCY_CONSUMER_VARIANT_ID: dep_ticket_attachment_portal
inputs:
- name: seed
  type: string
  required: true
- name: node_name
  type: string
  required: true
- name: flag_prefix
  type: string
  required: false
- name: web_port
  type: number
  required: false
- name: Ticket(id)
  type: string
  required: true
  flow_supply_when_first: true
artifacts:
  requires:
  - Knowledge(ip)
  - Ticket(id)
  produces:
  - Flag(flag_id)
  - FlagDelivery(mode)
  - FlagFile(path)
  - File(path)
  - Checksum(sha256)
  - PortForward(host, port)
  - Directory(host, path)
  - Endpoint(path)
  - Version(service)
  - Credential(user, password)
injects:
- site
inject_candidate_paths:
- /opt/dependency-consumers/tickets
- /srv/support/attachments
- /var/www/support
access_instructions:
  title: Ticket Attachment Portal
  steps:
  - step: 1
    title: Retrieve the attachment
    instructions: Submit the prior `Ticket(id)` as `ticket` or `X-Ticket-ID`.
hint_levels:
  low:
  - A finding from an earlier challenge is the input to this service.
  medium:
  - 'Service: Ticket Attachment Portal. Target: {{THIS_NODE_NAME}}; TCP port: {{OUTPUT.PortForward(host, port)}}.'
  - |-
    Check the assigned port:
    ```bash
    nmap -sT -sV -p {{OUTPUT.PortForward(host, port)}} {{THIS_NODE_NAME}}
    ```
  - 'Required earlier finding: Ticket(id). Use its exact value from the preceding challenge.'
  high:
  - 'Answer: {{OUTPUT.Flag(flag_id)}}'
  - 'Credential (user:password): {{OUTPUT.Credential(user, password)}}. Replace <username> and <password> in the commands
    with these two components.'
  - "This gate uses HTTP. Replace <prior-value> with the earlier Ticket(id). \n```bash\ncurl -H 'X-Ticket-ID: <prior-value>'\
    \ 'http://{{THIS_NODE_NAME}}:{{OUTPUT.PortForward(host, port)}}{{OUTPUT.Endpoint(path)}}'\n```"
