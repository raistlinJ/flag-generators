services:
  generator:
    build: .
    volumes:
      - ${INPUTS_DIR:-./inputs}:/inputs:ro
      - ${OUTPUTS_DIR:-./outputs}:/outputs
    environment:
      - CONFIG_PATH=/inputs/config.json
      - OUT_DIR=/outputs
      - DEPENDENCY_CONSUMER_VARIANT_ID=${DEPENDENCY_CONSUMER_VARIANT_ID:-dep_api_key_admin_endpoint}