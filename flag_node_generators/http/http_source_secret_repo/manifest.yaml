manifest_version: 1
id: http_source_secret_repo
kind: flag-node-generator
name: 'HTTP: Source Secret Repository'
description: No-login HTTP code browser where a source file contains an embedded secret
  and flag.
hint_template: Published source code can expose secrets as well as functionality.
runtime:
  type: docker-compose
  compose_file: docker-compose.yml
  service: generator
env:
  WEB_VARIANT_ID: http_source_secret_repo
inputs:
- name: seed
  type: string
  required: true
- name: node_name
  type: string
  required: true
- name: flag_prefix
  type: string
  required: false
- name: web_port
  type: number
  required: false
  default: 8080
artifacts:
  requires:
  - Knowledge(ip)
  produces:
  - Flag(flag_id)
  - FlagDelivery(mode)
  - FlagFile(path)
  - File(path)
  - PortForward(host, port)
  - Directory(host, path)
  - Endpoint(path)
  - Version(service)
  - SourceCode(repo)
  - ExposedSecret(service)
injects:
- site
inject_candidate_paths:
- /var/www/source
- /srv/source-browser
- /opt/code-mirror
- /home/www-data/source
access_instructions:
  title: Exposed HTTP Source Secret
  steps:
  - step: 1
    title: Open the code browser
    instructions: '```bash

      curl http://{{NODE}}:{{PORT}}/source/app.py

      ```

      '
  - step: 2
    title: Search for embedded secrets
    instructions: '```bash

      curl -s http://{{NODE}}:{{PORT}}/source/app.py | grep -E ''SECRET|FLAG|RECOVERY''

      ```

      '
  - step: 3
    title: Record the source secret
    instructions: Record the flag embedded in the mirrored source file.
hint_levels:
  low:
  - Published source code can expose secrets as well as functionality.
  medium:
  - 'Service: Exposed HTTP Source Secret. Target: {{THIS_NODE_NAME}}; TCP port: {{OUTPUT.PortForward(host, port)}}.'
  - |-
    Check the assigned port:
    ```bash
    nmap -sT -sV -p {{OUTPUT.PortForward(host, port)}} {{THIS_NODE_NAME}}
    ```
  high:
  - 'Answer: {{OUTPUT.Flag(flag_id)}}'
  - |-
    Open the code browser:
    ```bash
    curl http://{{THIS_NODE_NAME}}:{{OUTPUT.PortForward(host, port)}}/source/app.py
    ```
  - |-
    Search for embedded secrets:
    ```bash
    curl -s http://{{THIS_NODE_NAME}}:{{OUTPUT.PortForward(host, port)}}/source/app.py | grep -E 'SECRET|FLAG|RECOVERY'
    ```
