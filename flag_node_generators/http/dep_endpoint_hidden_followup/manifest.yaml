manifest_version: 1
id: dep_endpoint_hidden_followup
kind: flag-node-generator
name: 'Dependency Consumer: Hidden Endpoint Follow-Up'
description: Consumes an Endpoint(path) artifact by placing the next challenge at
  that path.
hint_template: A finding from an earlier challenge is the input to this service.
runtime:
  type: docker-compose
  compose_file: docker-compose.yml
  service: generator
env:
  DEPENDENCY_CONSUMER_VARIANT_ID: dep_endpoint_hidden_followup
inputs:
- name: seed
  type: string
  required: true
- name: node_name
  type: string
  required: true
- name: flag_prefix
  type: string
  required: false
- name: web_port
  type: number
  required: false
- name: Endpoint(path)
  type: string
  required: true
  flow_supply_when_first: true
artifacts:
  requires:
  - Knowledge(ip)
  - Endpoint(path)
  produces:
  - Flag(flag_id)
  - FlagDelivery(mode)
  - FlagFile(path)
  - File(path)
  - Checksum(sha256)
  - PortForward(host, port)
  - Directory(host, path)
  - Endpoint(path)
  - Version(service)
  - WebAuthBypass(app)
injects:
- site
inject_candidate_paths:
- /opt/dependency-consumers/endpoints
- /srv/hidden-endpoints
- /var/www/internal
access_instructions:
  title: Hidden Endpoint Follow-Up
  steps:
  - step: 1
    title: Visit the revealed path
    instructions: Use the previous `Endpoint(path)` directly on this generated node.
hint_levels:
  low:
  - A finding from an earlier challenge is the input to this service.
  medium:
  - 'Service: Hidden Endpoint Follow-Up. Target: {{THIS_NODE_NAME}}; TCP port: {{OUTPUT.PortForward(host, port)}}.'
  - |-
    Check the assigned port:
    ```bash
    nmap -sT -sV -p {{OUTPUT.PortForward(host, port)}} {{THIS_NODE_NAME}}
    ```
  - 'Required earlier finding: Endpoint(path). Use its exact value from the preceding challenge.'
  high:
  - 'Answer: {{OUTPUT.Flag(flag_id)}}'
  - "This gate uses HTTP. \n```bash\ncurl 'http://{{THIS_NODE_NAME}}:{{OUTPUT.PortForward(host, port)}}{{OUTPUT.Endpoint(path)}}'\n\
    ```"
