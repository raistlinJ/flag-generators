manifest_version: 1
id: http_upload_file_drop
kind: flag-node-generator
name: 'HTTP: Upload File Drop'
description: No-login vendor intake page with upload behavior and realistic queued
  file-drop content.
hint_template: Explore the portal and the operational records it makes available.
runtime:
  type: docker-compose
  compose_file: docker-compose.yml
  service: generator
env:
  WEB_VARIANT_ID: http_upload_file_drop
inputs:
- name: seed
  type: string
  required: true
- name: node_name
  type: string
  required: true
- name: flag_prefix
  type: string
  required: false
- name: web_port
  type: number
  required: false
  default: 8080
artifacts:
  requires:
  - Knowledge(ip)
  produces:
  - Flag(flag_id)
  - FlagDelivery(mode)
  - FlagFile(path)
  - File(path)
  - PortForward(host, port)
  - Directory(host, path)
  - Endpoint(path)
  - Version(service)
  - UploadPrimitive(app)
injects:
- site
inject_candidate_paths:
- /var/www/uploads
- /srv/vendor-dropbox
- /opt/intake/uploads
- /home/www-data/uploads
access_instructions:
  title: HTTP Vendor Intake Dropbox
  steps:
  - step: 1
    title: Open the upload page
    instructions: '```bash

      curl http://{{NODE}}:{{PORT}}/upload

      ```

      '
  - step: 2
    title: Submit a test note
    instructions: '```bash

      curl -d ''note=reviewed by participant'' http://{{NODE}}:{{PORT}}/upload

      ```

      '
  - step: 3
    title: Review the queued intake note
    instructions: Record the flag shown in the intake queue note.
hint_levels:
  low:
  - Explore the portal and the operational records it makes available.
  medium:
  - 'Service: HTTP Vendor Intake Dropbox. Target: {{THIS_NODE_NAME}}; TCP port: {{OUTPUT.PortForward(host, port)}}.'
  - |-
    Check the assigned port:
    ```bash
    nmap -sT -sV -p {{OUTPUT.PortForward(host, port)}} {{THIS_NODE_NAME}}
    ```
  high:
  - 'Answer: {{OUTPUT.Flag(flag_id)}}'
  - |-
    Open the upload page:
    ```bash
    curl http://{{THIS_NODE_NAME}}:{{OUTPUT.PortForward(host, port)}}/upload
    ```
  - |-
    Submit a test note:
    ```bash
    curl -d 'note=reviewed by participant' http://{{THIS_NODE_NAME}}:{{OUTPUT.PortForward(host, port)}}/upload
    ```
  - |-
    Review the queued intake note:
    Record the flag shown in the intake queue note.
