manifest_version: 1
id: http_backup_archive_listing
kind: flag-node-generator
name: 'HTTP: Backup Archive Listing'
description: No-login HTTP backup index exposing a downloadable archive with recovery
  secrets.
hint_template: Backup material can preserve sensitive information.
runtime:
  type: docker-compose
  compose_file: docker-compose.yml
  service: generator
env:
  WEB_VARIANT_ID: http_backup_archive_listing
inputs:
- name: seed
  type: string
  required: true
- name: node_name
  type: string
  required: true
- name: flag_prefix
  type: string
  required: false
- name: web_port
  type: number
  required: false
  default: 8080
artifacts:
  requires:
  - Knowledge(ip)
  produces:
  - Flag(flag_id)
  - FlagDelivery(mode)
  - FlagFile(path)
  - File(path)
  - PortForward(host, port)
  - Directory(host, path)
  - Endpoint(path)
  - Version(service)
  - BackupArchive(file)
  - ExposedSecret(service)
injects:
- site
inject_candidate_paths:
- /var/www/backups
- /srv/backup-index
- /opt/recovery/public
- /home/www-data/backups
access_instructions:
  title: Exposed HTTP Backup Archive
  steps:
  - step: 1
    title: List backup archives
    instructions: '```bash

      curl http://{{NODE}}:{{PORT}}/backups

      ```

      '
  - step: 2
    title: Download the backup bundle
    instructions: '```bash

      curl -o site-backup.zip http://{{NODE}}:{{PORT}}/backups/site-backup.zip

      unzip -p site-backup.zip secrets/recovery-note.txt

      ```

      '
  - step: 3
    title: Record the recovery note
    instructions: Record the flag from the backup archive.
hint_levels:
  low:
  - Backup material can preserve sensitive information.
  medium:
  - 'Service: Exposed HTTP Backup Archive. Target: {{THIS_NODE_NAME}}; TCP port: {{OUTPUT.PortForward(host, port)}}.'
  - |-
    Check the assigned port:
    ```bash
    nmap -sT -sV -p {{OUTPUT.PortForward(host, port)}} {{THIS_NODE_NAME}}
    ```
  high:
  - 'Answer: {{OUTPUT.Flag(flag_id)}}'
  - |-
    List backup archives:
    ```bash
    curl http://{{THIS_NODE_NAME}}:{{OUTPUT.PortForward(host, port)}}/backups
    ```
  - |-
    Download the backup bundle:
    ```bash
    curl -o site-backup.zip http://{{THIS_NODE_NAME}}:{{OUTPUT.PortForward(host, port)}}/backups/site-backup.zip
    unzip -p site-backup.zip secrets/recovery-note.txt
    ```
