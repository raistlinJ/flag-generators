manifest_version: 1
id: dep_checksum_evidence_gate
kind: flag-node-generator
name: 'Dependency Consumer: Checksum Evidence Gate'
description: Consumes a Checksum(sha256) artifact to unlock an evidence download.
hint_template: A finding from an earlier challenge is the input to this service.
runtime:
  type: docker-compose
  compose_file: docker-compose.yml
  service: generator
env:
  DEPENDENCY_CONSUMER_VARIANT_ID: dep_checksum_evidence_gate
inputs:
- name: seed
  type: string
  required: true
- name: node_name
  type: string
  required: true
- name: flag_prefix
  type: string
  required: false
- name: web_port
  type: number
  required: false
- name: Checksum(sha256)
  type: string
  required: true
  flow_supply_when_first: true
artifacts:
  requires:
  - Knowledge(ip)
  - Checksum(sha256)
  produces:
  - Flag(flag_id)
  - FlagDelivery(mode)
  - FlagFile(path)
  - File(path)
  - Checksum(sha256)
  - PortForward(host, port)
  - Directory(host, path)
  - Endpoint(path)
  - Version(service)
injects:
- site
inject_candidate_paths:
- /opt/dependency-consumers/checksum
- /srv/evidence
- /var/www/evidence
access_instructions:
  title: Checksum Evidence Gate
  steps:
  - step: 1
    title: Present the checksum
    instructions: Provide the previous `Checksum(sha256)` as `sha256` or `X-Checksum-SHA256`.
hint_levels:
  low:
  - A finding from an earlier challenge is the input to this service.
  medium:
  - 'Service: Checksum Evidence Gate. Target: {{THIS_NODE_NAME}}; TCP port: {{OUTPUT.PortForward(host, port)}}.'
  - |-
    Check the assigned port:
    ```bash
    nmap -sT -sV -p {{OUTPUT.PortForward(host, port)}} {{THIS_NODE_NAME}}
    ```
  - 'Required earlier finding: Checksum(sha256). Use its exact value from the preceding challenge.'
  high:
  - 'Answer: {{OUTPUT.Flag(flag_id)}}'
  - "This gate uses HTTP. Replace <prior-value> with the earlier Checksum(sha256). \n```bash\ncurl -H 'X-Checksum-SHA256:\
    \ <prior-value>' 'http://{{THIS_NODE_NAME}}:{{OUTPUT.PortForward(host, port)}}{{OUTPUT.Endpoint(path)}}'\n```"
