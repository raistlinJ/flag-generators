manifest_version: 1
id: https_basic_auth_reports
kind: flag-node-generator
name: 'HTTPS: Basic Auth Reports'
description: TLS reports archive protected with HTTP Basic authentication and board-report
  themed content.
hint_template: Explore the portal and the operational records it makes available.
runtime:
  type: docker-compose
  compose_file: docker-compose.yml
  service: generator
env:
  WEB_VARIANT_ID: https_basic_auth_reports
inputs:
- name: seed
  type: string
  required: true
- name: node_name
  type: string
  required: true
- name: flag_prefix
  type: string
  required: false
- name: web_port
  type: number
  required: false
  default: 8443
- name: Credential(user, password)
  type: string
  required: true
  flow_supply_when_first: true
artifacts:
  requires:
  - Knowledge(ip)
  - Credential(user, password)
  produces:
  - Flag(flag_id)
  - FlagDelivery(mode)
  - FlagFile(path)
  - Credential(user, password)
  - File(path)
  - PortForward(host, port)
  - Directory(host, path)
  - Endpoint(path)
  - Version(service)
  - WebAuthBypass(app)
injects:
- site
inject_candidate_paths:
- /var/www/reports
- /srv/https/reports
- /opt/executive/reports
- /home/www-data/reports
access_instructions:
  title: HTTPS Basic Auth Reports Vault
  steps:
  - step: 1
    title: Authenticate with Basic Auth
    instructions: '```bash

      curl -k -u ''{{USERNAME}}:{{PASSWORD}}'' https://{{NODE}}:{{PORT}}/reports

      ```

      '
  - step: 2
    title: Inspect report contents
    instructions: '```bash

      curl -ks -u ''{{USERNAME}}:{{PASSWORD}}'' https://{{NODE}}:{{PORT}}/reports
      | grep -i flag

      ```

      '
  - step: 3
    title: Record the board brief marker
    instructions: Record the flag from the protected report.
hint_levels:
  low:
  - Explore the portal and the operational records it makes available.
  medium:
  - 'Service: HTTPS Basic Auth Reports Vault. Target: {{THIS_NODE_NAME}}; TCP port: {{OUTPUT.PortForward(host, port)}}.'
  - |-
    Check the assigned port:
    ```bash
    nmap -sT -sV -p {{OUTPUT.PortForward(host, port)}} {{THIS_NODE_NAME}}
    ```
  high:
  - 'Answer: {{OUTPUT.Flag(flag_id)}}'
  - 'Credential (user:password): {{OUTPUT.Credential(user, password)}}. Replace <username> and <password> in the commands
    with these two components.'
  - |-
    Authenticate with Basic Auth:
    ```bash
    curl -k -u '<username>:<password>' https://{{THIS_NODE_NAME}}:{{OUTPUT.PortForward(host, port)}}/reports
    ```
  - |-
    Inspect report contents:
    ```bash
    curl -ks -u '<username>:<password>' https://{{THIS_NODE_NAME}}:{{OUTPUT.PortForward(host, port)}}/reports | grep -i flag
    ```
