manifest_version: 1
id: https_source_secret_ci
kind: flag-node-generator
name: 'HTTPS: CI Source Secret'
description: TLS CI artifact viewer exposing a build configuration file with source-level
  secrets.
hint_template: Inspect the CI build config before moving to {{NEXT_NODE_NAME}}.
runtime:
  type: docker-compose
  compose_file: docker-compose.yml
  service: generator
env:
  WEB_VARIANT_ID: https_source_secret_ci
inputs:
- name: seed
  type: string
  required: true
- name: node_name
  type: string
  required: true
- name: flag_prefix
  type: string
  required: false
- name: web_port
  type: number
  required: false
  default: 8443
artifacts:
  requires:
  - Knowledge(ip)
  produces:
  - Flag(flag_id)
  - FlagDelivery(mode)
  - FlagFile(path)
  - File(path)
  - PortForward(host
  - port)
  - Directory(host
  - path)
  - Endpoint(path)
  - Version(service)
  - SourceCode(repo)
  - ExposedSecret(service)
injects:
- site
inject_candidate_paths:
- /var/www/ci
- /srv/ci-artifacts
- /opt/builds/public
- /home/www-data/ci
access_instructions:
  title: Exposed HTTPS CI Source Secret
  steps:
  - step: 1
    title: Fetch the build configuration
    instructions: '```bash

      curl -k https://{{NODE}}:{{PORT}}/source/build_config.py

      ```

      '
  - step: 2
    title: Identify embedded secrets
    instructions: '```bash

      curl -ks https://{{NODE}}:{{PORT}}/source/build_config.py | grep -E ''SECRET|FLAG|RECOVERY''

      ```

      '
  - step: 3
    title: Record the CI secret
    instructions: Record the flag embedded in the build configuration.
hint_levels:
  low:
  - Inspect the CI build config before moving to {{NEXT_NODE_NAME}}.
  medium:
  - 'File/artifact: {{OUTPUT.File(path):basename}}'
  high:
  - Fetch the build configuration
  - Identify embedded secrets
  - 'Record the CI secret: Record the flag embedded in the build configuration.'
