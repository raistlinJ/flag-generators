manifest_version: 1
id: '71'
kind: flag-node-generator
name: 'HTTP: Upload File Drop'
description: No-login vendor intake page with upload behavior and realistic queued
  file-drop content.
hint_template: Inspect the vendor intake dropbox before moving to {{NEXT_NODE_NAME}}.
runtime:
  type: docker-compose
  compose_file: docker-compose.yml
  service: generator
env:
  WEB_VARIANT_ID: http_upload_file_drop
inputs:
- name: seed
  type: string
  required: true
- name: node_name
  type: string
  required: true
- name: flag_prefix
  type: string
  required: false
- name: web_port
  type: number
  required: false
  default: 8080
artifacts:
  requires:
  - Knowledge(ip)
  produces:
  - Flag(flag_id)
  - FlagDelivery(mode)
  - FlagFile(path)
  - File(path)
  - PortForward(host
  - port)
  - Directory(host
  - path)
  - Endpoint(path)
  - Version(service)
  - UploadPrimitive(app)
injects:
- site
inject_candidate_paths:
- /var/www/uploads
- /srv/vendor-dropbox
- /opt/intake/uploads
- /home/www-data/uploads
access_instructions:
  title: HTTP Vendor Intake Dropbox
  steps:
  - step: 1
    title: Open the upload page
    instructions: '```bash

      curl http://{{NODE}}:{{PORT}}/upload

      ```

      '
  - step: 2
    title: Submit a test note
    instructions: '```bash

      curl -d ''note=reviewed by participant'' http://{{NODE}}:{{PORT}}/upload

      ```

      '
  - step: 3
    title: Review the queued intake note
    instructions: Record the flag shown in the intake queue note.
hint_levels:
  low:
  - Inspect the vendor intake dropbox before moving to {{NEXT_NODE_NAME}}.
  medium:
  - 'File/artifact: {{OUTPUT.File(path):basename}}'
  high:
  - Open the upload page
  - Submit a test note
  - 'Review the queued intake note: Record the flag shown in the intake queue note.'
