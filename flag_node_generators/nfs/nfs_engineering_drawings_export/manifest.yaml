manifest_version: 1
id: nfs_engineering_drawings_export
kind: flag-node-generator
name: 'NFS: Engineering Drawings Export'
description: Generate an NFSv4 share with engineering drawings and a flagged revision
  note.
runtime:
  type: docker-compose
  compose_file: docker-compose.yml
  service: generator
env:
  NFS_VARIANT_ID: nfs_engineering_drawings_export
inputs:
- name: seed
  type: string
  required: true
- name: node_name
  type: string
  required: true
- name: flag_prefix
  type: string
  required: false
- name: nfs_port
  type: number
  required: false
  default: 2049
- name: Credential(user, password)
  type: string
  required: false
  flow_supply_when_first: true
artifacts:
  requires:
  - Knowledge(ip)
  optional_requires:
  - Credential(user, password)
  produces:
  - Flag(flag_id)
  - FlagDelivery(mode)
  - FlagFile(path)
  - Credential(user, password)
  - File(path)
  - PortForward(host, port)
  - Directory(host, path)
injects:
- exports
inject_candidate_paths:
- /srv/nfs/engineering
- /mnt/engineering
- /opt/shares/drawings
- /var/tmp/nfs_engineering
access_instructions:
  title: Engineering NFS Drawing Share
  steps:
  - step: 1
    title: Mount the NFS export
    instructions: 'From another Docker container in this scenario, install NFS utilities
      and mount the export:


      ```bash

      apt-get update && apt-get install -y nfs-common

      mkdir -p /mnt/engineering

      mount -t nfs4 -o vers=4,port={{PORT}} {{NODE}}:{{PATH}} /mnt/engineering

      ```

      '
    vars:
      PORT: PortForward(host, port)
      NODE: node_name
      PATH: Directory(host, path)
  - step: 2
    title: Review the exported files
    instructions: 'List the share and read the flagged artifact:


      ```bash

      ls -la /mnt/engineering

      cat /mnt/engineering/{{FLAG_FILE}}

      ```

      '
    vars:
      FLAG_FILE: FlagFile(path)
  - step: 3
    title: Record collected artifacts
    instructions: Record the recovered flag and any credential context from the share
      before continuing.
hint_levels:
  low:
  - Mount the engineering export before continuing to {{NEXT_NODE_NAME}}.
  medium:
  - 'Credential or export artifact: {{OUTPUT.Credential(user,password)}}'
  high:
  - 'Mount the NFS export: From another Docker container in this scenario, install
    NFS utilities and mount the export:'
  - 'Review the exported files: List the share and read the flagged artifact:'
  - 'Record collected artifacts: Record the recovered flag and any credential context
    from the share before continuing.'
