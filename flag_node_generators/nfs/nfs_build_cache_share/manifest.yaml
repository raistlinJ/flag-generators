manifest_version: 1
id: nfs_build_cache_share
kind: flag-node-generator
name: 'NFS: Build Cache Share'
description: Generate an NFSv4 build cache share with package metadata and a flagged
  cache manifest.
runtime:
  type: docker-compose
  compose_file: docker-compose.yml
  service: generator
env:
  NFS_VARIANT_ID: nfs_build_cache_share
inputs:
- name: seed
  type: string
  required: true
- name: node_name
  type: string
  required: true
- name: flag_prefix
  type: string
  required: false
- name: nfs_port
  type: number
  required: false
  default: 2049
artifacts:
  requires:
  - Knowledge(ip)
  optional_requires: []
  produces:
  - Flag(flag_id)
  - FlagDelivery(mode)
  - FlagFile(path)
  - Credential(user, password)
  - File(path)
  - PortForward(host, port)
  - Directory(host, path)
injects:
- exports
inject_candidate_paths:
- /srv/nfs/buildcache
- /mnt/buildcache
- /opt/build/cache
- /var/tmp/nfs_build
access_instructions:
  title: Build Cache NFS Share
  steps:
  - step: 1
    title: Mount the NFS export
    instructions: 'From another Docker container in this scenario, install NFS utilities
      and mount the export:


      ```bash

      apt-get update && apt-get install -y nfs-common

      mkdir -p /mnt/buildcache

      mount -t nfs4 -o vers=4,port={{PORT}} {{NODE}}:{{PATH}} /mnt/buildcache

      ```

      '
    vars:
      PORT: PortForward(host, port)
      NODE: node_name
      PATH: Directory(host, path)
  - step: 2
    title: Review the exported files
    instructions: 'List the share and read the flagged artifact:


      ```bash

      ls -la /mnt/buildcache

      cat /mnt/buildcache/{{FLAG_FILE}}

      ```

      '
    vars:
      FLAG_FILE: FlagFile(path)
  - step: 3
    title: Record collected artifacts
    instructions: Record the recovered flag and any credential context from the share
      before continuing.
hint_levels:
  low:
  - The build cache manifest is the useful artifact in this export.
  medium:
  - 'Credential or export artifact: {{OUTPUT.Credential(user,password)}}'
  high:
  - 'Mount the NFS export: From another Docker container in this scenario, install
    NFS utilities and mount the export:'
  - 'Review the exported files: List the share and read the flagged artifact:'
  - 'Record collected artifacts: Record the recovered flag and any credential context
    from the share before continuing.'
