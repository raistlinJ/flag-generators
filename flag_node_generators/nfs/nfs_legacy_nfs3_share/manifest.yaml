manifest_version: 1
id: nfs_legacy_nfs3_share
kind: flag-node-generator
name: 'NFS: Legacy Engineering Share'
description: Generates a legacy-style NFS share with NFSv3-compatible instructions
  and seed-based engineering files.
hint_template: Shared files can expose information beyond the public service interface.
runtime:
  type: docker-compose
  compose_file: docker-compose.yml
  service: generator
inputs:
- name: seed
  type: string
  required: true
- name: node_name
  type: string
  required: true
- name: flag_prefix
  type: string
  required: false
- name: nfs_port
  type: number
  required: false
  default: 2049
- name: mountd_port
  type: number
  required: false
  default: 20048
- name: rpcbind_port
  type: number
  required: false
  default: 11111
artifacts:
  requires:
  - Knowledge(ip)
  produces:
  - Flag(flag_id)
  - FlagDelivery(mode)
  - FlagFile(path)
  - File(path)
  - PortForward(host, port)
  - MountdPort(port)
  - RpcbindPort(port)
  - Directory(host, path)
injects:
- exports
inject_candidate_paths:
- /srv/legacy
- /opt/engineering/archive
- /var/spool/nfs
- /home/eng/share
access_instructions:
  title: Legacy NFS Engineering Share
  steps:
  - step: 1
    title: Mount with legacy NFS options
    instructions: 'Mount the export with NFSv3-style options from another Docker container:

      ```bash

      apt-get update && apt-get install -y nfs-common

      mkdir -p /mnt/legacy

      mount -t nfs -o vers=3,proto=tcp,port={{PORT}},mountport={{MOUNTD_PORT}},mountproto=tcp
      {{NODE}}:/{{PATH}} /mnt/legacy

      ```

      '
    vars:
      PORT: PortForward(host, port)
      MOUNTD_PORT: MountdPort(port)
      NODE: node_name
      PATH: Directory(host, path)
  - step: 2
    title: Search engineering archives
    instructions: 'Inspect old build logs and diagrams for the flag-bearing maintenance
      file:

      ```bash

      find /mnt/legacy -maxdepth 3 -type f -print

      cat /mnt/legacy/{{FLAG_FILE}}

      ```

      '
    vars:
      FLAG_FILE: FlagFile(path)
  - step: 3
    title: Record legacy context
    instructions: Record the flag and the legacy file path where it was found.
hint_levels:
  low:
  - Shared files can expose information beyond the public service interface.
  medium:
  - 'Service: Legacy NFS Engineering Share. Target: {{THIS_NODE_NAME}}; TCP port: {{OUTPUT.PortForward(host, port)}}.'
  - |-
    Check the assigned port:
    ```bash
    nmap -sT -sV -p {{OUTPUT.PortForward(host, port)}} {{THIS_NODE_NAME}}
    ```
  - The NFSv3 mount daemon also uses TCP port {{OUTPUT.MountdPort(port)}}.
  - 'Share or export: {{OUTPUT.Directory(host, path)}}.'
  high:
  - 'Answer: {{OUTPUT.Flag(flag_id)}}'
  - |-
    Mount with legacy NFS options:
    Mount the export with NFSv3-style options from another Docker container:
    ```bash
    apt-get update && apt-get install -y nfs-common
    mkdir -p /mnt/legacy
    mount -t nfs -o vers=3,proto=tcp,port={{OUTPUT.PortForward(host, port)}},mountport={{OUTPUT.MountdPort(port)}},mountproto=tcp {{THIS_NODE_NAME}}:{{OUTPUT.Directory(host, path)}} /mnt/legacy
    ```
  - |-
    Search engineering archives:
    Inspect old build logs and diagrams for the flag-bearing maintenance file:
    ```bash
    find /mnt/legacy -maxdepth 3 -type f -print
    cat /mnt/legacy/{{OUTPUT.FlagFile(path)}}
    ```
