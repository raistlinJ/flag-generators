manifest_version: 1
id: smb_guest_public_share
kind: flag-node-generator
name: 'SMB: Guest Public Share'
description: Guest-readable SMB-style public share with operations notes.
hint_template: Enumerate the guest share before moving to {{NEXT_NODE_NAME}}.
runtime:
  type: docker-compose
  compose_file: docker-compose.yml
  service: generator
env:
  SERVICE_VARIANT_ID: smb_guest_public_share
inputs:
- name: seed
  type: string
  required: true
- name: node_name
  type: string
  required: true
- name: flag_prefix
  type: string
  required: false
- name: service_port
  type: number
  required: false
  default: 1445
artifacts:
  requires:
  - Knowledge(ip)
  produces:
  - Flag(flag_id)
  - FlagDelivery(mode)
  - FlagFile(path)
  - File(path)
  - Directory(host, path)
  - PortForward(host, port)
  - Endpoint(path)
  - Version(service)
  - Misconfiguration(service)
injects:
- service
inject_candidate_paths:
- /srv/samba/public
- /var/smb/guest
- /opt/shares/public
- /home/share/Public
access_instructions:
  title: Guest SMB Share
  steps:
  - step: 1
    title: Connect to the SMB-style service
    instructions: '```bash

      nc {{NODE}} {{PORT}}

      ```

      '
  - step: 2
    title: Enumerate shares and fetch the note
    instructions: '```text

      SHARES

      GET {{FLAG_FILE}}

      ```

      '
  - step: 3
    title: Record the exposed note
    instructions: Record the flag from the guest-readable operations note.
hint_levels:
  low:
  - Enumerate the guest share before moving to {{NEXT_NODE_NAME}}.
  medium:
  - 'File/artifact: {{OUTPUT.File(path):basename}}'
  high:
  - Connect to the SMB-style service
  - Enumerate shares and fetch the note
  - 'Record the exposed note: Record the flag from the guest-readable operations note.'
