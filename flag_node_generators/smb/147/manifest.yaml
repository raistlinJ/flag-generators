manifest_version: 1
id: '147'
kind: flag-node-generator
name: 'SMB: Finance Quarterly Share'
description: SMB-style finance share requiring credentials and exposing a quarterly
  close note.
runtime:
  type: docker-compose
  compose_file: docker-compose.yml
  service: generator
env:
  SERVICE_VARIANT_ID: smb_finance_quarterly_share
inputs:
- name: seed
  type: string
  required: true
- name: node_name
  type: string
  required: true
- name: flag_prefix
  type: string
  required: false
- name: service_port
  type: number
  required: false
  default: 1445
- name: Credential(user, password)
  type: string
  required: true
  sensitive: true
  flow_supply_when_first: true
artifacts:
  requires:
  - Knowledge(ip)
  produces:
  - Flag(flag_id)
  - FlagDelivery(mode)
  - FlagFile(path)
  - File(path)
  - Directory(host, path)
  - PortForward(host, port)
  - Endpoint(path)
  - Version(service)
  - Credential(user, password)
  - ExposedSecret(service)
injects:
- service
inject_candidate_paths:
- /srv/samba/finance
- /var/smb/finance
- /opt/shares/finance
- /home/share/Finance
access_instructions:
  title: Finance Quarterly Share
  steps:
  - step: 1
    title: Connect to the generated service
    instructions: '```bash

      nc {{NODE}} {{PORT}}

      ```

      '
  - step: 2
    title: Enumerate and retrieve the marker
    instructions: '```text

      INFO

      AUTH {{USERNAME}} {{PASSWORD}}

      SHARES

      GET {{FLAG_FILE}}

      ```

      '
  - step: 3
    title: Record the recovered marker
    instructions: Record the flag and any credential or service context before continuing.
hint_template: Authenticate to the finance share and read the quarterly close note.
hint_levels:
  low:
  - Authenticate to the finance share and read the quarterly close note.
  medium:
  - 'Credential artifact: {{OUTPUT.Credential(user,password)}}'
  high:
  - Connect to the generated service
  - Enumerate and retrieve the marker
  - 'Record the recovered marker: Record the flag and any credential or service context
    before continuing.'
