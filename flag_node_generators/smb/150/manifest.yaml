manifest_version: 1
id: '150'
kind: flag-node-generator
name: 'SMB: Public Scanner Share'
description: Guest-readable SMB-style scanner share with a flagged scan output.
runtime:
  type: docker-compose
  compose_file: docker-compose.yml
  service: generator
env:
  SERVICE_VARIANT_ID: smb_public_scanner_share
inputs:
- name: seed
  type: string
  required: true
- name: node_name
  type: string
  required: true
- name: flag_prefix
  type: string
  required: false
- name: service_port
  type: number
  required: false
  default: 1445
artifacts:
  requires:
  - Knowledge(ip)
  produces:
  - Flag(flag_id)
  - FlagDelivery(mode)
  - FlagFile(path)
  - File(path)
  - Directory(host, path)
  - PortForward(host, port)
  - Endpoint(path)
  - Version(service)
  - Misconfiguration(service)
injects:
- service
inject_candidate_paths:
- /srv/samba/scans
- /var/smb/scans
- /opt/shares/scanner
- /home/share/Scans
access_instructions:
  title: Public Scanner Share
  steps:
  - step: 1
    title: Connect to the generated service
    instructions: '```bash

      nc {{NODE}} {{PORT}}

      ```

      '
  - step: 2
    title: Enumerate and retrieve the marker
    instructions: '```text

      INFO

      SHARES

      GET {{FLAG_FILE}}

      ```

      '
  - step: 3
    title: Record the recovered marker
    instructions: Record the flag and any credential or service context before continuing.
hint_template: Shared folders may expose internal records to an unintended reader.
hint_levels:
  low:
  - Shared folders may expose internal records to an unintended reader.
  medium:
  - 'Service: Public Scanner Share. Target: {{THIS_NODE_NAME}}; TCP port: {{OUTPUT.PortForward(host, port)}}.'
  - |-
    Check the assigned port:
    ```bash
    nmap -sT -sV -p {{OUTPUT.PortForward(host, port)}} {{THIS_NODE_NAME}}
    ```
  - This service accepts a line-oriented text protocol. Connect with nc, then enter the commands shown in the high hint in
    that same session.
  high:
  - 'Answer: {{OUTPUT.Flag(flag_id)}}'
  - |-
    Connect to the generated service:
    ```bash
    nc {{THIS_NODE_NAME}} {{OUTPUT.PortForward(host, port)}}
    ```
  - |-
    Enumerate and retrieve the marker:
    ```text
    INFO
    SHARES
    GET {{OUTPUT.FlagFile(path)}}
    ```
