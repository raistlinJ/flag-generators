manifest_version: 1
id: '39'
kind: flag-node-generator
name: 'Git: Deploy Key Repository'
description: Credentialed Git-style deploy repository with an API key and recovery
  flag.
hint_template: Use the deploy repo credentials before moving to {{NEXT_NODE_NAME}}.
runtime:
  type: docker-compose
  compose_file: docker-compose.yml
  service: generator
env:
  SERVICE_VARIANT_ID: git_deploy_key_repo
inputs:
- name: seed
  type: string
  required: true
- name: node_name
  type: string
  required: true
- name: flag_prefix
  type: string
  required: false
- name: service_port
  type: number
  required: false
  default: 19418
- name: Credential(user
  password): null
  type: string
  required: false
  sensitive: true
  flow_supply_when_first: true
artifacts:
  requires:
  - Knowledge(ip)
  optional_requires:
  - Credential(user
  - password)
  produces:
  - Flag(flag_id)
  - FlagDelivery(mode)
  - FlagFile(path)
  - Credential(user
  - password)
  - File(path)
  - Directory(host
  - path)
  - PortForward(host
  - port)
  - Endpoint(path)
  - Version(service)
  - SourceCode(repo)
  - APIKey(service)
injects:
- service
inject_candidate_paths:
- /srv/git/deploy.git
- /var/www/git/deploy
- /opt/git/deploy
- /home/git/repositories/deploy.git
access_instructions:
  title: Deploy Git-Style Repository
  steps:
  - step: 1
    title: Connect to the Git-style service
    instructions: '```bash

      nc {{NODE}} {{PORT}}

      ```

      '
  - step: 2
    title: Authenticate and read deploy material
    instructions: '```text

      AUTH {{USERNAME}} {{PASSWORD}}

      LIST

      GET {{FLAG_FILE}}

      ```

      '
  - step: 3
    title: Record the deploy marker
    instructions: Record the flag and API key from the deploy environment file.
hint_levels:
  low:
  - Use the deploy repo credentials before moving to {{NEXT_NODE_NAME}}.
  medium:
  - 'Credential artifact: {{OUTPUT.Credential(user,password)}}'
  high:
  - Connect to the Git-style service
  - Authenticate and read deploy material
  - 'Record the deploy marker: Record the flag and API key from the deploy environment
    file.'
