manifest_version: 1
id: ftp_anonymous_finance_drop
kind: flag-node-generator
name: 'FTP: Anonymous Finance Drop'
description: Anonymous FTP-style finance handoff service with exposed close packet
  files.
hint_template: Inspect the files exposed through the transfer service.
runtime:
  type: docker-compose
  compose_file: docker-compose.yml
  service: generator
env:
  SERVICE_VARIANT_ID: ftp_anonymous_finance_drop
inputs:
- name: seed
  type: string
  required: true
- name: node_name
  type: string
  required: true
- name: flag_prefix
  type: string
  required: false
- name: service_port
  type: number
  required: false
  default: 2121
artifacts:
  requires:
  - Knowledge(ip)
  produces:
  - Flag(flag_id)
  - FlagDelivery(mode)
  - FlagFile(path)
  - File(path)
  - Directory(host, path)
  - PortForward(host, port)
  - Endpoint(path)
  - Version(service)
  - Misconfiguration(service)
  - ExposedSecret(service)
injects:
- service
inject_candidate_paths:
- /srv/ftp
- /var/ftp/pub
- /opt/finance/drop
- /home/ftp/finance
access_instructions:
  title: Anonymous FTP Drop
  steps:
  - step: 1
    title: Connect to the FTP-style service
    instructions: '```bash

      nc {{NODE}} {{PORT}}

      ```

      '
  - step: 2
    title: List and retrieve the finance packet
    instructions: '```text

      LIST

      GET {{FLAG_FILE}}

      ```

      '
  - step: 3
    title: Record the exposed marker
    instructions: Record the flag from the finance close packet.
hint_levels:
  low:
  - Inspect the files exposed through the transfer service.
  medium:
  - 'Service: Anonymous FTP Drop. Target: {{THIS_NODE_NAME}}; TCP port: {{OUTPUT.PortForward(host, port)}}.'
  - |-
    Check the assigned port:
    ```bash
    nmap -sT -sV -p {{OUTPUT.PortForward(host, port)}} {{THIS_NODE_NAME}}
    ```
  - This service accepts a line-oriented text protocol. Connect with nc, then enter the commands shown in the high hint in
    that same session.
  high:
  - 'Answer: {{OUTPUT.Flag(flag_id)}}'
  - |-
    Connect to the FTP-style service:
    ```bash
    nc {{THIS_NODE_NAME}} {{OUTPUT.PortForward(host, port)}}
    ```
  - |-
    List and retrieve the finance packet:
    ```text
    LIST
    GET {{OUTPUT.FlagFile(path)}}
    ```
