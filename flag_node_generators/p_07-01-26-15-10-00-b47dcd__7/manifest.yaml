manifest_version: 1
id: '7'
kind: flag-node-generator
name: 'SSH: Password Finance Terminal'
description: Password-authenticated SSH node with finance records, ledgers, and reconciliation
  exports.
hint_template: Review finance terminal records before moving to {{NEXT_NODE_NAME}}.
runtime:
  type: docker-compose
  compose_file: docker-compose.yml
  service: generator
env:
  SSH_VARIANT_ID: ssh_password_finance_terminal
inputs:
- name: seed
  type: string
  required: true
- name: node_name
  type: string
  required: true
- name: flag_prefix
  type: string
  required: false
- name: ssh_port
  type: number
  required: false
  default: 2222
- name: Credential(user, password)
  type: string
  required: true
  flow_supply_when_first: true
artifacts:
  requires:
  - Knowledge(ip)
  - Credential(user, password)
  produces:
  - Flag(flag_id)
  - FlagDelivery(mode)
  - FlagFile(path)
  - Credential(user, password)
  - File(path)
  - PortForward(host, port)
  - Directory(host, path)
injects:
- workspace
inject_candidate_paths:
- /home/finance/reconciliations
- /opt/accounting/export
- /var/tmp/finance_drop
- /srv/finance-terminal
access_instructions:
  title: Password SSH Finance Terminal
  steps:
  - step: 1
    title: SSH into the finance account
    instructions: '```bash

      ssh -p {{PORT}} {{USERNAME}}@{{NODE}}

      ```

      Use password `{{PASSWORD}}`.

      '
  - step: 2
    title: Search reconciliation records
    instructions: '```bash

      find ~/finance -maxdepth 3 -type f -print

      cat ~/{{FLAG_FILE}}

      ```

      '
  - step: 3
    title: Record accounting evidence
    instructions: Record the flag and the reconciliation filename.
hint_levels:
  low:
  - Review finance terminal records before moving to {{NEXT_NODE_NAME}}.
  medium:
  - 'Credential artifact: {{OUTPUT.Credential(user,password)}}'
  high:
  - 'SSH into the finance account: Use password {{PASSWORD}}.'
  - Search reconciliation records
  - 'Record accounting evidence: Record the flag and the reconciliation filename.'
