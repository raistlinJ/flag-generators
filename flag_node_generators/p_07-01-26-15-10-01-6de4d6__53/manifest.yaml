manifest_version: 1
id: '53'
kind: flag-node-generator
name: 'Dependency Consumer: Checksum Evidence Gate'
description: Consumes a Checksum(sha256) artifact to unlock an evidence download.
hint_template: Use the prior checksum at the evidence gate on {{NODE}} @ {{NODE_IP}}.
runtime:
  type: docker-compose
  compose_file: docker-compose.yml
  service: generator
env:
  DEPENDENCY_CONSUMER_VARIANT_ID: dep_checksum_evidence_gate
inputs:
- name: seed
  type: string
  required: true
- name: node_name
  type: string
  required: true
- name: flag_prefix
  type: string
  required: false
- name: web_port
  type: number
  required: false
- name: Checksum(sha256)
  type: string
  required: true
  flow_supply_when_first: true
artifacts:
  requires:
  - Knowledge(ip)
  - Checksum(sha256)
  produces:
  - Flag(flag_id)
  - FlagDelivery(mode)
  - FlagFile(path)
  - File(path)
  - Checksum(sha256)
  - PortForward(host, port)
  - Directory(host, path)
  - Endpoint(path)
  - Version(service)
injects:
- site
inject_candidate_paths:
- /opt/dependency-consumers/checksum
- /srv/evidence
- /var/www/evidence
access_instructions:
  title: Checksum Evidence Gate
  steps:
  - step: 1
    title: Present the checksum
    instructions: Provide the previous `Checksum(sha256)` as `sha256` or `X-Checksum-SHA256`.
hint_levels:
  low:
  - Use the prior checksum at the evidence gate on {{NODE}} @ {{NODE_IP}}.
  medium:
  - 'File/artifact: {{OUTPUT.File(path):basename}}'
  high:
  - 'Present the checksum: Provide the previous Checksum(sha256) as sha256 or X-Checksum-SHA256.'
