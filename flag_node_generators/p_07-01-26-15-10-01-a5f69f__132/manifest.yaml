manifest_version: 1
id: '132'
kind: flag-node-generator
name: 'Cache: Redis ACL Token Store'
description: Redis-style cache fixture requiring credentials and exposing an ACL token
  key.
runtime:
  type: docker-compose
  compose_file: docker-compose.yml
  service: generator
env:
  SERVICE_VARIANT_ID: cache_redis_acl_tokens
inputs:
- name: seed
  type: string
  required: true
- name: node_name
  type: string
  required: true
- name: flag_prefix
  type: string
  required: false
- name: service_port
  type: number
  required: false
  default: 16379
- name: Credential(user, password)
  type: string
  required: true
  sensitive: true
  flow_supply_when_first: true
artifacts:
  requires:
  - Knowledge(ip)
  produces:
  - Flag(flag_id)
  - FlagDelivery(mode)
  - FlagFile(path)
  - File(path)
  - Directory(host, path)
  - PortForward(host, port)
  - Endpoint(path)
  - Version(service)
  - Credential(user, password)
  - Token(service)
  - ExposedSecret(service)
injects:
- service
inject_candidate_paths:
- /var/lib/redis/acl
- /srv/cache/redis_acl
- /opt/cache/redis
- /tmp/redis_acl
access_instructions:
  title: Redis ACL Token Store
  steps:
  - step: 1
    title: Connect to the generated service
    instructions: '```bash

      nc {{NODE}} {{PORT}}

      ```

      '
  - step: 2
    title: Enumerate and retrieve the marker
    instructions: '```text

      INFO

      AUTH {{USERNAME}} {{PASSWORD}}

      KEYS *

      GET {{FLAG_FILE}}

      ```

      '
  - step: 3
    title: Record the recovered marker
    instructions: Record the flag and any credential or service context before continuing.
hint_template: Authenticate to the Redis-style cache and inspect the ACL token key.
hint_levels:
  low:
  - Authenticate to the Redis-style cache and inspect the ACL token key.
  medium:
  - 'Credential artifact: {{OUTPUT.Credential(user,password)}}'
  high:
  - Connect to the generated service
  - Enumerate and retrieve the marker
  - 'Record the recovered marker: Record the flag and any credential or service context
    before continuing.'
