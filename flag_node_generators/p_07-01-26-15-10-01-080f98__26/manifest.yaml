manifest_version: 1
id: '26'
kind: flag-node-generator
name: 'DNS: SRV Admin Endpoint'
description: DNS fixture with SRV records pointing to an administrative endpoint and
  a flagged TXT note.
runtime:
  type: docker-compose
  compose_file: docker-compose.yml
  service: generator
env:
  SERVICE_VARIANT_ID: dns_srv_admin_endpoint
inputs:
- name: seed
  type: string
  required: true
- name: node_name
  type: string
  required: true
- name: flag_prefix
  type: string
  required: false
- name: service_port
  type: number
  required: false
  default: 1053
artifacts:
  requires:
  - Knowledge(ip)
  produces:
  - Flag(flag_id)
  - FlagDelivery(mode)
  - FlagFile(path)
  - File(path)
  - Directory(host, path)
  - PortForward(host, port)
  - Endpoint(path)
  - Version(service)
  - Hostname(host)
  - Misconfiguration(service)
injects:
- service
inject_candidate_paths:
- /etc/bind/admin
- /srv/dns/admin
- /var/lib/named/admin
- /opt/dns/admin
access_instructions:
  title: SRV Admin Endpoint
  steps:
  - step: 1
    title: Connect to the generated service
    instructions: '```bash

      nc {{NODE}} {{PORT}}

      ```

      '
  - step: 2
    title: Enumerate and retrieve the marker
    instructions: '```text

      INFO

      TXT {{FLAG_FILE}}

      GET {{FLAG_FILE}}

      ```

      '
  - step: 3
    title: Record the recovered marker
    instructions: Record the flag and any credential or service context before continuing.
hint_template: Review the SRV record and nearby TXT note in the zone export.
hint_levels:
  low:
  - Review the SRV record and nearby TXT note in the zone export.
  medium:
  - 'File/artifact: {{OUTPUT.File(path):basename}}'
  high:
  - Connect to the generated service
  - Enumerate and retrieve the marker
  - 'Record the recovered marker: Record the flag and any credential or service context
    before continuing.'
