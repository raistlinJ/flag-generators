manifest_version: 1
id: '49'
kind: flag-node-generator
name: 'FTP: Anonymous Finance Drop'
description: Anonymous FTP-style finance handoff service with exposed close packet
  files.
hint_template: Check the anonymous FTP drop before moving to {{NEXT_NODE_NAME}}.
runtime:
  type: docker-compose
  compose_file: docker-compose.yml
  service: generator
env:
  SERVICE_VARIANT_ID: ftp_anonymous_finance_drop
inputs:
- name: seed
  type: string
  required: true
- name: node_name
  type: string
  required: true
- name: flag_prefix
  type: string
  required: false
- name: service_port
  type: number
  required: false
  default: 2121
artifacts:
  requires:
  - Knowledge(ip)
  produces:
  - Flag(flag_id)
  - FlagDelivery(mode)
  - FlagFile(path)
  - File(path)
  - Directory(host
  - path)
  - PortForward(host
  - port)
  - Endpoint(path)
  - Version(service)
  - Misconfiguration(service)
  - ExposedSecret(service)
injects:
- service
inject_candidate_paths:
- /srv/ftp
- /var/ftp/pub
- /opt/finance/drop
- /home/ftp/finance
access_instructions:
  title: Anonymous FTP Drop
  steps:
  - step: 1
    title: Connect to the FTP-style service
    instructions: '```bash

      nc {{NODE}} {{PORT}}

      ```

      '
  - step: 2
    title: List and retrieve the finance packet
    instructions: '```text

      LIST

      GET {{FLAG_FILE}}

      ```

      '
  - step: 3
    title: Record the exposed marker
    instructions: Record the flag from the finance close packet.
hint_levels:
  low:
  - Check the anonymous FTP drop before moving to {{NEXT_NODE_NAME}}.
  medium:
  - 'File/artifact: {{OUTPUT.File(path):basename}}'
  high:
  - Connect to the FTP-style service
  - List and retrieve the finance packet
  - 'Record the exposed marker: Record the flag from the finance close packet.'
