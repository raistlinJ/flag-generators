manifest_version: 1
id: '68'
kind: flag-node-generator
name: 'HTTP: Source Secret Repository'
description: No-login HTTP code browser where a source file contains an embedded secret
  and flag.
hint_template: Review the exposed source before moving to {{NEXT_NODE_NAME}}.
runtime:
  type: docker-compose
  compose_file: docker-compose.yml
  service: generator
env:
  WEB_VARIANT_ID: http_source_secret_repo
inputs:
- name: seed
  type: string
  required: true
- name: node_name
  type: string
  required: true
- name: flag_prefix
  type: string
  required: false
- name: web_port
  type: number
  required: false
  default: 8080
artifacts:
  requires:
  - Knowledge(ip)
  produces:
  - Flag(flag_id)
  - FlagDelivery(mode)
  - FlagFile(path)
  - File(path)
  - PortForward(host
  - port)
  - Directory(host
  - path)
  - Endpoint(path)
  - Version(service)
  - SourceCode(repo)
  - ExposedSecret(service)
injects:
- site
inject_candidate_paths:
- /var/www/source
- /srv/source-browser
- /opt/code-mirror
- /home/www-data/source
access_instructions:
  title: Exposed HTTP Source Secret
  steps:
  - step: 1
    title: Open the code browser
    instructions: '```bash

      curl http://{{NODE}}:{{PORT}}/source/app.py

      ```

      '
  - step: 2
    title: Search for embedded secrets
    instructions: '```bash

      curl -s http://{{NODE}}:{{PORT}}/source/app.py | grep -E ''SECRET|FLAG|RECOVERY''

      ```

      '
  - step: 3
    title: Record the source secret
    instructions: Record the flag embedded in the mirrored source file.
hint_levels:
  low:
  - Review the exposed source before moving to {{NEXT_NODE_NAME}}.
  medium:
  - 'File/artifact: {{OUTPUT.File(path):basename}}'
  high:
  - Open the code browser
  - Search for embedded secrets
  - 'Record the source secret: Record the flag embedded in the mirrored source file.'
