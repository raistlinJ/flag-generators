manifest_version: 1
id: '73'
kind: flag-node-generator
name: 'Dependency Consumer: WebAuth Bypass Console'
description: Consumes a WebAuthBypass(app) artifact to expose an admin console and
  API key.
hint_template: Apply the prior web-auth bypass marker on {{NODE}} @ {{NODE_IP}}.
runtime:
  type: docker-compose
  compose_file: docker-compose.yml
  service: generator
env:
  DEPENDENCY_CONSUMER_VARIANT_ID: dep_webauth_bypass_console
inputs:
- name: seed
  type: string
  required: true
- name: node_name
  type: string
  required: true
- name: flag_prefix
  type: string
  required: false
- name: web_port
  type: number
  required: false
- name: WebAuthBypass(app)
  type: string
  required: true
  flow_supply_when_first: true
artifacts:
  requires:
  - Knowledge(ip)
  - WebAuthBypass(app)
  produces:
  - Flag(flag_id)
  - FlagDelivery(mode)
  - FlagFile(path)
  - File(path)
  - Checksum(sha256)
  - PortForward(host, port)
  - Directory(host, path)
  - Endpoint(path)
  - Version(service)
  - APIKey(service)
injects:
- site
inject_candidate_paths:
- /opt/dependency-consumers/bypass
- /srv/admin-bypass
- /var/www/admin
access_instructions:
  title: WebAuth Bypass Console
  steps:
  - step: 1
    title: Apply the bypass marker
    instructions: Provide the previous `WebAuthBypass(app)` as `bypass` or `X-Auth-Bypass`.
hint_levels:
  low:
  - Apply the prior web-auth bypass marker on {{NODE}} @ {{NODE_IP}}.
  medium:
  - 'File/artifact: {{OUTPUT.File(path):basename}}'
  high:
  - 'Apply the bypass marker: Provide the previous WebAuthBypass(app) as bypass or
    X-Auth-Bypass.'
