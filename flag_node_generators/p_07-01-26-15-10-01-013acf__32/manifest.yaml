manifest_version: 1
id: '32'
kind: flag-node-generator
name: 'Mail: IMAP Archive Mailbox'
description: IMAP-style mailbox requiring credentials and exposing an archived handoff
  message.
runtime:
  type: docker-compose
  compose_file: docker-compose.yml
  service: generator
env:
  SERVICE_VARIANT_ID: mail_imap_archive_mailbox
inputs:
- name: seed
  type: string
  required: true
- name: node_name
  type: string
  required: true
- name: flag_prefix
  type: string
  required: false
- name: service_port
  type: number
  required: false
  default: 2143
- name: Credential(user, password)
  type: string
  required: true
  sensitive: true
  flow_supply_when_first: true
artifacts:
  requires:
  - Knowledge(ip)
  produces:
  - Flag(flag_id)
  - FlagDelivery(mode)
  - FlagFile(path)
  - File(path)
  - Directory(host, path)
  - PortForward(host, port)
  - Endpoint(path)
  - Version(service)
  - Credential(user, password)
  - ExposedSecret(service)
injects:
- service
inject_candidate_paths:
- /var/mail/archive
- /srv/mail/imap_archive
- /opt/mail/archive
- /tmp/mail_archive
access_instructions:
  title: IMAP Archive Mailbox
  steps:
  - step: 1
    title: Connect to the generated service
    instructions: '```bash

      nc {{NODE}} {{PORT}}

      ```

      '
  - step: 2
    title: Enumerate and retrieve the marker
    instructions: '```text

      INFO

      AUTH {{USERNAME}} {{PASSWORD}}

      FETCH {{FLAG_FILE}}

      GET {{FLAG_FILE}}

      ```

      '
  - step: 3
    title: Record the recovered marker
    instructions: Record the flag and any credential or service context before continuing.
hint_template: Authenticate to the IMAP-style mailbox and fetch the archived handoff
  message.
hint_levels:
  low:
  - Authenticate to the IMAP-style mailbox and fetch the archived handoff message.
  medium:
  - 'Credential artifact: {{OUTPUT.Credential(user,password)}}'
  high:
  - Connect to the generated service
  - Enumerate and retrieve the marker
  - 'Record the recovered marker: Record the flag and any credential or service context
    before continuing.'
