manifest_version: 1
id: '45'
kind: flag-node-generator
name: 'LDAP: Anonymous Directory'
description: LDAP-style directory allowing anonymous search of service account metadata.
hint_template: Search the anonymous LDAP-style directory before moving to {{NEXT_NODE_NAME}}.
runtime:
  type: docker-compose
  compose_file: docker-compose.yml
  service: generator
env:
  SERVICE_VARIANT_ID: ldap_anonymous_directory
inputs:
- name: seed
  type: string
  required: true
- name: node_name
  type: string
  required: true
- name: flag_prefix
  type: string
  required: false
- name: service_port
  type: number
  required: false
  default: 1389
artifacts:
  requires:
  - Knowledge(ip)
  produces:
  - Flag(flag_id)
  - FlagDelivery(mode)
  - FlagFile(path)
  - File(path)
  - Directory(host
  - path)
  - PortForward(host
  - port)
  - Endpoint(path)
  - Version(service)
  - Misconfiguration(service)
injects:
- service
inject_candidate_paths:
- /etc/ldap/slapd.d
- /var/lib/ldap
- /srv/ldap/public
- /opt/directory/anonymous
access_instructions:
  title: Anonymous LDAP-Style Directory
  steps:
  - step: 1
    title: Connect to the directory service
    instructions: '```bash

      nc {{NODE}} {{PORT}}

      ```

      '
  - step: 2
    title: Search the directory
    instructions: '```text

      SEARCH ou=People,dc=lab,dc=local

      GET {{FLAG_FILE}}

      ```

      '
  - step: 3
    title: Record the directory marker
    instructions: Record the flag from the anonymous directory entry.
hint_levels:
  low:
  - Search the anonymous LDAP-style directory before moving to {{NEXT_NODE_NAME}}.
  medium:
  - 'File/artifact: {{OUTPUT.File(path):basename}}'
  high:
  - Connect to the directory service
  - Search the directory
  - 'Record the directory marker: Record the flag from the anonymous directory entry.'
