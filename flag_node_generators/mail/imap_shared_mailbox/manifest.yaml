manifest_version: 1
id: imap_shared_mailbox
kind: flag-node-generator
name: 'Mail: Shared IMAP Mailbox'
description: Credentialed IMAP-style shared mailbox with realistic message files.
hint_template: Use the mailbox credentials before moving to {{NEXT_NODE_NAME}}.
runtime:
  type: docker-compose
  compose_file: docker-compose.yml
  service: generator
env:
  SERVICE_VARIANT_ID: imap_shared_mailbox
inputs:
- name: seed
  type: string
  required: true
- name: node_name
  type: string
  required: true
- name: flag_prefix
  type: string
  required: false
- name: service_port
  type: number
  required: false
  default: 2143
- name: Credential(user, password)
  type: string
  required: false
  sensitive: true
  flow_supply_when_first: true
artifacts:
  requires:
  - Knowledge(ip)
  optional_requires:
  - Credential(user, password)
  produces:
  - Flag(flag_id)
  - FlagDelivery(mode)
  - FlagFile(path)
  - Credential(user, password)
  - File(path)
  - Directory(host, path)
  - PortForward(host, port)
  - Endpoint(path)
  - Version(service)
injects:
- service
inject_candidate_paths:
- /var/mail/shared
- /srv/imap/shared
- /opt/mailboxes/facilities
- /home/mailbox/INBOX
access_instructions:
  title: Shared IMAP-Style Mailbox
  steps:
  - step: 1
    title: Connect to the mailbox service
    instructions: '```bash

      nc {{NODE}} {{PORT}}

      ```

      '
  - step: 2
    title: Login and fetch the message
    instructions: '```text

      LOGIN {{USERNAME}} {{PASSWORD}}

      FETCH 4

      GET {{FLAG_FILE}}

      ```

      '
  - step: 3
    title: Record the mailbox marker
    instructions: Record the flag from the shared mailbox message.
hint_levels:
  low:
  - Use the mailbox credentials before moving to {{NEXT_NODE_NAME}}.
  medium:
  - 'Credential artifact: {{OUTPUT.Credential(user,password)}}'
  high:
  - Connect to the mailbox service
  - Login and fetch the message
  - 'Record the mailbox marker: Record the flag from the shared mailbox message.'
