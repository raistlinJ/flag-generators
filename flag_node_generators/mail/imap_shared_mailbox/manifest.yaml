manifest_version: 1
id: imap_shared_mailbox
kind: flag-node-generator
name: 'Mail: Shared IMAP Mailbox'
description: Credentialed IMAP-style shared mailbox with realistic message files.
hint_template: Retained messages can contain handoff notes and access details.
runtime:
  type: docker-compose
  compose_file: docker-compose.yml
  service: generator
env:
  SERVICE_VARIANT_ID: imap_shared_mailbox
inputs:
- name: seed
  type: string
  required: true
- name: node_name
  type: string
  required: true
- name: flag_prefix
  type: string
  required: false
- name: service_port
  type: number
  required: false
  default: 2143
- name: Credential(user, password)
  type: string
  required: false
  sensitive: true
  flow_supply_when_first: true
artifacts:
  requires:
  - Knowledge(ip)
  optional_requires:
  - Credential(user, password)
  produces:
  - Flag(flag_id)
  - FlagDelivery(mode)
  - FlagFile(path)
  - Credential(user, password)
  - File(path)
  - Directory(host, path)
  - PortForward(host, port)
  - Endpoint(path)
  - Version(service)
injects:
- service
inject_candidate_paths:
- /var/mail/shared
- /srv/imap/shared
- /opt/mailboxes/facilities
- /home/mailbox/INBOX
access_instructions:
  title: Shared IMAP-Style Mailbox
  steps:
  - step: 1
    title: Connect to the mailbox service
    instructions: '```bash

      nc {{NODE}} {{PORT}}

      ```

      '
  - step: 2
    title: Login and fetch the message
    instructions: '```text

      LOGIN {{USERNAME}} {{PASSWORD}}

      FETCH 4

      GET {{FLAG_FILE}}

      ```

      '
  - step: 3
    title: Record the mailbox marker
    instructions: Record the flag from the shared mailbox message.
hint_levels:
  low:
  - Retained messages can contain handoff notes and access details.
  medium:
  - 'Service: Shared IMAP-Style Mailbox. Target: {{THIS_NODE_NAME}}; TCP port: {{OUTPUT.PortForward(host, port)}}.'
  - |-
    Check the assigned port:
    ```bash
    nmap -sT -sV -p {{OUTPUT.PortForward(host, port)}} {{THIS_NODE_NAME}}
    ```
  - This service accepts a line-oriented text protocol. Connect with nc, then enter the commands shown in the high hint in
    that same session.
  high:
  - 'Answer: {{OUTPUT.Flag(flag_id)}}'
  - 'Credential (user:password): {{OUTPUT.Credential(user, password)}}. Replace <username> and <password> in the commands
    with these two components.'
  - |-
    Connect to the mailbox service:
    ```bash
    nc {{THIS_NODE_NAME}} {{OUTPUT.PortForward(host, port)}}
    ```
  - |-
    Login and fetch the message:
    ```text
    LOGIN <username> <password>
    FETCH 4
    GET {{OUTPUT.FlagFile(path)}}
    ```
