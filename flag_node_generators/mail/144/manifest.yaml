manifest_version: 1
id: '144'
kind: flag-node-generator
name: 'Mail: POP3 Shared Dropbox'
description: POP3-style shared mailbox requiring credentials and exposing a flagged
  dropbox message.
runtime:
  type: docker-compose
  compose_file: docker-compose.yml
  service: generator
env:
  SERVICE_VARIANT_ID: mail_pop3_shared_dropbox
inputs:
- name: seed
  type: string
  required: true
- name: node_name
  type: string
  required: true
- name: flag_prefix
  type: string
  required: false
- name: service_port
  type: number
  required: false
  default: 2110
- name: Credential(user, password)
  type: string
  required: false
  sensitive: true
  flow_supply_when_first: true
artifacts:
  requires:
  - Knowledge(ip)
  produces:
  - Flag(flag_id)
  - FlagDelivery(mode)
  - FlagFile(path)
  - File(path)
  - Directory(host, path)
  - PortForward(host, port)
  - Endpoint(path)
  - Version(service)
  - Credential(user, password)
  - ExposedSecret(service)
injects:
- service
inject_candidate_paths:
- /var/mail/dropbox
- /srv/mail/pop3
- /opt/mail/dropbox
- /tmp/pop3_dropbox
access_instructions:
  title: POP3 Shared Dropbox
  steps:
  - step: 1
    title: Connect to the generated service
    instructions: '```bash

      nc {{NODE}} {{PORT}}

      ```

      '
  - step: 2
    title: Enumerate and retrieve the marker
    instructions: '```text

      INFO

      AUTH {{USERNAME}} {{PASSWORD}}

      LIST

      GET {{FLAG_FILE}}

      ```

      '
  - step: 3
    title: Record the recovered marker
    instructions: Record the flag and any credential or service context before continuing.
hint_template: Authenticate, list the mailbox, and retrieve the dropbox message.
hint_levels:
  low:
  - Authenticate, list the mailbox, and retrieve the dropbox message.
  medium:
  - 'Credential artifact: {{OUTPUT.Credential(user,password)}}'
  high:
  - Connect to the generated service
  - Enumerate and retrieve the marker
  - 'Record the recovered marker: Record the flag and any credential or service context
    before continuing.'
