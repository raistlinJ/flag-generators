manifest_version: 1
id: '57'
kind: flag-node-generator
name: 'Dependency Consumer: File Parser Console'
description: Consumes a File(path) artifact and emits a parsed API key.
hint_template: Feed the prior file path to the parser on {{NODE}} @ {{NODE_IP}}.
runtime:
  type: docker-compose
  compose_file: docker-compose.yml
  service: generator
env:
  DEPENDENCY_CONSUMER_VARIANT_ID: dep_file_parser_console
inputs:
- name: seed
  type: string
  required: true
- name: node_name
  type: string
  required: true
- name: flag_prefix
  type: string
  required: false
- name: web_port
  type: number
  required: false
- name: File(path)
  type: file
  required: true
  flow_supply_when_first: true
artifacts:
  requires:
  - Knowledge(ip)
  - File(path)
  produces:
  - Flag(flag_id)
  - FlagDelivery(mode)
  - FlagFile(path)
  - File(path)
  - Checksum(sha256)
  - PortForward(host, port)
  - Directory(host, path)
  - Endpoint(path)
  - Version(service)
  - APIKey(service)
injects:
- site
inject_candidate_paths:
- /opt/dependency-consumers/parser
- /srv/parser/workspace
- /var/www/parser
access_instructions:
  title: File Parser Console
  steps:
  - step: 1
    title: Submit the file path
    instructions: Provide the previous `File(path)` value as `file` or `X-File-Path`.
hint_levels:
  low:
  - Feed the prior file path to the parser on {{NODE}} @ {{NODE_IP}}.
  medium:
  - 'File/artifact: {{OUTPUT.File(path):basename}}'
  high:
  - 'Submit the file path: Provide the previous File(path) value as file or X-File-Path.'
