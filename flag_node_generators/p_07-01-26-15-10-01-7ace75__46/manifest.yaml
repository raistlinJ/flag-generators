manifest_version: 1
id: '46'
kind: flag-node-generator
name: 'LDAP: Service Account Bind'
description: Credentialed LDAP-style bind challenge with service-note directory records.
hint_template: Bind to the LDAP-style service before moving to {{NEXT_NODE_NAME}}.
runtime:
  type: docker-compose
  compose_file: docker-compose.yml
  service: generator
env:
  SERVICE_VARIANT_ID: ldap_bind_service_account
inputs:
- name: seed
  type: string
  required: true
- name: node_name
  type: string
  required: true
- name: flag_prefix
  type: string
  required: false
- name: service_port
  type: number
  required: false
  default: 1389
- name: Credential(user
  password): null
  type: string
  required: false
  sensitive: true
  flow_supply_when_first: true
artifacts:
  requires:
  - Knowledge(ip)
  optional_requires:
  - Credential(user
  - password)
  produces:
  - Flag(flag_id)
  - FlagDelivery(mode)
  - FlagFile(path)
  - Credential(user
  - password)
  - File(path)
  - Directory(host
  - path)
  - PortForward(host
  - port)
  - Endpoint(path)
  - Version(service)
  - ExposedSecret(service)
injects:
- service
inject_candidate_paths:
- /etc/ldap/service
- /var/lib/ldap/private
- /srv/ldap/service-account
- /opt/directory/bind
access_instructions:
  title: LDAP-Style Service Bind
  steps:
  - step: 1
    title: Connect to the directory service
    instructions: '```bash

      nc {{NODE}} {{PORT}}

      ```

      '
  - step: 2
    title: Bind and search service notes
    instructions: '```text

      BIND {{USERNAME}} {{PASSWORD}}

      SEARCH cn=service-notes,dc=lab,dc=local

      GET {{FLAG_FILE}}

      ```

      '
  - step: 3
    title: Record the directory finding
    instructions: Record the flag from the bound directory record.
hint_levels:
  low:
  - Bind to the LDAP-style service before moving to {{NEXT_NODE_NAME}}.
  medium:
  - 'Credential artifact: {{OUTPUT.Credential(user,password)}}'
  high:
  - Connect to the directory service
  - Bind and search service notes
  - 'Record the directory finding: Record the flag from the bound directory record.'
