manifest_version: 1
id: '20'
kind: flag-node-generator
name: 'SMB: Engineering Build Drop'
description: Guest-readable SMB-style engineering build drop with a flagged release
  note.
runtime:
  type: docker-compose
  compose_file: docker-compose.yml
  service: generator
env:
  SERVICE_VARIANT_ID: smb_engineering_build_drop
inputs:
- name: seed
  type: string
  required: true
- name: node_name
  type: string
  required: true
- name: flag_prefix
  type: string
  required: false
- name: service_port
  type: number
  required: false
  default: 1445
artifacts:
  requires:
  - Knowledge(ip)
  produces:
  - Flag(flag_id)
  - FlagDelivery(mode)
  - FlagFile(path)
  - File(path)
  - Directory(host, path)
  - PortForward(host, port)
  - Endpoint(path)
  - Version(service)
  - Misconfiguration(service)
injects:
- service
inject_candidate_paths:
- /srv/samba/builds
- /var/smb/builds
- /opt/shares/builds
- /home/share/Builds
access_instructions:
  title: Engineering Build Drop
  steps:
  - step: 1
    title: Connect to the generated service
    instructions: '```bash

      nc {{NODE}} {{PORT}}

      ```

      '
  - step: 2
    title: Enumerate and retrieve the marker
    instructions: '```text

      INFO

      SHARES

      GET {{FLAG_FILE}}

      ```

      '
  - step: 3
    title: Record the recovered marker
    instructions: Record the flag and any credential or service context before continuing.
hint_template: Enumerate the guest-readable build drop and inspect release notes.
hint_levels:
  low:
  - Enumerate the guest-readable build drop and inspect release notes.
  medium:
  - 'File/artifact: {{OUTPUT.File(path):basename}}'
  high:
  - Connect to the generated service
  - Enumerate and retrieve the marker
  - 'Record the recovered marker: Record the flag and any credential or service context
    before continuing.'
