manifest_version: 1
id: '139'
kind: flag-node-generator
name: 'DNS: Reverse Zone Note'
description: DNS reverse-zone fixture with a PTR side note carrying the generated
  flag.
runtime:
  type: docker-compose
  compose_file: docker-compose.yml
  service: generator
env:
  SERVICE_VARIANT_ID: dns_reverse_zone_note
inputs:
- name: seed
  type: string
  required: true
- name: node_name
  type: string
  required: true
- name: flag_prefix
  type: string
  required: false
- name: service_port
  type: number
  required: false
  default: 1053
artifacts:
  requires:
  - Knowledge(ip)
  produces:
  - Flag(flag_id)
  - FlagDelivery(mode)
  - FlagFile(path)
  - File(path)
  - Directory(host, path)
  - PortForward(host, port)
  - Endpoint(path)
  - Version(service)
  - Hostname(host)
  - Misconfiguration(service)
injects:
- service
inject_candidate_paths:
- /etc/bind/reverse
- /srv/dns/reverse
- /var/cache/bind/reverse
- /tmp/dns_reverse
access_instructions:
  title: Reverse Zone Note
  steps:
  - step: 1
    title: Connect to the generated service
    instructions: '```bash

      nc {{NODE}} {{PORT}}

      ```

      '
  - step: 2
    title: Enumerate and retrieve the marker
    instructions: '```text

      INFO

      TXT {{FLAG_FILE}}

      GET {{FLAG_FILE}}

      ```

      '
  - step: 3
    title: Record the recovered marker
    instructions: Record the flag and any credential or service context before continuing.
hint_template: The reverse zone has a TXT side note near the PTR records.
hint_levels:
  low:
  - The reverse zone has a TXT side note near the PTR records.
  medium:
  - 'File/artifact: {{OUTPUT.File(path):basename}}'
  high:
  - Connect to the generated service
  - Enumerate and retrieve the marker
  - 'Record the recovered marker: Record the flag and any credential or service context
    before continuing.'
