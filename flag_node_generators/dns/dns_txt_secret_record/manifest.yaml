manifest_version: 1
id: dns_txt_secret_record
kind: flag-node-generator
name: 'DNS: TXT Secret Record'
description: DNS-style TXT record challenge with a vault recovery marker.
hint_template: Service records can reveal more than host addresses.
runtime:
  type: docker-compose
  compose_file: docker-compose.yml
  service: generator
env:
  SERVICE_VARIANT_ID: dns_txt_secret_record
inputs:
- name: seed
  type: string
  required: true
- name: node_name
  type: string
  required: true
- name: flag_prefix
  type: string
  required: false
- name: service_port
  type: number
  required: false
  default: 1053
artifacts:
  requires:
  - Knowledge(ip)
  produces:
  - Flag(flag_id)
  - FlagDelivery(mode)
  - FlagFile(path)
  - File(path)
  - Directory(host, path)
  - PortForward(host, port)
  - Endpoint(path)
  - Version(service)
  - Hostname(host)
  - ExposedSecret(service)
injects:
- service
inject_candidate_paths:
- /etc/bind/records
- /var/named/txt
- /srv/dns/records
- /opt/dns/vault
access_instructions:
  title: DNS TXT Record
  steps:
  - step: 1
    title: Connect to the DNS-style service
    instructions: '```bash

      nc {{NODE}} {{PORT}}

      ```

      '
  - step: 2
    title: Request the TXT record
    instructions: '```text

      TXT vault.internal.example.test

      GET {{FLAG_FILE}}

      ```

      '
  - step: 3
    title: Record the vault marker
    instructions: Record the flag from the TXT record file.
hint_levels:
  low:
  - Service records can reveal more than host addresses.
  medium:
  - 'Service: DNS TXT Record. Target: {{THIS_NODE_NAME}}; TCP port: {{OUTPUT.PortForward(host, port)}}.'
  - |-
    Check the assigned port:
    ```bash
    nmap -sT -sV -p {{OUTPUT.PortForward(host, port)}} {{THIS_NODE_NAME}}
    ```
  - This service accepts a line-oriented text protocol. Connect with nc, then enter the commands shown in the high hint in
    that same session.
  high:
  - 'Answer: {{OUTPUT.Flag(flag_id)}}'
  - |-
    Connect to the DNS-style service:
    ```bash
    nc {{THIS_NODE_NAME}} {{OUTPUT.PortForward(host, port)}}
    ```
  - |-
    Request the TXT record:
    ```text
    TXT vault.internal.example.test
    GET {{OUTPUT.FlagFile(path)}}
    ```
