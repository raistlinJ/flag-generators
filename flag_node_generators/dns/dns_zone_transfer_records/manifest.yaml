manifest_version: 1
id: dns_zone_transfer_records
kind: flag-node-generator
name: 'DNS: Zone Transfer Records'
description: DNS-style zone transfer challenge exposing internal host records and
  a TXT marker.
hint_template: Service records can reveal more than host addresses.
runtime:
  type: docker-compose
  compose_file: docker-compose.yml
  service: generator
env:
  SERVICE_VARIANT_ID: dns_zone_transfer_records
inputs:
- name: seed
  type: string
  required: true
- name: node_name
  type: string
  required: true
- name: flag_prefix
  type: string
  required: false
- name: service_port
  type: number
  required: false
  default: 1053
artifacts:
  requires:
  - Knowledge(ip)
  produces:
  - Flag(flag_id)
  - FlagDelivery(mode)
  - FlagFile(path)
  - File(path)
  - Directory(host, path)
  - PortForward(host, port)
  - Endpoint(path)
  - Version(service)
  - Hostname(host)
  - Misconfiguration(service)
injects:
- service
inject_candidate_paths:
- /etc/bind/zones
- /var/named
- /srv/dns/zones
- /opt/dns/internal
access_instructions:
  title: DNS Zone Transfer
  steps:
  - step: 1
    title: Connect to the DNS-style service
    instructions: '```bash

      nc {{NODE}} {{PORT}}

      ```

      '
  - step: 2
    title: Request the zone transfer
    instructions: '```text

      AXFR internal.example.test

      GET {{FLAG_FILE}}

      ```

      '
  - step: 3
    title: Record the TXT marker
    instructions: Record the flag from the leaked zone data.
hint_levels:
  low:
  - Service records can reveal more than host addresses.
  medium:
  - 'Service: DNS Zone Transfer. Target: {{THIS_NODE_NAME}}; TCP port: {{OUTPUT.PortForward(host, port)}}.'
  - |-
    Check the assigned port:
    ```bash
    nmap -sT -sV -p {{OUTPUT.PortForward(host, port)}} {{THIS_NODE_NAME}}
    ```
  - This service accepts a line-oriented text protocol. Connect with nc, then enter the commands shown in the high hint in
    that same session.
  high:
  - 'Answer: {{OUTPUT.Flag(flag_id)}}'
  - |-
    Connect to the DNS-style service:
    ```bash
    nc {{THIS_NODE_NAME}} {{OUTPUT.PortForward(host, port)}}
    ```
  - |-
    Request the zone transfer:
    ```text
    AXFR internal.example.test
    GET {{OUTPUT.FlagFile(path)}}
    ```
