manifest_version: 1
id: dns_zone_transfer_records
kind: flag-node-generator
name: 'DNS: Zone Transfer Records'
description: DNS-style zone transfer challenge exposing internal host records and
  a TXT marker.
hint_template: Ask the DNS service for the internal zone before moving to {{NEXT_NODE_NAME}}.
runtime:
  type: docker-compose
  compose_file: docker-compose.yml
  service: generator
env:
  SERVICE_VARIANT_ID: dns_zone_transfer_records
inputs:
- name: seed
  type: string
  required: true
- name: node_name
  type: string
  required: true
- name: flag_prefix
  type: string
  required: false
- name: service_port
  type: number
  required: false
  default: 1053
artifacts:
  requires:
  - Knowledge(ip)
  produces:
  - Flag(flag_id)
  - FlagDelivery(mode)
  - FlagFile(path)
  - File(path)
  - Directory(host, path)
  - PortForward(host, port)
  - Endpoint(path)
  - Version(service)
  - Hostname(host)
  - Misconfiguration(service)
injects:
- service
inject_candidate_paths:
- /etc/bind/zones
- /var/named
- /srv/dns/zones
- /opt/dns/internal
access_instructions:
  title: DNS Zone Transfer
  steps:
  - step: 1
    title: Connect to the DNS-style service
    instructions: '```bash

      nc {{NODE}} {{PORT}}

      ```

      '
  - step: 2
    title: Request the zone transfer
    instructions: '```text

      AXFR internal.example.test

      GET {{FLAG_FILE}}

      ```

      '
  - step: 3
    title: Record the TXT marker
    instructions: Record the flag from the leaked zone data.
hint_levels:
  low:
  - Ask the DNS service for the internal zone before moving to {{NEXT_NODE_NAME}}.
  medium:
  - 'File/artifact: {{OUTPUT.File(path):basename}}'
  high:
  - Connect to the DNS-style service
  - Request the zone transfer
  - 'Record the TXT marker: Record the flag from the leaked zone data.'
