manifest_version: 1
id: mqtt_credentialed_ops_topic
kind: flag-node-generator
name: 'MQTT: Credentialed Ops Topic'
description: Credentialed MQTT-style broker topic for private operations dispatch
  messages.
hint_template: Use the MQTT credentials before moving to {{NEXT_NODE_NAME}}.
runtime:
  type: docker-compose
  compose_file: docker-compose.yml
  service: generator
env:
  SERVICE_VARIANT_ID: mqtt_credentialed_ops_topic
inputs:
- name: seed
  type: string
  required: true
- name: node_name
  type: string
  required: true
- name: flag_prefix
  type: string
  required: false
- name: service_port
  type: number
  required: false
  default: 1883
- name: Credential(user
  password): null
  type: string
  required: false
  sensitive: true
  flow_supply_when_first: true
artifacts:
  requires:
  - Knowledge(ip)
  optional_requires:
  - Credential(user
  - password)
  produces:
  - Flag(flag_id)
  - FlagDelivery(mode)
  - FlagFile(path)
  - Credential(user
  - password)
  - File(path)
  - Directory(host
  - path)
  - PortForward(host
  - port)
  - Endpoint(path)
  - Version(service)
injects:
- service
inject_candidate_paths:
- /var/lib/mosquitto/private
- /srv/mqtt/ops
- /opt/broker/private
- /home/mqtt/ops
access_instructions:
  title: Credentialed MQTT-Style Topic
  steps:
  - step: 1
    title: Connect to the broker-style service
    instructions: '```bash

      nc {{NODE}} {{PORT}}

      ```

      '
  - step: 2
    title: Authenticate and subscribe
    instructions: '```text

      AUTH {{USERNAME}} {{PASSWORD}}

      SUB ops/private

      GET {{FLAG_FILE}}

      ```

      '
  - step: 3
    title: Record the operations marker
    instructions: Record the flag from the private operations topic.
hint_levels:
  low:
  - Use the MQTT credentials before moving to {{NEXT_NODE_NAME}}.
  medium:
  - 'Credential artifact: {{OUTPUT.Credential(user,password)}}'
  high:
  - Connect to the broker-style service
  - Authenticate and subscribe
  - 'Record the operations marker: Record the flag from the private operations topic.'
