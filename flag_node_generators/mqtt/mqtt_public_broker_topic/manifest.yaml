manifest_version: 1
id: mqtt_public_broker_topic
kind: flag-node-generator
name: 'MQTT: Public Broker Topic'
description: MQTT-style broker topic with public site alert messages and a token.
hint_template: Subscribe to the public MQTT-style topic before moving to {{NEXT_NODE_NAME}}.
runtime:
  type: docker-compose
  compose_file: docker-compose.yml
  service: generator
env:
  SERVICE_VARIANT_ID: mqtt_public_broker_topic
inputs:
- name: seed
  type: string
  required: true
- name: node_name
  type: string
  required: true
- name: flag_prefix
  type: string
  required: false
- name: service_port
  type: number
  required: false
  default: 1883
artifacts:
  requires:
  - Knowledge(ip)
  produces:
  - Flag(flag_id)
  - FlagDelivery(mode)
  - FlagFile(path)
  - File(path)
  - Directory(host
  - path)
  - PortForward(host
  - port)
  - Endpoint(path)
  - Version(service)
  - Token(service)
  - Misconfiguration(service)
injects:
- service
inject_candidate_paths:
- /var/lib/mosquitto
- /srv/mqtt/topics
- /opt/broker/public
- /home/mqtt/site
access_instructions:
  title: Public MQTT-Style Topic
  steps:
  - step: 1
    title: Connect to the broker-style service
    instructions: '```bash

      nc {{NODE}} {{PORT}}

      ```

      '
  - step: 2
    title: Subscribe to the public topic
    instructions: '```text

      SUB site/alerts

      GET {{FLAG_FILE}}

      ```

      '
  - step: 3
    title: Record the broker marker
    instructions: Record the flag and token from the public topic.
hint_levels:
  low:
  - Subscribe to the public MQTT-style topic before moving to {{NEXT_NODE_NAME}}.
  medium:
  - 'File/artifact: {{OUTPUT.File(path):basename}}'
  high:
  - Connect to the broker-style service
  - Subscribe to the public topic
  - 'Record the broker marker: Record the flag and token from the public topic.'
