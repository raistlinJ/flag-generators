manifest_version: 1
id: mqtt_public_broker_topic
kind: flag-node-generator
name: 'MQTT: Public Broker Topic'
description: MQTT-style broker topic with public site alert messages and a token.
hint_template: Consider what messages a subscriber can receive.
runtime:
  type: docker-compose
  compose_file: docker-compose.yml
  service: generator
env:
  SERVICE_VARIANT_ID: mqtt_public_broker_topic
inputs:
- name: seed
  type: string
  required: true
- name: node_name
  type: string
  required: true
- name: flag_prefix
  type: string
  required: false
- name: service_port
  type: number
  required: false
  default: 1883
artifacts:
  requires:
  - Knowledge(ip)
  produces:
  - Flag(flag_id)
  - FlagDelivery(mode)
  - FlagFile(path)
  - File(path)
  - Directory(host, path)
  - PortForward(host, port)
  - Endpoint(path)
  - Version(service)
  - Token(service)
  - Misconfiguration(service)
injects:
- service
inject_candidate_paths:
- /var/lib/mosquitto
- /srv/mqtt/topics
- /opt/broker/public
- /home/mqtt/site
access_instructions:
  title: Public MQTT-Style Topic
  steps:
  - step: 1
    title: Connect to the broker-style service
    instructions: '```bash

      nc {{NODE}} {{PORT}}

      ```

      '
  - step: 2
    title: Subscribe to the public topic
    instructions: '```text

      SUB site/alerts

      GET {{FLAG_FILE}}

      ```

      '
  - step: 3
    title: Record the broker marker
    instructions: Record the flag and token from the public topic.
hint_levels:
  low:
  - Consider what messages a subscriber can receive.
  medium:
  - 'Service: Public MQTT-Style Topic. Target: {{THIS_NODE_NAME}}; TCP port: {{OUTPUT.PortForward(host, port)}}.'
  - |-
    Check the assigned port:
    ```bash
    nmap -sT -sV -p {{OUTPUT.PortForward(host, port)}} {{THIS_NODE_NAME}}
    ```
  - This service accepts a line-oriented text protocol. Connect with nc, then enter the commands shown in the high hint in
    that same session.
  high:
  - 'Answer: {{OUTPUT.Flag(flag_id)}}'
  - |-
    Connect to the broker-style service:
    ```bash
    nc {{THIS_NODE_NAME}} {{OUTPUT.PortForward(host, port)}}
    ```
  - |-
    Subscribe to the public topic:
    ```text
    SUB site/alerts
    GET {{OUTPUT.FlagFile(path)}}
    ```
