services:
  generator:
    image: python:3.12-slim
    working_dir: /app
    command: ["python", "/app/generator.py"]
    environment:
      INPUTS_DIR: /inputs
      OUTPUTS_DIR: /outputs
      NFS_VARIANT_ID: ${NFS_VARIANT_ID}
    volumes:
      - ./generator.py:/app/generator.py:ro
      - ${INPUTS_DIR}:/inputs:ro
      - ${OUTPUTS_DIR}:/outputs
