manifest_version: 1
id: '102'
kind: flag-node-generator
name: 'NFS: Legal Hold Archive'
description: Generate an NFSv4 legal archive where a required credential unlocks the
  flagged hold note.
runtime:
  type: docker-compose
  compose_file: docker-compose.yml
  service: generator
env:
  NFS_VARIANT_ID: nfs_legal_hold_archive
inputs:
- name: seed
  type: string
  required: true
- name: node_name
  type: string
  required: true
- name: flag_prefix
  type: string
  required: false
- name: nfs_port
  type: number
  required: false
  default: 2049
- name: Credential(user, password)
  type: string
  required: true
  flow_supply_when_first: true
artifacts:
  requires:
  - Knowledge(ip)
  - Credential(user, password)
  optional_requires: []
  produces:
  - Flag(flag_id)
  - FlagDelivery(mode)
  - FlagFile(path)
  - Credential(user, password)
  - File(path)
  - PortForward(host, port)
  - Directory(host, path)
injects:
- exports
inject_candidate_paths:
- /srv/nfs/legal
- /mnt/legalhold
- /opt/archives/legal
- /var/tmp/nfs_legal
access_instructions:
  title: Legal Hold NFS Archive
  steps:
  - step: 1
    title: Mount the NFS export
    instructions: 'From another Docker container in this scenario, install NFS utilities
      and mount the export:


      ```bash

      apt-get update && apt-get install -y nfs-common

      mkdir -p /mnt/legalhold

      mount -t nfs4 -o vers=4,port={{PORT}} {{NODE}}:{{PATH}} /mnt/legalhold

      ```

      '
    vars:
      PORT: PortForward(host, port)
      NODE: node_name
      PATH: Directory(host, path)
  - step: 2
    title: Review the exported files
    instructions: 'List the share and read the flagged artifact:


      ```bash

      ls -la /mnt/legalhold

      cat /mnt/legalhold/{{FLAG_FILE}}

      ```

      '
    vars:
      FLAG_FILE: FlagFile(path)
  - step: 3
    title: Record collected artifacts
    instructions: Record the recovered flag and any credential context from the share
      before continuing.
hint_levels:
  low:
  - Use the supplied credential when reviewing the legal hold export.
  medium:
  - 'Credential or export artifact: {{OUTPUT.Credential(user,password)}}'
  high:
  - 'Mount the NFS export: From another Docker container in this scenario, install
    NFS utilities and mount the export:'
  - 'Review the exported files: List the share and read the flagged artifact:'
  - 'Record collected artifacts: Record the recovered flag and any credential context
    from the share before continuing.'
