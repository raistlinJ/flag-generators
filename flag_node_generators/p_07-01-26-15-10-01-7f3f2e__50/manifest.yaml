manifest_version: 1
id: '50'
kind: flag-node-generator
name: 'FTP: Authenticated Backup Home'
description: Credentialed FTP-style backup landing area with restore notes and a backup
  archive.
hint_template: Use the backup FTP credentials before continuing to {{NEXT_NODE_NAME}}.
runtime:
  type: docker-compose
  compose_file: docker-compose.yml
  service: generator
env:
  SERVICE_VARIANT_ID: ftp_user_backup_home
inputs:
- name: seed
  type: string
  required: true
- name: node_name
  type: string
  required: true
- name: flag_prefix
  type: string
  required: false
- name: service_port
  type: number
  required: false
  default: 2121
- name: Credential(user
  password): null
  type: string
  required: false
  sensitive: true
  flow_supply_when_first: true
artifacts:
  requires:
  - Knowledge(ip)
  optional_requires:
  - Credential(user
  - password)
  produces:
  - Flag(flag_id)
  - FlagDelivery(mode)
  - FlagFile(path)
  - Credential(user
  - password)
  - File(path)
  - Directory(host
  - path)
  - PortForward(host
  - port)
  - Endpoint(path)
  - Version(service)
  - BackupArchive(file)
injects:
- service
inject_candidate_paths:
- /srv/ftp/backups
- /var/ftp/backup-home
- /opt/restore/drop
- /home/backupftp
access_instructions:
  title: Backup FTP Access
  steps:
  - step: 1
    title: Connect to the FTP-style service
    instructions: '```bash

      nc {{NODE}} {{PORT}}

      ```

      '
  - step: 2
    title: Authenticate and inspect backups
    instructions: '```text

      AUTH {{USERNAME}} {{PASSWORD}}

      LIST

      GET {{FLAG_FILE}}

      ```

      '
  - step: 3
    title: Record the backup findings
    instructions: Record the flag and note the generated backup archive path.
hint_levels:
  low:
  - Use the backup FTP credentials before continuing to {{NEXT_NODE_NAME}}.
  medium:
  - 'Credential artifact: {{OUTPUT.Credential(user,password)}}'
  high:
  - Connect to the FTP-style service
  - Authenticate and inspect backups
  - 'Record the backup findings: Record the flag and note the generated backup archive
    path.'
